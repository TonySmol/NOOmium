/**
 * Векторная математика: кодирование для Nostr-тегов, косинусное сходство,
 * нормализация и k-means для центроидов.
 *
 * Сетевая упаковка — Int16-квантование: нормализованные значения [-1,1]
 * → [-32767,32767]. Размер тега вдвое меньше сырого Float32 (1024 байта
 * base64 вместо 2048) — влезает в лимиты рэлеев на значение тега.
 * Локальная точность не страдает: квантуется только упаковка.
 *
 * @exports Vec
 */
DI.register('Vec', function () {
  /** Приводит вход к Float32Array. @param {*} v @returns {Float32Array} */
  const f32 = v => (v instanceof Float32Array ? v : Float32Array.from(v || []));

  /**
   * Вектор → компактный base64 (Int16) для тега ['v', …].
   * @param {Float32Array|number[]} vec
   * @returns {string}
   */
  function toB64(vec) {
    const f = f32(vec);
    const i16 = new Int16Array(f.length);
    for (let i = 0; i < f.length; i++) {
      let x = f[i];
      if (x > 1) x = 1; else if (x < -1) x = -1;
      i16[i] = Math.round(x * 32767);
    }
    const bytes = new Uint8Array(i16.buffer, i16.byteOffset, i16.byteLength);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  /**
   * base64 (Int16) → вектор. Защитный: на битых данных вернёт null.
   * @param {string} b64
   * @returns {Float32Array|null}
   */
  function fromB64(b64) {
    try {
      const bin = atob(String(b64 || ''));
      if (!bin || bin.length < 2 || bin.length % 2 !== 0) return null;
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const i16 = new Int16Array(bytes.buffer);
      const out = new Float32Array(i16.length);
      for (let i = 0; i < i16.length; i++) out[i] = i16[i] / 32767;
      return normalize(out);   // ренормализуем после деквантования
    } catch (_) { return null; }
  }

  /**
   * Косинусное сходство нормализованных векторов.
   * @param {Float32Array|number[]} a @param {Float32Array|number[]} b
   * @returns {number}
   */
  function cosine(a, b) {
    if (!a || !b) return 0;
    const n = Math.min(a.length, b.length);
    if (!n) return 0;
    let s = 0;
    for (let i = 0; i < n; i++) s += a[i] * b[i];
    return s;
  }

  /**
   * Нормализация до единичной длины.
   * @param {Float32Array|number[]} v
   * @returns {Float32Array}
   */
  function normalize(v) {
    const f = f32(v);
    let norm = 0;
    for (let i = 0; i < f.length; i++) norm += f[i] * f[i];
    norm = Math.sqrt(norm);
    const out = new Float32Array(f.length);
    if (!norm) return out;
    for (let i = 0; i < f.length; i++) out[i] = f[i] / norm;
    return out;
  }

  /** Квадрат евклидова расстояния. @param {*} a @param {*} b @returns {number} */
  function sqDist(a, b) {
    const n = Math.min(a.length, b.length);
    let s = 0;
    for (let i = 0; i < n; i++) { const d = a[i] - b[i]; s += d * d; }
    return s;
  }

  /**
   * k-means (Ллойд) с детерминированным farthest-point стартом.
   * @param {Array<Float32Array|number[]>} vectors
   * @param {number} k
   * @param {number} [iterations=10]
   * @returns {Float32Array[]} Центроиды.
   */
  function kmeans(vectors, k, iterations) {
    const iters = iterations || 10;
    const n = vectors.length;
    if (!n || !k) return [];
    if (n <= k) return vectors.map(v => f32(v));
    const dim = vectors[0].length;

    const cents = [f32(vectors[0])];
    while (cents.length < k) {
      let bestI = 0, bestD = -1;
      for (let i = 0; i < n; i++) {
        let minD = Infinity;
        for (const c of cents) { const d = sqDist(vectors[i], c); if (d < minD) minD = d; }
        if (minD > bestD) { bestD = minD; bestI = i; }
      }
      cents.push(f32(vectors[bestI]));
    }

    for (let it = 0; it < iters; it++) {
      const sums = Array.from({ length: k }, () => new Float32Array(dim));
      const counts = new Array(k).fill(0);
      for (let i = 0; i < n; i++) {
        let best = 0, bestD = Infinity;
        for (let c = 0; c < k; c++) { const d = sqDist(vectors[i], cents[c]); if (d < bestD) { bestD = d; best = c; } }
        counts[best]++;
        for (let d = 0; d < dim; d++) sums[best][d] += vectors[i][d];
      }
      for (let c = 0; c < k; c++) {
        if (counts[c]) for (let d = 0; d < dim; d++) cents[c][d] = sums[c][d] / counts[c];
      }
    }
    return cents;
  }

  return { toB64, fromB64, cosine, normalize, kmeans };
}, []);
// ─── DATA/Vec ─── END ────────────────────────────────────────

// ─── DATA/DB ─── START ───────────────────────────────────────
/**
 * Персистентное хранилище: IndexedDB с прозрачным in-memory fallback.
 *
 * Два объектных хранилища:
 *   notes — заметки пользователя {id,text,vector,shared,parentId?,parentPubkey?,createdAt,updatedAt,eventId?};
 *   cache — принятые из сети заметки (их id = Nostr eventId).
 *
 * Мутации notes эмитят 'db:change', мутации cache — 'db:cache'
 * (по ним инвалидируются Feed/Influence/Provenance).
 * cacheDel нужен NetService для kind-5 (NIP-09) удаления из кэша.
 *
 * @deps Config, EventBus, Logger
 * @exports DB
 */
DI.register('DB', function (Config, bus, Logger) {
  /** @type {IDBDatabase|null} */ let db = null;
  /** @type {Map|null} */ let mem = null;        // fallback: notes
  /** @type {Map|null} */ let memCache = null;   // fallback: cache
  /** @type {Promise|null} */ let openPromise = null;

  const NOTES = () => Config.get('storeName', 'notes');
  const CACHE = () => Config.get('cacheStoreName', 'cache');

  function emitChange() { try { bus.emit('db:change'); } catch (_) {} }
  function emitCache()  { try { bus.emit('db:cache'); } catch (_) {} }

  /**
   * Открывает IDB (создаёт хранилища при первом запуске).
   * При недоступности — in-memory fallback. Кэширует результат.
   * @returns {Promise<IDBDatabase|null>}
   */
  function open() {
    if (openPromise) return openPromise;
    openPromise = new Promise(resolve => {
      if (!window.indexedDB) {
        mem = new Map(); memCache = new Map();
        Logger.warn('DB: IndexedDB недоступен, in-memory fallback');
        return resolve(null);
      }
      try {
        const req = indexedDB.open(Config.get('dbName', 'noomium_v2'), 1);
        req.onupgradeneeded = e => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains(NOTES())) d.createObjectStore(NOTES(), { keyPath: 'id' });
          if (!d.objectStoreNames.contains(CACHE())) d.createObjectStore(CACHE(), { keyPath: 'id' });
        };
        req.onsuccess = e => { db = e.target.result; resolve(db); };
        req.onerror = () => { mem = new Map(); memCache = new Map(); Logger.warn('DB: ошибка открытия, fallback'); resolve(null); };
        req.onblocked = () => { mem = new Map(); memCache = new Map(); Logger.warn('DB: open blocked, fallback'); resolve(null); };
      } catch (err) {
        mem = new Map(); memCache = new Map();
        Logger.warn('DB: не поддерживается, fallback', String(err));
        resolve(null);
      }
    });
    return openPromise;
  }

  /**
   * Обёртка: выполняет операцию над store, возвращает Promise.
   * В fallback-режиме синхронно работает с Map.
   * @param {string} store - Имя хранилища.
   * @param {'readonly'|'readwrite'} mode
   * @param {function(Object):Object} fn - (store) => IDBRequest.
   * @param {Function} memFn - fallback на Map.
   * @returns {Promise<*>}
   */
  function withStore(store, mode, fn, memFn) {
    return open().then(d => {
      if (!d) return memFn();
      return new Promise((res, rej) => {
        try {
          const r = fn(d.transaction(store, mode).objectStore(store));
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        } catch (e) { rej(e); }
      });
    });
  }

  // ── NOTES ──

  /**
   * Создаёт/обновляет заметку. Эмитит db:change.
   * @param {Object} note - С обязательным id.
   * @returns {Promise<*>}
   */
  function put(note) {
    return withStore(NOTES(), 'readwrite', s => s.put(note), () => { mem.set(note.id, note); return note.id; })
      .then(res => { emitChange(); return res; });
  }

  /**
   * Читает заметку по id.
   * @param {string} id
   * @returns {Promise<Object|undefined>}
   */
  function get(id) {
    return withStore(NOTES(), 'readonly', s => s.get(id), () => mem.get(id));
  }

  /**
   * Удаляет заметку. Эмитит db:change.
   * @param {string} id
   * @returns {Promise<*>}
   */
  function del(id) {
    return withStore(NOTES(), 'readwrite', s => s.delete(id), () => { mem.delete(id); })
      .then(res => { emitChange(); return res; });
  }

  /**
   * Все заметки.
   * @returns {Promise<Object[]>}
   */
  function all() {
    return withStore(NOTES(), 'readonly', s => s.getAll(), () => Array.from(mem.values()));
  }

  /**
   * Количество заметок.
   * @returns {Promise<number>}
   */
  function count() {
    return withStore(NOTES(), 'readonly', s => s.count(), () => mem.size);
  }

  /**
   * Порция заметок через курсор (экономит память на больших базах).
   * @param {number} offset - Пропустить.
   * @param {number} limit - Взять.
   * @returns {Promise<Object[]>}
   */
  function getAllPaginated(offset, limit) {
    return open().then(d => {
      if (!d) return Array.from(mem.values()).slice(offset, offset + limit);
      return new Promise((res, rej) => {
        const r = d.transaction(NOTES(), 'readonly').objectStore(NOTES()).openCursor();
        const out = [];
        let skipped = 0;
        r.onsuccess = e => {
          const cur = e.target.result;
          if (!cur || out.length >= limit) return res(out);
          if (skipped < offset) { skipped++; cur.continue(); return; }
          out.push(cur.value);
          cur.continue();
        };
        r.onerror = () => rej(r.error);
      });
    });
  }

  /**
   * Массовая запись в одной транзакции (импорт). Эмитит db:change.
   * @param {Object[]} notes
   * @returns {Promise<number>} Число записанных.
   */
  function bulkPut(notes) {
    return open().then(d => {
      if (!d) { notes.forEach(n => mem.set(n.id, n)); return notes.length; }
      return new Promise((res, rej) => {
        const t = d.transaction(NOTES(), 'readwrite');
        const s = t.objectStore(NOTES());
        notes.forEach(n => s.put(n));
        t.oncomplete = () => res(notes.length);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error);
      });
    }).then(n => { emitChange(); return n; });
  }

  /**
   * Полная очистка обеих stores (danger zone). Эмитит db:change.
   * @returns {Promise<void>}
   */
  function reset() {
    return open().then(d => {
      if (!d) { mem.clear(); memCache.clear(); return; }
      return new Promise((res, rej) => {
        const t = d.transaction([NOTES(), CACHE()], 'readwrite');
        t.objectStore(NOTES()).clear();
        t.objectStore(CACHE()).clear();
        t.oncomplete = () => res();
        t.onerror = () => rej(t.error);
      });
    }).then(() => { emitChange(); });
  }

  // ── CACHE (сетевые заметки) ──

  /** @param {Object} note @returns {Promise<*>} */
  function cachePut(note) {
    return withStore(CACHE(), 'readwrite', s => s.put(note), () => { memCache.set(note.id, note); return note.id; })
      .then(res => { emitCache(); return res; });
  }
  /** @param {string} id @returns {Promise<Object|undefined>} */
  function cacheGet(id) {
    return withStore(CACHE(), 'readonly', s => s.get(id), () => memCache.get(id));
  }
  /** @returns {Promise<Object[]>} */
  function cacheAll() {
    return withStore(CACHE(), 'readonly', s => s.getAll(), () => Array.from(memCache.values()));
  }
  /**
   * Удаляет заметку из кэша (для kind-5 удаления). Эмитит db:cache.
   * @param {string} id
   * @returns {Promise<*>}
   */
  function cacheDel(id) {
    return withStore(CACHE(), 'readwrite', s => s.delete(id), () => { memCache.delete(id); })
      .then(res => { emitCache(); return res; });
  }
  /** @returns {Promise<void>} */
  function cacheClear() {
    return withStore(CACHE(), 'readwrite', s => s.clear(), () => { memCache.clear(); })
      .then(res => { emitCache(); return res; });
  }

  return { put, get, del, all, count, getAllPaginated, bulkPut, reset, cachePut, cacheGet, cacheAll, cacheDel, cacheClear };
}, ['Config', 'EventBus', 'Logger']);
// ─── DATA/DB ─── END ─────────────────────────────────────────

// ─── AI/Embedder ─── START ───────────────────────────────────
/**
 * Эмбеддинги в Web Worker (transformers.js, ленивая загрузка модели).
 *
 * Режимы: 'loading' → 'model' (успех) или 'demo' (fallback на hash-эмбеддинг).
 * В 'demo' и до вызова load() embed() мгновенно возвращает детерминированный
 * hash-вектор — приложение работает всегда, просто поиск грубее.
 *
 * Прогресс загрузки транслируется через 'ai:progress' и 'ai:status'
 * (их слушают Progress и HeaderStatus). Ошибка/таймаут отдельного embed
 * не роняет ничего — тихий hash-fallback.
 *
 * @deps Config, EventBus, Logger
 * @exports Embedder
 */
DI.register('Embedder', function (Config, bus, Logger) {
  /** Код Worker'а строкой: изолированный поток, модель не трогает UI. */
  const workerCode = `
let extractor = null;
let ready = false;
self.onmessage = async function (e) {
  const msg = e.data;
  if (msg.type === 'load') {
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
      mod.env.allowLocalModels = false;
      mod.env.useBrowserCache = true;
      extractor = await mod.pipeline('feature-extraction', msg.model, {
        quantized: true,
        progress_callback: function (p) {
          if (p.status === 'progress' && p.total > 0) {
            self.postMessage({ type: 'progress', pct: p.loaded / p.total * 100 });
          }
        }
      });
      ready = true;
      self.postMessage({ type: 'ready' });
    } catch (err) {
      self.postMessage({ type: 'error', id: null, message: String(err && err.message || err) });
    }
    return;
  }
  if (!ready) { self.postMessage({ type: 'error', id: msg.id, message: 'model not loaded' }); return; }
  if (msg.type === 'embed') {
    try {
      const out = await extractor(msg.text, { pooling: 'mean', normalize: true });
      self.postMessage({ type: 'result', id: msg.id, vector: Array.from(out.data) });
    } catch (err) {
      self.postMessage({ type: 'error', id: msg.id, message: String(err && err.message || err) });
    }
  }
};
`;

  /** @type {Worker|null} */ let worker = null;
  /** @type {string|null} */ let workerUrl = null;
  /** @type {'loading'|'model'|'demo'} */ let mode = 'loading';
  /** @type {Promise|null} */ let loadPromise = null;
  /** @type {number} */ let nextId = 0;
  /** @type {number} */ let lastPct = 0;
  /** @type {Map<number,{resolve:Function,timer:number,text:string}>} */ const pending = new Map();
  /** @type {Function[]} */ const progressFns = [];
  /** LRU-кэш «текст → вектор». @type {Map<string,Float32Array>} */ const cache = new Map();

  function emitStatus() {
    try { bus.emit('ai:status', { mode, percent: lastPct }); } catch (_) {}
  }

  /**
   * Детерминированный hash-эмбеддинг (FNV-1a по токенам). Fallback, когда
   * модели нет: низкое качество, но мгновенно, стабильно и без сети.
   * @param {string} text
   * @returns {Float32Array} Нормализованный вектор размерности dim.
   */
  function hashEmbed(text) {
    const DIM = Config.get('dim', 384);
    const vec = new Float32Array(DIM);
    const tokens = (text || '').toLowerCase().match(/[a-zа-яё0-9]+/gi) || [];
    for (const tok of tokens) {
      let h = 2166136261;
      for (let i = 0; i < tok.length; i++) { h ^= tok.charCodeAt(i); h = Math.imul(h, 16777619); }
      vec[Math.abs(h) % DIM] += 1;
      const h2 = Math.imul(h ^ 0x9e3779b9, 2654435761);
      vec[Math.abs(h2) % DIM] += 0.5;
    }
    let norm = 0;
    for (let i = 0; i < DIM; i++) norm += vec[i] * vec[i];
    norm = Math.sqrt(norm) || 1;
    for (let i = 0; i < DIM; i++) vec[i] /= norm;
    return vec;
  }

  /** LRU: чтение освежает позицию. @param {string} key */
  function cacheGet(key) {
    if (!cache.has(key)) return undefined;
    const v = cache.get(key);
    cache.delete(key); cache.set(key, v);
    return v;
  }
  /** LRU: вытесняет самый старый при переполнении. */
  function cacheSet(key, v) {
    if (cache.has(key)) cache.delete(key);
    else if (cache.size >= Config.get('aiCacheLimit', 300)) cache.delete(cache.keys().next().value);
    cache.set(key, v);
  }

  /** Завершает Worker, разрешает зависшие embed'ы hash-fallback'ом. */
  function cleanup() {
    pending.forEach(p => {
      clearTimeout(p.timer);
      const v = hashEmbed(p.text);
      cacheSet(p.text, v);
      p.resolve(v);
    });
    pending.clear();
    if (worker) { try { worker.terminate(); } catch (_) {} worker = null; }
    if (workerUrl) { try { URL.revokeObjectURL(workerUrl); } catch (_) {} workerUrl = null; }
  }

  /**
   * Создаёт Worker и грузит модель. Резолвится по 'ready'; при любой ошибке
   * переводит в 'demo' и резолвится (не реджектит) — приложение продолжает жить.
   * @returns {Promise<void>}
   */
  function doLoad() {
    return new Promise(resolve => {
      if (typeof Worker === 'undefined') {
        mode = 'demo'; emitStatus();
        Logger.warn('Embedder: Worker не поддерживается, demo mode');
        return resolve();
      }
      try {
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        workerUrl = URL.createObjectURL(blob);
        worker = new Worker(workerUrl, { type: 'module' });
      } catch (err) {
        mode = 'demo'; emitStatus();
        Logger.warn('Embedder: не создать Worker, demo mode', String(err));
        return resolve();
      }

      worker.onerror = err => {
        Logger.warn('Embedder: ошибка Worker, demo mode', String(err && err.message || err));
        cleanup();
        mode = 'demo'; emitStatus();
        resolve();
      };

      worker.onmessage = e => {
        const msg = e.data;
        if (msg.type === 'progress') {
          lastPct = msg.pct;
          for (const fn of progressFns) { try { fn(msg.pct); } catch (_) {} }
          try { bus.emit('ai:progress', { pct: msg.pct }); } catch (_) {}
          try { bus.emit('ai:status', { mode: 'loading', percent: msg.pct }); } catch (_) {}
        } else if (msg.type === 'ready') {
          mode = 'model'; emitStatus();
          Logger.info('Embedder: модель готова');
          resolve();
        } else if (msg.type === 'error' && msg.id === null) {
          Logger.warn('Embedder: ошибка загрузки модели, demo mode', msg.message);
          cleanup();
          mode = 'demo'; emitStatus();
          resolve();
        } else if (msg.type === 'result') {
          const p = pending.get(msg.id);
          if (p) {
            clearTimeout(p.timer); pending.delete(msg.id);
            const vec = Float32Array.from(msg.vector);
            cacheSet(p.text, vec);
            p.resolve(vec);
          }
        } else if (msg.type === 'error' && msg.id != null) {
          const p = pending.get(msg.id);
          if (p) {
            clearTimeout(p.timer); pending.delete(msg.id);
            Logger.warn('Embedder: ошибка embed, hash fallback', msg.message);
            const v = hashEmbed(p.text);
            cacheSet(p.text, v);
            p.resolve(v);
          }
        }
      };

      worker.postMessage({ type: 'load', model: Config.get('model', 'Xenova/paraphrase-multilingual-MiniLM-L12-v2') });
    });
  }

  return {
    /**
     * Запускает загрузку модели (идемпотентна). Повторные вызовы возвращают
     * тот же Promise. Ошибки не пробрасываются — уходим в 'demo'.
     * @param {Function} [onProgress] - (pct:number)=>void.
     * @returns {Promise<void>}
     */
    load(onProgress) {
      if (typeof onProgress === 'function') progressFns.push(onProgress);
      if (mode === 'model' || mode === 'demo') return Promise.resolve();
      if (loadPromise) return loadPromise;
      mode = 'loading'; emitStatus();
      loadPromise = doLoad().then(() => { loadPromise = null; });
      return loadPromise;
    },

    /**
     * Вектор для текста. Кэш → Worker → hash-fallback. Пустой текст → null.
     * @param {string} text
     * @returns {Promise<Float32Array|null>}
     */
    embed(text) {
      const t = (text || '').trim();
      if (!t) return Promise.resolve(null);
      const cached = cacheGet(t);
      if (cached) return Promise.resolve(cached);
      if (mode === 'demo' || !worker) {
        const v = hashEmbed(t);
        cacheSet(t, v);
        return Promise.resolve(v);
      }
      const id = nextId++;
      return new Promise(resolve => {
        const timer = setTimeout(() => {
          if (pending.delete(id)) {
            Logger.warn('Embedder: таймаут embed, hash fallback');
            const v = hashEmbed(t);
            cacheSet(t, v);
            resolve(v);
          }
        }, Config.get('aiEmbedTimeout', 15000));
        pending.set(id, { resolve, timer, text: t });
        worker.postMessage({ type: 'embed', id, text: t });
      });
    },

    /** Готова ли векторизация (модель или demo). @returns {boolean} */
    ready() { return mode === 'model' || mode === 'demo'; },

    /** Текущий режим. @returns {'loading'|'model'|'demo'} */
    getMode() { return mode; },

    /** Подписка на прогресс загрузки. @param {Function} fn */
    onProgress(fn) { if (typeof fn === 'function') progressFns.push(fn); },
  };
}, ['Config', 'EventBus', 'Logger']);
// ─── AI/Embedder ─── END ─────────────────────────────────────

// ─── AI/Ranker ─── START ─────────────────────────────────────
/**
 * Ранжирование по векторному сходству.
 *
 * Интерфейс Promise-based и стабилен: сейчас cosineBatch считается синхронно,
 * позже его можно заменить на GPU/Worker-реализацию (Config.gpuRanking),
 * не трогая вызывающий код.
 *
 * @deps Vec, Config
 * @exports Ranker
 */
DI.register('Ranker', function (Vec, Config) {
  /**
   * Скорит массив элементов против вектора запроса, сортирует по убыванию.
   * @param {Float32Array|number[]} queryVector
   * @param {Array<{id:string, vector:(Float32Array|number[])}>} items
   * @param {AbortSignal} [signal] - Отмена (проверяется между итерациями).
   * @returns {Promise<Array<{id:string, score:number}>>}
   */
  function cosineBatch(queryVector, items, signal) {
    if (!queryVector || !items || !items.length) return Promise.resolve([]);
    if (signal && signal.aborted) return Promise.reject(new Error('aborted'));
    const out = [];
    for (const it of items) {
      if (signal && signal.aborted) return Promise.reject(new Error('aborted'));
      out.push({ id: it.id, score: Vec.cosine(queryVector, it.vector) });
    }
    out.sort((a, b) => b.score - a.score);
    return Promise.resolve(out);
  }

  /**
   * Делит скорённые элементы на relevant (≥ threshold) и seren
   * (threshold−serendipity ≤ score < threshold). Всё, что ниже, — шум.
   * @param {Array<{id:string, score:number}>} scored
   * @returns {{relevant:Array, seren:Array}}
   */
  function split(scored) {
    const threshold = Config.get('threshold', 0.7);
    const serenMin = threshold - Config.get('serendipity', 0.3);
    const relevant = [], seren = [];
    for (const s of scored) {
      if (s.score >= threshold) relevant.push(s);
      else if (s.score >= serenMin) seren.push(s);
    }
    return { relevant, seren };
  }

  /**
   * «Это почти тот же вектор?» — для дедупликации запросов в сеть.
   * @param {Float32Array|number[]} a
   * @param {Float32Array|number[]} b
   * @returns {boolean}
   */
  function isSimilar(a, b) {
    return Vec.cosine(a, b) >= Config.get('vectorSimilarityThreshold', 0.98);
  }

  return { cosineBatch, split, isSimilar };
}, ['Vec', 'Config']);
// ─── AI/Ranker ─── END ───────────────────────────────────────

// ─── NET/Protocol ─── START ──────────────────────────────────
/**
 * Контракт событий NOOmium поверх Nostr. Чистые функции encode/decode/validate.
 *
 *   NOTE   = kind 1 (regular, хранится релеями): content = текст;
 *            теги ['t',room], ['v',b64-вектор], ['parent',id,pubkey]?.
 *   QUERY  = kind 21000 (ephemeral): content = JSON {vector, maxResponses, window}.
 *   ANSWER = kind 21001 (ephemeral): content = JSON {noteId, text, vector, score};
 *            тег ['e', queryId] — привязка к запросу.
 *   DELETE = kind 5 (NIP-09): теги ['e', eventId...] — просьба релеям удалить
 *            события; ['t',room] — чтобы попадал в комнатный фильтр подписки.
 *
 * Вектор в событиях — компактный base64 (Int16) от Float32Array.
 * @deps Config, Vec
 * @exports Protocol
 */
DI.register('Protocol', function (Config, Vec) {
  /**
   * Ищет тег по имени.
   * @param {Array} tags @param {string} name
   * @returns {Array|null}
   */
  function findTag(tags, name) {
    if (!Array.isArray(tags)) return null;
    for (const t of tags) if (Array.isArray(t) && t[0] === name) return t;
    return null;
  }

  /**
   * Шаблон события-заметки (для подписи и публикации).
   * @param {{id?:string,text:string,vector:*,shared?:boolean,parentId?:string,parentPubkey?:string,createdAt?:number}} note
   * @param {string} room
   * @returns {Object} Шаблон Nostr-события (без id/sig).
   */
  function noteEvent(note, room) {
    const tags = [['t', room]];
    if (note.vector) tags.push(['v', Vec.toB64(note.vector)]);
    if (note.parentId) tags.push(['parent', note.parentId, note.parentPubkey || '']);
    return {
      kind: Config.get('kNote', 1),
      created_at: Math.floor((note.createdAt || Date.now()) / 1000),
      tags,
      content: note.text || '',
    };
  }

  /**
   * Разбирает событие-заметку из сети.
   * @param {Object} ev - Подписанное событие.
   * @returns {Object|null} Заметка (shared=true, authorPubkey из ev.pubkey).
   */
  function decodeNote(ev) {
    if (!ev || ev.kind !== Config.get('kNote', 1)) return null;
    const vTag = findTag(ev.tags, 'v');
    const pTag = findTag(ev.tags, 'parent');
    return {
      id: ev.id,
      text: ev.content || '',
      vector: vTag ? Vec.fromB64(vTag[1]) : null,
      shared: true,
      authorPubkey: ev.pubkey,
      parentId: pTag ? pTag[1] : null,
      parentPubkey: pTag ? (pTag[2] || null) : null,
      createdAt: (ev.created_at || 0) * 1000,
    };
  }

  /**
   * Шаблон поискового запроса.
   * @param {Float32Array|number[]} vector
   * @param {number} maxResponses
   * @param {number} window - мс
   * @returns {Object}
   */
  function queryEvent(vector, maxResponses, window) {
    return {
      kind: Config.get('kQuery', 21000),
      created_at: Math.floor(Date.now() / 1000),
      tags: [['t', Config.get('room', 'noomium-main')]],
      content: JSON.stringify({ vector: Array.from(vector), maxResponses, window }),
    };
  }

  /**
   * Разбирает поисковый запрос (с валидацией вектора).
   * @param {Object} ev
   * @returns {{vector:number[],maxResponses:number,window:number,authorPubkey:string,queryId:string}|null}
   */
  function decodeQuery(ev) {
    if (!ev || ev.kind !== Config.get('kQuery', 21000)) return null;
    let data;
    try { data = JSON.parse(ev.content); } catch (_) { return null; }
    if (!data || !Array.isArray(data.vector) || !data.vector.length) return null;
    for (const x of data.vector) if (typeof x !== 'number' || !isFinite(x)) return null;
    return {
      vector: data.vector,
      maxResponses: typeof data.maxResponses === 'number' ? data.maxResponses : Config.get('maxResponses', 8),
      window: typeof data.window === 'number' ? data.window : Config.get('responseWindow', 6000),
      authorPubkey: ev.pubkey,
      queryId: ev.id,
    };
  }

  /**
   * Шаблон ответа на запрос.
   * @param {{id:string,text:string,vector:*}} note
   * @param {number} score
   * @param {string} queryId - id запроса (тег e).
   * @param {string} room
   * @returns {Object}
   */
  function answerEvent(note, score, queryId, room) {
    return {
      kind: Config.get('kAnswer', 21001),
      created_at: Math.floor(Date.now() / 1000),
      tags: [['t', room], ['e', queryId]],
      content: JSON.stringify({
        noteId: note.id,
        text: note.text,
        vector: note.vector ? Array.from(note.vector) : null,
        score,
      }),
    };
  }

  /**
   * Разбирает ответ (с валидацией и защитой от огромного текста).
   * @param {Object} ev
   * @returns {{id:string,queryId:string,noteId:string,text:string,vector:number[]|null,score:number,authorPubkey:string,createdAt:number}|null}
   */
  function decodeAnswer(ev) {
    if (!ev || ev.kind !== Config.get('kAnswer', 21001)) return null;
    const eTag = findTag(ev.tags, 'e');
    if (!eTag) return null;
    let data;
    try { data = JSON.parse(ev.content); } catch (_) { return null; }
    if (!data || typeof data.text !== 'string') return null;
    if (data.text.length > Config.get('maxAnswerTextLength', 10000)) return null;
    let vector = null;
    if (Array.isArray(data.vector)) {
      for (const x of data.vector) if (typeof x !== 'number' || !isFinite(x)) return null;
      vector = data.vector;
    }
    return {
      id: ev.id,
      queryId: eTag[1],
      noteId: data.noteId || ev.id,
      text: data.text,
      vector,
      score: typeof data.score === 'number' ? data.score : 0,
      authorPubkey: ev.pubkey,
      createdAt: (ev.created_at || 0) * 1000,
    };
  }

  /**
   * Шаблон события удаления (NIP-09, kind 5). Ссылается на удаляемые события
   * тегами ['e', eventId]; тег ['t', room] нужен, чтобы событие попало в
   * комнатный фильтр подписки и другие участники его получили.
   * @param {string|string[]} eventIds - Один id или массив id удаляемых событий.
   * @param {string} room
   * @returns {Object|null} Шаблон, либо null если нет валидных id.
   */
  function deleteEvent(eventIds, room) {
    const ids = Array.isArray(eventIds) ? eventIds : [eventIds];
    const tags = ids.filter(Boolean).map(id => ['e', id]);
    if (!tags.length) return null;
    if (room) tags.push(['t', room]);
    return {
      kind: Config.get('kDelete', 5),
      created_at: Math.floor(Date.now() / 1000),
      tags,
      content: '',
    };
  }

  /**
   * Разбирает событие удаления (NIP-09). Возвращает список id, которые просят
   * удалить. Используется NetService, чтобы вычистить их из кэша (DB.cacheDel).
   * @param {Object} ev
   * @returns {{eventIds:string[], authorPubkey:string}|null}
   */
  function decodeDelete(ev) {
    if (!ev || ev.kind !== Config.get('kDelete', 5)) return null;
    const eTags = (ev.tags || []).filter(t => Array.isArray(t) && t[0] === 'e' && t[1]);
    if (!eTags.length) return null;
    return {
      eventIds: eTags.map(t => t[1]),
      authorPubkey: ev.pubkey,
    };
  }

  return { noteEvent, decodeNote, queryEvent, decodeQuery, answerEvent, decodeAnswer, deleteEvent, decodeDelete };
}, ['Config', 'Vec']);
// ─── NET/Protocol ─── END ────────────────────────────────────

// ─── NET/Nostr ─── START ─────────────────────────────────────
/**
 * Транспорт Nostr: динамический импорт nostr-tools, ключи, SimplePool,
 * публикация/подписка. Низкий уровень — оркестрирует NetService.
 *
 * Публикация порелейная (ensureRelay → relay.publish): переживает отказ
 * отдельных рэлеев, резолвится по первому принявшему.
 *
 * Универсален по типам событий: одинаково возит kind 1 / 21000 / 21001 / 5,
 * поэтому для NIP-09 удаления менять здесь ничего не нужно.
 *
 * TODO(security): секретный ключ сейчас в localStorage открыто.
 * Шифрование PBKDF2+AES-GCM добавим отдельным срезом.
 *
 * @deps Config, EventBus, Logger
 * @exports Nostr
 */
DI.register('Nostr', function (Config, bus, Logger) {
  const CDN = 'https://cdn.jsdelivr.net/npm/nostr-tools@2.7.2/+esm';
  const SK_KEY = 'noomium:sk';

  let nostr = null;
  let pool = null;
  let sk = null;
  let pk = null;
  let initPromise = null;

  function loadKey() {
    try {
      const hex = localStorage.getItem(SK_KEY);
      if (hex && /^[0-9a-f]{64}$/i.test(hex)) {
        return new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
      }
    } catch (_) {}
    return null;
  }
  function saveKey(key) {
    try {
      localStorage.setItem(SK_KEY, Array.from(key).map(b => b.toString(16).padStart(2, '0')).join(''));
    } catch (_) {}
  }

  /**
   * Грузит nostr-tools, создаёт/читает ключ и пул. Идемпотентна.
   * @returns {Promise<string>} hex pubkey.
   */
  function init() {
    if (initPromise) return initPromise;
    initPromise = import(CDN).then(mod => {
      nostr = (typeof mod.generateSecretKey === 'function')
        ? mod
        : (mod.default && typeof mod.default.generateSecretKey === 'function' ? mod.default : mod);
      if (typeof nostr.generateSecretKey !== 'function') throw new Error('nostr-tools: несовместимый модуль');

      sk = loadKey();
      if (!sk) { sk = nostr.generateSecretKey(); saveKey(sk); }
      pk = nostr.getPublicKey(sk);
      pool = new nostr.SimplePool();
      Logger.info('Nostr: готов, pubkey ' + pk.slice(0, 8) + '…');
      return pk;
    }).catch(err => {
      initPromise = null;
      Logger.error('Nostr: не загрузить nostr-tools', String(err && err.message || err));
      try { bus.emit('net:status', { status: 'failed' }); } catch (_) {}
      throw err;
    });
    return initPromise;
  }

  /** @returns {string[]} Релеи из Config. */
  function relays() { return Config.get('relays', []); }

  /**
   * Подписывает шаблон (без публикации) — узнать id заранее.
   * @param {Object} template
   * @returns {Object} Подписанное событие.
   */
  function sign(template) {
    if (!nostr || !sk) throw new Error('Nostr not ready');
    return nostr.finalizeEvent(template, sk);
  }

  /**
   * Публикует событие порелейно. Резолвится по первому принявшему рэлею,
   * реджектит только если отказали все. Отдельные таймауты не роняют общее.
   * @param {Object} template
   * @returns {Promise<Object>} Подписанное событие.
   */
  function publish(template) {
    let ev;
    try { ev = sign(template); } catch (e) { return Promise.reject(e); }
    if (!pool) return Promise.reject(new Error('Nostr not ready'));
    const urls = relays();
    if (!urls.length) return Promise.reject(new Error('no relays configured'));
    return new Promise((resolve, reject) => {
      let settled = false;
      let failures = 0;
      urls.forEach(url => {
        pool.ensureRelay(url)
          .then(relay => relay.publish(ev))
          .then(() => { if (!settled) { settled = true; resolve(ev); } })
          .catch(err => {
            failures++;
            Logger.warn('Nostr: релей ' + url + ' не принял', String(err && err.message || err));
            if (!settled && failures === urls.length) { settled = true; reject(new Error('no relay accepted')); }
          });
      });
    });
  }

  /**
   * Подписка на многих релеях. Универсальна по kind (включая kind 5).
   * @param {Object[]} filters
   * @param {{onevent?:Function,onclose?:Function}} handlers
   * @returns {Object|null} Подписка с close().
   */
  function subscribe(filters, handlers) {
    if (!pool) return null;
    return pool.subscribeMany(relays(), filters, handlers);
  }

  /**
   * Доступ к конкретному релею (для NetService при надобности).
   * @param {string} url
   * @returns {Promise<Object>}
   */
  function ensureRelay(url) {
    if (!pool) return Promise.reject(new Error('Nostr not ready'));
    return pool.ensureRelay(url);
  }

  function getPubkey() { return pk; }
  function isReady() { return !!(nostr && sk && pool); }
  function close() {
    if (pool && typeof pool.close === 'function') { try { pool.close(relays()); } catch (_) {} }
  }

  return { init, sign, publish, subscribe, ensureRelay, getPubkey, isReady, relays, close };
}, ['Config', 'EventBus', 'Logger']);
// ─── NET/Nostr ─── END ───────────────────────────────────────

// ─── NET/NetService ─── START ────────────────────────────────
/**
 * Оркестратор децентрализованного обмена.
 *
 *  - Подписка на комнату: заметки (kind 1), запросы (21000), ответы (21001),
 *    удаления (kind 5, NIP-09).
 *  - Анонсирует открытые заметки; после анонса сохраняет eventId.
 *  - На чужой запрос: центроидный префильтр → ранжирование → top-N ответов.
 *  - На пин шлёт запрос и собирает ответы в кеш.
 *  - loadHistory: расширяет окно подписки (история сети).
 *  - forgetNote: при удалении расшаренной заметки шлёт kind 5 (NIP-09),
 *    прося релеи удалить событие; другие участники, получив kind 5,
 *    вычищают заметку из кэша (DB.cacheDel) — метка резонанса гаснет.
 *
 * Переподключение защищено «эпохой» подписки (subEpoch): намеренное
 * закрытие подписки (например, в loadHistory) не ложится в статус reconnecting.
 *
 * Дедупликация: seen по ev.id + contentSeen по (автор+текст).
 * Нагрузочная устойчивость: rate-limit ответов, префильтр, лимит ответов,
 * ступенчатая отправка, переподключение.
 *
 * @deps Nostr, Protocol, DB, Ranker, Vec, Store, Config, Logger, EventBus
 * @exports NetService
 */
DI.register('NetService', function (Nostr, Protocol, DB, Ranker, Vec, Store, Config, Logger, bus) {
  let started = false;
  let subscription = null;
  let hbTimer = null;
  let activeQueryId = null;
  let lastQueryVec = null;
  let lastQueryTime = 0;
  let centroids = [];
  let contextUnsub = null;
  const seen = new Set();
  const contentSeen = new Map();
  const peers = new Map();
  const peerQueryTimes = new Map();

  // окно подписки и история
  let currentWindow = Config.get('subWindow', 300);
  let historyLoading = false;
  // «эпоха» подписки: отличает намеренное переподключение от обрыва
  let subEpoch = 0;

  const kNote = () => Config.get('kNote', 1);
  const kQuery = () => Config.get('kQuery', 21000);
  const kAnswer = () => Config.get('kAnswer', 21001);
  const kDelete = () => Config.get('kDelete', 5);
  const room = () => Config.get('room', 'noomium-main');

  function setStatus(s) { try { bus.emit('net:status', { status: s }); } catch (_) {} }
  function notifyPeers() { try { bus.emit('net:peers', { count: peers.size }); } catch (_) {} }
  function emitHistory(loading, windowSec) { try { bus.emit('net:history', { loading: loading, window: windowSec }); } catch (_) {} }

  function trimSeen() {
    const max = Config.get('seenMaxSize', 1000);
    if (seen.size <= max) return;
    const arr = Array.from(seen);
    seen.clear();
    for (let i = arr.length - Math.floor(max / 2); i < arr.length; i++) seen.add(arr[i]);
  }

  function isContentDuplicate(pubkey, text) {
    const key = pubkey + '::' + String(text || '').trim();
    if (contentSeen.has(key)) return true;
    contentSeen.set(key, true);
    if (contentSeen.size > 2000) {
      const first = contentSeen.keys().next().value;
      contentSeen.delete(first);
    }
    return false;
  }

  // ── центроидный префильтр ──
  function rebuildCentroids() {
    DB.all().then(notes => {
      const vecs = notes.filter(n => n.shared && n.vector).map(n => n.vector);
      if (!vecs.length) { centroids = []; return; }
      centroids = Vec.kmeans(vecs, Math.min(Config.get('centroidCount', 12), vecs.length), 8);
    }).catch(() => {});
  }
  function passesPrefilter(queryVector) {
    if (!centroids.length) return true;
    const floor = Config.get('threshold', 0.7) - 0.25;
    for (const c of centroids) if (Vec.cosine(queryVector, c) >= floor) return true;
    return false;
  }

  // ── входящие события ──
  function onEvent(ev) {
    if (!ev || seen.has(ev.id)) return;
    seen.add(ev.id);
    trimSeen();
    if (ev.pubkey === Nostr.getPubkey()) return;   // своё не обрабатываем

    if (ev.kind === kNote()) handleIncomingNote(ev);
    else if (ev.kind === kQuery()) handleIncomingQuery(ev);
    else if (ev.kind === kAnswer()) handleIncomingAnswer(ev);
    else if (ev.kind === kDelete()) handleIncomingDelete(ev);
  }

  function handleIncomingNote(ev) {
    const note = Protocol.decodeNote(ev);
    if (!note) return;
    if (isContentDuplicate(note.authorPubkey, note.text)) return;
    peers.set(note.authorPubkey, Date.now());
    DB.cachePut(note);
    notifyPeers();
  }

  function handleIncomingQuery(ev) {
    const q = Protocol.decodeQuery(ev);
    if (!q) return;
    const now = Date.now();
    const last = peerQueryTimes.get(ev.pubkey) || 0;
    if (now - last < Config.get('queryRateLimit', 3000)) return;   // rate-limit на пира
    peerQueryTimes.set(ev.pubkey, now);
    if (!passesPrefilter(q.vector)) return;

    DB.all().then(notes => {
      const candidates = notes.filter(n => n.shared && n.vector);
      if (!candidates.length) return null;
      const byId = new Map(candidates.map(n => [n.id, n]));
      const items = candidates.map(n => ({ id: n.id, vector: n.vector }));
      return Ranker.cosineBatch(q.vector, items).then(scored => {
        const top = scored
          .filter(s => s.score >= Config.get('threshold', 0.7))
          .slice(0, q.maxResponses || Config.get('maxResponses', 8));
        top.forEach((s, i) => {
          const note = byId.get(s.id);
          if (!note) return;
          setTimeout(() => {
            Nostr.publish(Protocol.answerEvent(note, s.score, q.queryId, room()))
              .catch(e => Logger.warn('NetService: не отправить ответ', String(e)));
          }, i * 250);
        });
      });
    }).catch(e => Logger.warn('NetService: ошибка обработки запроса', String(e)));
  }

  function handleIncomingAnswer(ev) {
    const a = Protocol.decodeAnswer(ev);
    if (!a) return;
    if (a.queryId !== activeQueryId) return;   // ответ не на наш запрос
    if (isContentDuplicate(a.authorPubkey, a.text)) return;
    peers.set(a.authorPubkey, Date.now());
    DB.cachePut({
      id: a.id,
      text: a.text,
      vector: a.vector,
      shared: true,
      authorPubkey: a.authorPubkey,
      createdAt: a.createdAt,
      score: a.score,
    });
    notifyPeers();
  }

  /**
   * Входящее удаление (NIP-09): вычищаем указанные заметки из кэша.
   * DB.cacheDel эмитит db:cache → Feed/Influence/Provenance пересчитаются,
   * метка резонанса на родителе гаснет.
   */
  function handleIncomingDelete(ev) {
    const del = Protocol.decodeDelete(ev);
    if (!del) return;
    del.eventIds.forEach(eventId => {
      if (eventId) DB.cacheDel(eventId);
    });
    if (del.authorPubkey) peers.set(del.authorPubkey, Date.now());
    notifyPeers();
  }

  // ── анонс наших открытых заметок ──
  function announceNote(note) {
    if (!note || !note.shared || !note.vector) return;
    Nostr.publish(Protocol.noteEvent(note, room()))
      .then(ev => {
        Logger.info('NetService: анонс заметки ' + note.id);
        if (ev && ev.id && note.id) {
          DB.get(note.id).then(cur => {
            if (cur && cur.eventId !== ev.id) {
              cur.eventId = ev.id;
              DB.put(cur);
            }
          });
        }
      })
      .catch(e => Logger.warn('NetService: не анонсировать', String(e)));
  }

  /**
   * Просит релеи удалить событие заметки (kind 5, NIP-09). Best-effort:
   * поддерживают не все релеи, но это стандартный способ удаления.
   * @param {Object} note - заметка с eventId.
   */
  function forgetNote(note) {
    if (!note || !note.eventId) return;
    const ev = Protocol.deleteEvent(note.eventId, room());
    if (!ev) return;
    Nostr.publish(ev)
      .then(() => Logger.info('NetService: запрос удаления с рэлеев ' + note.id))
      .catch(e => Logger.warn('NetService: не удалить с рэлеев', String(e)));
  }

  // ── запрос при пине ──
  function maybeSendQuery() {
    const ctx = Store.get('context');
    if ((ctx.source !== 'pin' && ctx.source !== 'drift') || !ctx.vector) { lastQueryVec = null; return; }
    const now = Date.now();
    if (now - lastQueryTime < Config.get('queryRateLimit', 3000)) return;
    if (lastQueryVec && Ranker.isSimilar(lastQueryVec, ctx.vector)) return;
    lastQueryVec = ctx.vector;
    lastQueryTime = now;
    const tpl = Protocol.queryEvent(ctx.vector, Config.get('maxResponses', 8), Config.get('responseWindow', 6000));
    Nostr.publish(tpl)
      .then(ev => { activeQueryId = ev.id; Logger.info('NetService: запрос ' + ev.id.slice(0, 8) + '…'); })
      .catch(e => {
        lastQueryVec = null; lastQueryTime = 0;   // даём повторить
        Logger.warn('NetService: не отправить запрос', String(e));
      });
  }

  // ── подписка на комнату (с «эпохой» от ложных reconnect) ──
  function subscribeToRoom() {
    const since = Math.floor(Date.now() / 1000) - currentWindow;
    const filters = [{ kinds: [kNote(), kQuery(), kAnswer(), kDelete()], '#t': [room()], since }];
    const myEpoch = ++subEpoch;
    if (subscription && typeof subscription.close === 'function') { try { subscription.close(); } catch (_) {} }
    subscription = Nostr.subscribe(filters, {
      onevent: onEvent,
      onclose: () => {
        // устаревшая подписка (уже переподключились намеренно) — не дёргаем статус
        if (myEpoch !== subEpoch) return;
        setStatus('reconnecting');
        setTimeout(() => { if (started && myEpoch === subEpoch) subscribeToRoom(); }, Config.get('reconnectBaseDelay', 1000));
      },
    });
  }

  /**
   * Расширяет окно подписки, чтобы подтянуть старые заметки с рэлеев.
   * Каждый вызов увеличивает окно (×4), вплоть до historyMaxWindow.
   */
  function loadHistory() {
    if (!started || historyLoading) return;
    const maxWindow = Config.get('historyMaxWindow', 2592000); // 30 дней по умолчанию
    if (currentWindow >= maxWindow) { emitHistory(false, currentWindow); return; }
    historyLoading = true;
    emitHistory(true, currentWindow);
    currentWindow = Math.min(maxWindow, Math.max(currentWindow * 4, 86400));
    try {
      subscribeToRoom();
      Logger.info('NetService: окно истории → ' + currentWindow + 's');
    } finally {
      setTimeout(() => { historyLoading = false; emitHistory(false, currentWindow); }, 1200);
    }
  }

  // ── heartbeat ──
  function startHeartbeat() {
    if (hbTimer) clearInterval(hbTimer);
    hbTimer = setInterval(() => {
      const now = Date.now();
      const ttl = Config.get('peerTTL', 60000);
      let changed = false;
      peers.forEach((ts, pk) => { if (now - ts > ttl) { peers.delete(pk); changed = true; } });
      if (changed) notifyPeers();
      trimSeen();
    }, Config.get('heartbeat', 30000));
  }

  // ── lifecycle ──
  function start() {
    if (started) return Promise.resolve();
    return Nostr.init().then(() => {
      started = true;
      subscribeToRoom();
      bus.on('note:created', note => { if (note && note.shared) announceNote(note); });
      bus.on('note:shared', note => { if (note && note.shared) announceNote(note); });
      bus.on('note:deleted', note => { if (note && note.shared && note.eventId) forgetNote(note); });
      bus.on('db:change', () => rebuildCentroids());
      contextUnsub = Store.subscribe(s => s.context, () => maybeSendQuery());
      startHeartbeat();
      rebuildCentroids();
      setStatus('connected');
      Logger.info('NetService: запущен, комната #' + room());
    }).catch(e => {
      Logger.error('NetService: не стартовать', String(e && e.message || e));
      setStatus('failed');
    });
  }

  function stop() {
    started = false;
    if (subscription && typeof subscription.close === 'function') { try { subscription.close(); } catch (_) {} }
    subscription = null;
    if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
    if (contextUnsub) { try { contextUnsub(); } catch (_) {} contextUnsub = null; }
    peers.clear();
    seen.clear();
    contentSeen.clear();
    setStatus('disconnected');
  }

  return { start, stop, loadHistory };
}, ['Nostr', 'Protocol', 'DB', 'Ranker', 'Vec', 'Store', 'Config', 'Logger', 'EventBus']);
// ─── NET/NetService ─── END ─────────────────────────────────

// ─── DOMAIN/Notes ─── START ──────────────────────────────────
/**
 * Жизненный цикл заметок: создание, правка, удаление, переключение видимости.
 * Вектор считается при каждом сохранении текста. Вектор храним обычным массивом
 * (JSON-безопасно для экспорта/импорта); Vec/Ranker переваривают оба формата.
 *
 * Сеть сюда не знает: модуль эмитит 'note:created'/'note:updated'/'note:deleted',
 * NetService подпишется и сделает announce / forgetNote (NIP-09).
 * remove отдаёт в 'note:deleted' ПОЛНЫЙ объект заметки (включая eventId) — это
 * нужно NetService, чтобы опубликовать kind-5 удаление с рэлеев.
 *
 * @deps DB, Embedder, EventBus, Logger, Utils
 * @exports Notes
 */
DI.register('Notes', function (DB, Embedder, bus, Logger, Utils) {
  function emit(event, payload) { try { bus.emit(event, payload); } catch (_) {} }

  /**
   * Создаёт заметку, считая её вектор.
   * @param {string} text - Текст.
   * @param {'private'|'world'} mode - Видимость.
   * @param {string} [parentId] - id заметки-родителя («по мотивам»).
   * @returns {Promise<Object|null>} Созданная заметка или null (пустой текст).
   */
  function create(text, mode, parentId) {
    const t = (text || '').trim();
    if (!t) return Promise.resolve(null);
    return Embedder.embed(t).then(vector => {
      const note = {
        id: Utils.uid('n'),
        text: t,
        vector: vector ? Array.from(vector) : null,
        shared: mode === 'world',
        parentId: parentId || null,
        parentPubkey: null,
        createdAt: Date.now(),
      };
      return DB.put(note).then(() => { emit('note:created', note); return note; });
    });
  }

  /**
   * Правит текст заметки, пересчитывая вектор.
   * @param {string} id
   * @param {string} newText
   * @returns {Promise<Object|null>}
   */
  function edit(id, newText) {
    const t = (newText || '').trim();
    if (!t) return Promise.reject(new Error('empty text'));
    return DB.get(id).then(note => {
      if (!note) return null;
      return Embedder.embed(t).then(vector => {
        note.text = t;
        note.vector = vector ? Array.from(vector) : null;
        note.updatedAt = Date.now();
        return DB.put(note).then(() => { emit('note:updated', note); return note; });
      });
    });
  }

  /**
   * Удаляет заметку. Эмитит 'note:deleted' с ПОЛНЫМ объектом (включая eventId),
   * чтобы NetService мог опубликовать kind-5 удаление с рэлеев.
   * @param {string} id
   * @returns {Promise<Object|null>} Удалённая заметка или null.
   */
  function remove(id) {
    return DB.get(id).then(note => {
      if (!note) return null;
      return DB.del(id).then(() => { emit('note:deleted', note); return note; });
    });
  }

  /**
   * Переключает видимость (личное ↔ открытое).
   * @param {string} id
   * @returns {Promise<Object|null>} Обновлённая заметка.
   */
  function toggleShared(id) {
    return DB.get(id).then(note => {
      if (!note) return null;
      note.shared = !note.shared;
      return DB.put(note).then(() => {
        emit(note.shared ? 'note:shared' : 'note:unshared', note);
        return note;
      });
    });
  }

  /**
   * Читает заметку по id.
   * @param {string} id
   * @returns {Promise<Object|undefined>}
   */
  function get(id) { return DB.get(id); }

  return { create, edit, remove, toggleShared, get };
}, ['DB', 'Embedder', 'EventBus', 'Logger', 'Utils']);
// ─── DOMAIN/Notes ─── END ────────────────────────────────────

// ─── DOMAIN/Context ─── START ────────────────────────────────
/**
 * Сердце режимов. Управляет активным контекстом, по которому Feed ранжирует ленту.
 *
 * Источники и приоритеты:
 *  - pin    — закреплена заметка, ввод пуст: контекст = пин.
 *  - drift  — есть и пин, и ввод (вектор ввода готов): контекст ВЕДЁТ введённый
 *             текст (дрейф от пина), пин остаётся якорем (баннер) и родителем
 *             при публикации. Вектор пина для ранжирования не используется.
 *  - input  — только ввод: контекст = ввод.
 *  - none   — просмотр.
 * Пока вектор ввода считается (debounce), при наличии пина лента остаётся на пине.
 *
 * Пишет в Store.context; подписчики (Feed, FeedView) реагируют сами.
 *
 * @deps Store, Embedder, Config, Utils
 * @exports Context
 */
DI.register('Context', function (Store, Embedder, Config, Utils) {
  /** @type {string} */ let inputText = '';
  /** @type {Float32Array|number[]|null} */ let inputVector = null;
  /** @type {{id:string,text:string,vector:*}|null} */ let pinNote = null;

  /**
   * Активный контекст. Пин + ввод = дрейф (ведёт ввод).
   * @returns {{source:(null|'input'|'pin'|'drift'), noteId:(string|null), text:string, vector:*, pinText:(string|null)}}
   */
  function activeContext() {
    const hasInput = !!inputText.trim();
    if (pinNote && hasInput) {
      return {
        source: 'drift',
        noteId: pinNote.id,
        text: inputText.trim(),
        vector: inputVector,            // null, пока вектор ввода не готов → лента на пине
        pinText: pinNote.text,
      };
    }
    if (pinNote) return { source: 'pin', noteId: pinNote.id, text: pinNote.text, vector: pinNote.vector };
    if (hasInput) return { source: 'input', noteId: null, text: inputText.trim(), vector: inputVector };
    return { source: null, noteId: null, text: '', vector: null, pinText: null };
  }

  /** Записывает активный контекст в Store. */
  function push() { Store.setState({ context: activeContext() }); }

  /**
   * Отложенный расчёт вектора ввода; если текст изменился — результат отбрасывается.
   */
  const debouncedEmbed = Utils.debounce(() => {
    const t = inputText.trim();
    if (!t) { inputVector = null; push(); return; }
    Embedder.embed(t).then(v => {
      if (inputText.trim() === t) { inputVector = v; push(); }
    });
  }, Config.get('debounce', 350));

  return {
    /** Обновляет текст ввода. @param {string} text */
    setInput(text) {
      inputText = text || '';
      if (!inputText.trim()) inputVector = null;
      push();
      debouncedEmbed();
    },

    /** Закрепляет заметку. @param {{id,text,vector}} note */
    setPin(note) {
      if (!note || !note.vector) return;
      pinNote = { id: note.id, text: note.text, vector: note.vector };
      push();
    },

    /** Снимает пин. */
    clearPin() { pinNote = null; push(); },

    /** Полный сброс (ввод + пин). */
    clear() {
      inputText = ''; inputVector = null; pinNote = null;
      debouncedEmbed.cancel();
      push();
    },

    /** Вектор активного контекста (или null). */
    getVector() { return activeContext().vector; },
    /** Снимок активного контекста. */
    getActive() { return activeContext(); },
    /** Закреплённая заметка (или null) — используется как родитель при публикации. */
    getPin() { return pinNote; },
  };
}, ['Store', 'Embedder', 'Config', 'Utils']);
// ─── DOMAIN/Context ─── END ──────────────────────────────────

// ─── DOMAIN/Feed ─── START ───────────────────────────────────
/**
 * Готовит данные ленты под текущий режим.
 *
 *  - view  (контекста нет): свежая хронология — свои + сетевые заметки, feed[].
 *  - автор (контекст есть): ранжирование по вектору контекста → lists
 *    {local: свои релевантные, world: чужие релевантные, seren: озарения}.
 *
 * Источники: DB (свои) + DB.cache (сетевые). Обновляется по смене контекста
 * и по db:change/db:cache. Защищён от гонки sequence-номером: устаревшие
 * результаты не затирают свежие. Резонанс здесь НЕ считается (это Influence,
 * его рисует FeedView) — поэтому на influence:updated Feed не подписан.
 *
 * @deps DB, Ranker, Store, EventBus, Logger
 * @exports Feed
 */
DI.register('Feed', function (DB, Ranker, Store, bus, Logger) {
  /** Sequence-номер для отсечения устаревших асинхронных результатов. @type {number} */
  let seq = 0;
  /** Функции отписки (для destroy). @type {Function[]} */
  let unsubs = [];

  /**
   * Пересобирает данные ленты под текущий контекст.
   * @returns {Promise<void>}
   */
  function refresh() {
    const my = ++seq;
    const ctx = Store.get('context');

    return Promise.all([DB.all(), DB.cacheAll()]).then(([local, cached]) => {
      if (my !== seq) return;

      // ── Режим просмотра: хронология ──
      if (!ctx.source) {
        const merged = [
          ...local.map(n => Object.assign({}, n, { own: true })),
          ...cached.map(n => Object.assign({}, n, { own: false })),
        ].sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
        Store.setState({ feed: merged, lists: { local: [], world: [], seren: [] } });
        return;
      }

      // ── Режим автора, но вектор ещё считается — не дёргаем lists ──
      if (!ctx.vector) return;

      // ── Режим автора: ранжирование ──
      const items = [];
      const dataMap = new Map();
      for (const n of local) if (n && n.vector) {
        items.push({ id: n.id, vector: n.vector });
        dataMap.set(n.id, Object.assign({}, n, { own: true }));
      }
      for (const n of cached) if (n && n.vector) {
        items.push({ id: n.id, vector: n.vector });
        dataMap.set(n.id, Object.assign({}, n, { own: false }));
      }

      return Ranker.cosineBatch(ctx.vector, items).then(scored => {
        if (my !== seq) return;
        const { relevant, seren } = Ranker.split(scored);
        const toRes = s => {
          const n = dataMap.get(s.id);
          return n ? Object.assign({}, n, { score: s.score }) : null;
        };
        const rel = relevant.map(toRes).filter(Boolean);
        Store.setState({
          lists: {
            local: rel.filter(n => n.own),
            world: rel.filter(n => !n.own),
            seren: seren.map(toRes).filter(Boolean),
          },
          feed: [],
        });
      });
    }).catch(err => {
      Logger.warn('Feed: ошибка refresh', String(err && err.message || err));
    });
  }

  /**
   * Подключает автообновление (контекст + изменения БД) и делает первый проход.
   */
  function init() {
    unsubs.push(Store.subscribe(s => s.context, () => refresh(), Store.shallowEqual));
    unsubs.push(bus.on('db:change', () => refresh()));
    unsubs.push(bus.on('db:cache', () => refresh()));
    refresh();
  }

  /** Отписывается от всего (для пересборки UI). */
  function destroy() {
    unsubs.forEach(u => { try { u(); } catch (_) {} });
    unsubs = [];
  }

  return { init, destroy, refresh };
}, ['DB', 'Ranker', 'Store', 'EventBus', 'Logger']);
// ─── DOMAIN/Feed ─── END ─────────────────────────────────────

// ─── DOMAIN/Provenance ─── START ─────────────────────────────
/**
 * Граф «по мотивам»: parent-связи между заметками (свои + сетевые).
 * Читает DB (свои) и DB.cache (сетевые), строит связи по parentId.
 *  - children(id)    — прямые дети (вниз).
 *  - descendants(id) — все потомки рекурсивно (вниз).
 *  - ancestors(id)   — цепочка предков вверх (мама → бабушка → … до корня).
 * При поиске индексирует заметки и по id, и по eventId (свои дети ссылаются
 * на id, чужие — на eventId).
 * @deps DB
 * @exports Provenance
 */
DI.register('Provenance', function (DB) {
  /**
   * Все заметки (свои + сетевые) одним списком.
   * @returns {Promise<Object[]>}
   */
  function loadAll() {
    return Promise.all([DB.all(), DB.cacheAll()]).then(([own, cached]) => own.concat(cached));
  }

  /**
   * Прямые дети заметки (заметки с parentId = id).
   * @param {string} id
   * @returns {Promise<Object[]>}
   */
  function children(id) {
    if (!id) return Promise.resolve([]);
    return loadAll().then(all => all.filter(n => n && n.parentId === id));
  }

  /**
   * Все потомки (рекурсивно, BFS), без циклов.
   * @param {string} id
   * @returns {Promise<Object[]>}
   */
  function descendants(id) {
    if (!id) return Promise.resolve([]);
    return loadAll().then(all => {
      const out = [];
      const seenIds = new Set([id]);
      let frontier = [id];
      while (frontier.length) {
        const next = [];
        for (const n of all) {
          if (n && n.parentId && frontier.indexOf(n.parentId) !== -1 && !seenIds.has(n.id)) {
            seenIds.add(n.id);
            out.push(n);
            next.push(n.id);
          }
        }
        frontier = next;
      }
      return out;
    });
  }

  /**
   * Цепочка предков заметки вверх по parentId: от непосредственного родителя
   * к корню. Останавливается, если родитель не найден или обнаружен цикл.
   * @param {string} id
   * @returns {Promise<Object[]>} Массив предков [мама, бабушка, ...].
   */
  function ancestors(id) {
    if (!id) return Promise.resolve([]);
    return loadAll().then(all => {
      const byId = new Map();
      all.forEach(n => {
        if (n) {
          if (n.id) byId.set(n.id, n);
          if (n.eventId) byId.set(n.eventId, n);
        }
      });
      const chain = [];
      const seen = new Set();
      let current = byId.get(id);
      while (current && current.parentId) {
        if (seen.has(current.parentId)) break;      // защита от цикла
        seen.add(current.parentId);
        const parent = byId.get(current.parentId);
        if (!parent) break;                          // предок не загружен
        chain.push(parent);
        current = parent;
      }
      return chain;
    });
  }

  return { children, descendants, ancestors, loadAll };
}, ['DB']);
// ─── DOMAIN/Provenance ─── END ───────────────────────────────

// ─── DOMAIN/Influence ─── START ──────────────────────────────
/**
 * Резонанс заметки: сколько уникальных авторов породило её прямых детей.
 * Sybil-resistant: один человек не накрутит себе много, сколько бы детей ни создал.
 * Свои дети (authorPubkey=null) считаются одним автором «я».
 * Карта parentId→авторы строится асинхронно по db:change/db:cache; по
 * завершении эмитит 'influence:updated' (FeedView перерисовывает ◆).
 * @deps DB, EventBus, Logger
 * @exports Influence
 */
DI.register('Influence', function (DB, bus, Logger) {
  /** parentId -> Set авторов-детей. @type {Map<string,Set<string>>} */
  const resonanceMap = new Map();
  let seq = 0;

  /** Перестраивает карту резонанса из своих + сетевых заметок. */
  function rebuild() {
    const my = ++seq;
    return Promise.all([DB.all(), DB.cacheAll()]).then(([own, cached]) => {
      if (my !== seq) return;
      const map = new Map();
      own.concat(cached).forEach(n => {
        if (n && n.parentId) {
          if (!map.has(n.parentId)) map.set(n.parentId, new Set());
          map.get(n.parentId).add(n.authorPubkey || 'self');
        }
      });
      resonanceMap.clear();
      map.forEach((v, k) => resonanceMap.set(k, v));
      try { bus.emit('influence:updated'); } catch (_) {}
    }).catch(e => Logger.warn('Influence: ошибка rebuild', String(e)));
  }

  /**
   * Число уникальных авторов прямых детей заметки.
   * @param {string} id
   * @returns {number}
   */
  function resonance(id) {
    if (!id) return 0;
    const s = resonanceMap.get(id);
    return s ? s.size : 0;
  }

  function init() {
    bus.on('db:change', () => rebuild());
    bus.on('db:cache', () => rebuild());
    rebuild();
  }

  return { init, resonance, rebuild };
}, ['DB', 'EventBus', 'Logger']);
// ─── DOMAIN/Influence ─── END ────────────────────────────────

// ─── DOMAIN/NoteActions ─── START ────────────────────────────
/**
 * Общие действия над заметкой: удалить, переключить видимость, копировать.
 * Единая точка, чтобы FeedView / NoteView / BaseView не дублировали логику.
 * ВНИМАНИЕ: зависит от Modal и Toast (едут в следующей пачке) — резолвится
 * лениво, к моменту использования они уже зарегистрированы.
 * @deps Notes, Modal, Toast, I18n
 * @exports NoteActions
 */
DI.register('NoteActions', function (Notes, Modal, Toast, I18n) {
  /**
   * Удаляет заметку с подтверждением.
   * @param {string} id
   */
  function remove(id) {
    if (!id) return;
    Modal.confirm(I18n.t('btn.del'), I18n.t('del.confirm'), () => {
      Notes.remove(id);
      Toast.show('ok', I18n.t('toast.deleted'));
    });
  }

  /**
   * Переключает видимость (личное ↔ открытое).
   * @param {string} id
   */
  function toggle(id) {
    if (!id) return;
    Notes.toggleShared(id).then(note => {
      if (!note) return;
      Toast.show('ok', I18n.t(note.shared ? 'toast.saved.public' : 'toast.saved.private'));
    });
  }

  /**
   * Копирует текст заметки в буфер (с fallback для старых браузеров).
   * @param {string} text
   */
  function copy(text) {
    const done = () => Toast.show('ok', I18n.t('toast.copied'));
    const fail = () => Toast.show('err', I18n.t('toast.copy.fail'));
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text || '').then(done).catch(fail);
    } else {
      try {
        const ta = document.createElement('textarea');
        ta.value = text || '';
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        done();
      } catch (_) { fail(); }
    }
  }

  return { remove, toggle, copy };
}, ['Notes', 'Modal', 'Toast', 'I18n']);
// ─── DOMAIN/NoteActions ─── END ──────────────────────────────

// ─── UI/Onboarding ─── START ─────────────────────────────────
/**
 * Онбординг и справка «Как это работает».
 *  - init(): при первом запуске (Config.onboarded=false) показывает гайд.
 *  - showHelp(): открывает гайд из меню; чекбокс «больше не показывать»
 *    доступен только в онбординге первого запуска.
 * Текст берётся из единого словаря I18n (ключи onb.*).
 * @deps Config, Modal, I18n
 * @exports Onboarding
 */
DI.register('Onboarding', function (Config, Modal, I18n) {
  /**
   * Собирает тело гайда из секций.
   * @param {boolean} firstRun - онбординг первого запуска (показывает чекбокс).
   * @returns {{el:HTMLElement, checkbox:HTMLInputElement|null}}
   */
  function buildBody(firstRun) {
    const el = document.createElement('div');
    el.style.cssText = 'display:flex;flex-direction:column;gap:14px;';

    const sections = [
      ['◇ ' + I18n.t('onb.what.t'), I18n.t('onb.what.d')],
      ['▤ ' + I18n.t('onb.stream.t'), I18n.t('onb.stream.d')],
      ['◈ ' + I18n.t('onb.pin.t'), I18n.t('onb.pin.d')],
      ['∿ ' + I18n.t('onb.drift.t'), I18n.t('onb.drift.d')],
      ['⌘ ' + I18n.t('onb.modes.t'), I18n.t('onb.modes.d')],
      ['◆ ' + I18n.t('onb.resonance.t'), I18n.t('onb.resonance.d')],
      ['⌨ ' + I18n.t('onb.keys.t'), I18n.t('onb.keys.d')],
    ];

    sections.forEach(([title, desc]) => {
      const s = document.createElement('div');
      const t = document.createElement('div');
      t.style.cssText = 'font-weight:700;font-size:13px;margin-bottom:3px;';
      t.textContent = title;
      const d = document.createElement('div');
      d.style.cssText = 'font-size:13px;color:var(--text-2);line-height:1.5;';
      d.textContent = desc;
      s.appendChild(t);
      s.appendChild(d);
      el.appendChild(s);
    });

    let checkbox = null;
    if (firstRun) {
      const label = document.createElement('label');
      label.style.cssText = 'display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer;margin-top:4px;';
      checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      label.appendChild(checkbox);
      const span = document.createElement('span');
      span.textContent = I18n.t('onb.dontshow');
      label.appendChild(span);
      el.appendChild(label);
    }

    return { el, checkbox };
  }

  /**
   * Открывает гайд.
   * @param {boolean} firstRun - первый запуск (чекбокс + сохранение onboarded).
   */
  function showHelp(firstRun) {
    const { el, checkbox } = buildBody(!!firstRun);
    Modal.open({
      title: I18n.t('onb.title'),
      body: el,
      buttons: [{
        text: I18n.t('onb.gotit'),
        primary: true,
        onClick: () => {
          if (firstRun && checkbox && checkbox.checked) {
            Config.set('onboarded', true);
          }
          Modal.close();
        },
      }],
    });
  }

  /** Первый запуск: показать гайд, если ещё не проходили. */
  function init() {
    if (Config.get('onboarded', false)) return;
    showHelp(true);
  }

  return { init, showHelp };
}, ['Config', 'Modal', 'I18n']);
// ─── UI/Onboarding ─── END ───────────────────────────────────

// ─── UI/Modal ─── START ──────────────────────────────────────
/**
 * Модальное окно на готовой разметке (#overlay > #modal: #modal-h/-t/-x/-b/-f).
 *  - open({title, body, buttons}) — произвольное окно; body: строка или DOM-узел.
 *  - confirm(title, text, onOk, okText?) — подтверждение (OK выполняет onOk).
 *  - close() — закрыть (также работают Escape и клик по подложке).
 * Возвращает фокус элементу, активному до открытия.
 * @deps I18n
 * @exports Modal
 */
DI.register('Modal', function (I18n) {
  let overlay, modal, titleEl, bodyEl, footEl, closeBtn;
  let escHandler = null;
  let lastFocus = null;

  /** Привязывает DOM один раз. */
  function bind() {
    if (overlay) return;
    overlay = document.getElementById('overlay');
    modal = document.getElementById('modal');
    titleEl = document.getElementById('modal-t');
    bodyEl = document.getElementById('modal-b');
    footEl = document.getElementById('modal-f');
    closeBtn = document.getElementById('modal-x');
    if (closeBtn) closeBtn.addEventListener('click', close);
    if (overlay) overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  }

  /**
   * Открывает окно.
   * @param {{title?:string, body?:(string|Node), buttons?:Array<{text:string,primary?:boolean,danger?:boolean,onClick?:Function}>}} opts
   */
  function open(opts) {
    bind();
    if (!overlay) return;
    opts = opts || {};
    lastFocus = document.activeElement;

    if (titleEl) titleEl.textContent = opts.title || '';
    if (bodyEl) {
      bodyEl.innerHTML = '';
      if (opts.body) {
        if (typeof opts.body === 'string') bodyEl.textContent = opts.body;
        else bodyEl.appendChild(opts.body);
      }
    }
    if (footEl) {
      footEl.innerHTML = '';
      (opts.buttons || []).forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'mbtn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : '');
        btn.textContent = b.text || 'OK';
        btn.addEventListener('click', () => { if (b.onClick) b.onClick(); });
        footEl.appendChild(btn);
      });
    }

    overlay.classList.add('on');

    if (escHandler) document.removeEventListener('keydown', escHandler);
    escHandler = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', escHandler);

    // фокус на первый интерактивный элемент внутри окна
    setTimeout(() => {
      if (!modal) return;
      const focusable = modal.querySelectorAll('button, input, textarea, [tabindex]:not([tabindex="-1"])');
      if (focusable.length) focusable[0].focus();
    }, 50);
  }

  /** Закрывает окно и возвращает фокус. */
  function close() {
    if (!overlay) return;
    overlay.classList.remove('on');
    if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; }
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (_) {} }
  }

  /**
   * Подтверждение: Cancel закрывает, OK (danger) выполняет onOk.
   * @param {string} title @param {string} text @param {Function} onOk @param {string} [okText]
   */
  function confirm(title, text, onOk, okText) {
    open({
      title,
      body: text,
      buttons: [
        { text: I18n.t('btn.cancel'), onClick: close },
        { text: okText || 'OK', primary: true, danger: true, onClick: () => { close(); if (onOk) onOk(); } },
      ],
    });
  }

  return { open, close, confirm };
}, ['I18n']);
// ─── UI/Modal ─── END ────────────────────────────────────────

// ─── UI/Toast ─── START ──────────────────────────────────────
/**
 * Всплывающие уведомления. Держит не более toastMaxVisible, старые вытесняет,
 * исчезает с плавным fade. Иконка подсвечивается цветом типа.
 * @deps Config
 * @exports Toast
 */
DI.register('Toast', function (Config) {
  const ICONS = { ok: '✓', err: '✕', warn: '!', info: '◆' };
  const COLORS = { ok: 'var(--green)', err: 'var(--rose)', warn: 'var(--amber)', info: 'var(--teal)' };
  let container = null;

  /**
   * Показывает тост.
   * @param {'ok'|'err'|'warn'|'info'} type
   * @param {string} msg
   * @param {number} [ms] - Длительность (по умолчанию из Config).
   */
  function show(type, msg, ms) {
    if (!container) container = document.getElementById('toasts');
    if (!container) return;
    const cls = ICONS[type] ? type : 'info';

    const el = document.createElement('div');
    el.className = 'toast ' + cls;
    const ic = document.createElement('span');
    ic.textContent = ICONS[cls];
    ic.style.fontWeight = '700';
    ic.style.color = COLORS[cls];
    const m = document.createElement('span');
    m.textContent = String(msg || '');
    el.appendChild(ic);
    el.appendChild(m);
    container.appendChild(el);

    const limit = Config.get('toastMaxVisible', 3);
    while (container.children.length > limit) container.removeChild(container.firstChild);

    setTimeout(() => {
      el.style.transition = 'opacity .25s, transform .25s';
      el.style.opacity = '0';
      el.style.transform = 'translateY(6px)';
      setTimeout(() => { try { el.remove(); } catch (_) {} }, 260);
    }, ms || Config.get('toastDefaultDuration', 2200));
  }

  return { show };
}, ['Config']);
// ─── UI/Toast ─── END ────────────────────────────────────────

// ─── UI/Progress ─── START ───────────────────────────────────
/**
 * Полноэкранный оверлей загрузки модели. Слушает 'ai:progress'/'ai:status'.
 * Показывается с задержкой SHOW_DELAY, чтобы не мигать на быстрой (кэшированной)
 * загрузке; скрывается при переходе в 'model'/'demo'.
 * @deps EventBus
 * @exports Progress
 */
DI.register('Progress', function (bus) {
  let overlay, fill, pctEl;
  let showTimer = null;
  const SHOW_DELAY = 300;

  function bind() {
    overlay = document.getElementById('progress');
    fill = document.getElementById('prog-fill');
    pctEl = document.getElementById('prog-pct');
  }
  function show() { if (overlay) overlay.classList.add('on'); }
  function hide() { if (overlay) overlay.classList.remove('on'); }

  /** @param {number} pct 0..100 */
  function update(pct) {
    const p = Math.max(0, Math.min(100, Math.round(pct || 0)));
    if (fill) fill.style.width = p + '%';
    if (pctEl) pctEl.textContent = p + '%';
  }

  function init() {
    bind();
    bus.on('ai:progress', e => update(e && e.pct));
    bus.on('ai:status', e => {
      if (!e) return;
      if (e.mode === 'loading') {
        update(e.percent || 0);
        if (!showTimer && overlay && !overlay.classList.contains('on')) {
          showTimer = setTimeout(() => { show(); showTimer = null; }, SHOW_DELAY);
        }
      } else {
        if (showTimer) { clearTimeout(showTimer); showTimer = null; }
        hide();
      }
    });
  }

  return { init, show, hide, update };
}, ['EventBus']);

// ─── UI/HeaderStatus ─── START ───────────────────────────────
/**
 * Индикаторы в шапке: сеть и ИИ. Реагирует на 'ai:status' и 'net:status'.
 * Пока NET не подключён, сеть показана как disconnected — оживёт с NetService.
 * @deps EventBus, I18n, Embedder
 * @exports HeaderStatus
 */
DI.register('HeaderStatus', function (bus, I18n, Embedder) {
  let netDot, netTxt, aiDot, aiTxt;
  let unsubs = [];

  function bind() {
    netDot = document.getElementById('st-net-dot');
    netTxt = document.getElementById('st-net-txt');
    aiDot = document.getElementById('st-ai-dot');
    aiTxt = document.getElementById('st-ai-txt');
  }

  /** @param {'loading'|'model'|'demo'} mode @param {number} [percent] */
  function setAI(mode, percent) {
    if (!aiDot || !aiTxt) return;
    if (mode === 'model') {
      aiDot.className = 'dot ok';
      aiTxt.textContent = I18n.t('st.ai.ready');
    } else if (mode === 'demo') {
      aiDot.className = 'dot warn';
      aiTxt.textContent = I18n.t('st.ai.demo');
    } else {
      aiDot.className = 'dot load';
      aiTxt.textContent = I18n.t('st.ai.loading') + (percent ? ' ' + Math.round(percent) + '%' : '');
    }
  }

  /** @param {'disconnected'|'connecting'|'connected'|'reconnecting'|'failed'} status */
  function setNet(status) {
    if (!netDot || !netTxt) return;
    const map = {
      connected: ['ok', 'st.net.online'],
      connecting: ['load', 'st.net.connecting'],
      reconnecting: ['warn', 'st.net.reconnecting'],
      failed: ['err', 'st.net.failed'],
      disconnected: ['', 'st.net'],
    };
    const [cls, key] = map[status] || ['', 'st.net'];
    netDot.className = 'dot' + (cls ? ' ' + cls : '');
    netTxt.textContent = I18n.t(key);
  }

  function init() {
    bind();
    unsubs.push(bus.on('ai:status', e => setAI(e.mode, e.percent)));
    unsubs.push(bus.on('net:status', e => setNet(e.status)));
    unsubs.push(bus.on('i18n:change', () => { setAI(Embedder.getMode()); setNet('disconnected'); }));
    setAI(Embedder.getMode());
    setNet('disconnected');
  }

  function destroy() {
    unsubs.forEach(u => { try { u(); } catch (_) {} });
    unsubs = [];
  }

  return { init, destroy };
}, ['EventBus', 'I18n', 'Embedder']);
