// ─── UI/Composer ─── START ───────────────────────────────────
/**
 * Поле ввода: счётчик, переключатель Личное/Мир, отправка.
 * Ввод мгновенно включает режим автора (Context.setInput), вектор догоняет
 * с debounce. Если при публикации активен пин — новая заметка связывается с
 * закреплённой (parentId = пин): так работает механика «мысль по мотивам».
 * Режим правки: по 'note:edit-request' {id} загружает заметку в поле (через
 * Notes.get); отправка тогда вызывает Notes.edit, а не create.
 * @deps Context, Notes, Store, I18n, EventBus, Toast, Utils
 * @exports Composer
 */
DI.register('Composer', function (Context, Notes, Store, I18n, bus, Toast, Utils) {
  let ta, cnt, sendBtn, toggle;
  let sending = false;
  let editingId = null;
  let unsubs = [];

  function updateCounter() {
    if (cnt && ta) cnt.textContent = Utils.word('symbols', ta.value.length, I18n.getLang());
  }

  function reflectMode(mode) {
    if (!toggle) return;
    toggle.setAttribute('data-mode', mode);
    toggle.querySelectorAll('.mt-opt').forEach(o =>
      o.classList.toggle('on', o.getAttribute('data-v') === mode));
  }

  function setSendingUI(on) {
    if (!sendBtn) return;
    sendBtn.disabled = on;
    sendBtn.classList.toggle('sending', on);
    if (!editingId) sendBtn.textContent = on ? '…' : '→';
  }

  function refreshEditUI() {
    if (!sendBtn || !toggle) return;
    if (editingId) {
      toggle.style.display = 'none';
      sendBtn.textContent = I18n.t('btn.save');
    } else {
      toggle.style.display = '';
      sendBtn.textContent = '→';
    }
  }

  /** Загружает заметку в поле для правки. @param {string} id */
  function edit(id) {
    Notes.get(id).then(note => {
      if (!note || !ta) return;
      editingId = id;
      ta.value = note.text || '';
      updateCounter();
      refreshEditUI();
      ta.focus();
    });
  }

  function cancelEdit() {
    editingId = null;
    if (ta) ta.value = '';
    updateCounter();
    refreshEditUI();
  }

  /** Отправка: правка (Notes.edit) или создание (Notes.create + пин как родитель). */
  function send() {
    if (sending) return;
    const text = ta.value.trim();
    if (!text) { Toast.show('warn', I18n.t('toast.empty')); return; }
    const mode = Store.get('sendMode');
    sending = true;
    setSendingUI(true);

    const finish = () => {
      sending = false;
      setSendingUI(false);
      editingId = null;
      ta.value = '';
      Context.setInput('');
      updateCounter();
      refreshEditUI();
    };

    if (editingId) {
      Notes.edit(editingId, text)
        .then(() => { Toast.show('ok', I18n.t('toast.edit.saved')); finish(); })
        .catch(e => { Toast.show('err', String(e && e.message || e)); sending = false; setSendingUI(false); });
      return;
    }

    // активный пин = родитель новой заметки («по мотивам»)
    const pin = Context.getPin();
    const parentId = pin ? pin.id : null;

    Notes.create(text, mode, parentId)
      .then(note => {
        Toast.show('ok', I18n.t(mode === 'world' ? 'toast.saved.public' : 'toast.saved.private')
          + (note && note.parentId ? ' · ' + I18n.t('inf.linked') : ''));
        try { bus.emit('editor:sent'); } catch (_) {}
        finish();
      })
      .catch(e => { Toast.show('err', String(e && e.message || e)); sending = false; setSendingUI(false); });
  }

  function init() {
    ta = document.getElementById('ed-ta');
    cnt = document.getElementById('ed-cnt');
    sendBtn = document.getElementById('btn-send');
    toggle = document.getElementById('mode-toggle');
    if (!ta) return;

    ta.addEventListener('input', () => {
      updateCounter();
      Context.setInput(ta.value);
    });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
      else if (e.key === 'Escape' && editingId) { e.preventDefault(); cancelEdit(); }
    });
    if (sendBtn) sendBtn.addEventListener('click', send);
    if (toggle) toggle.addEventListener('click', e => {
      const opt = e.target.closest('.mt-opt');
      if (opt && opt.getAttribute('data-v')) Store.setState({ sendMode: opt.getAttribute('data-v') });
    });

    unsubs.push(Store.subscribe(s => s.sendMode, reflectMode));
    unsubs.push(bus.on('i18n:change', () => { updateCounter(); reflectMode(Store.get('sendMode')); refreshEditUI(); }));
    unsubs.push(bus.on('note:edit-request', p => { if (p && p.id) edit(p.id); }));

    reflectMode(Store.get('sendMode'));
    refreshEditUI();
    updateCounter();
  }

  function destroy() {
    unsubs.forEach(u => { try { u(); } catch (_) {} });
    unsubs = [];
  }

  return { init, destroy, send, edit, cancelEdit };
}, ['Context', 'Notes', 'Store', 'I18n', 'EventBus', 'Toast', 'Utils']);
// ─── UI/Composer ─── END ─────────────────────────────────────

// ─── UI/FeedView ─── START ───────────────────────────────────
/**
 * Рендер ленты и хром режимов.
 *  - просмотр: хронология Store.feed; бар скрыт.
 *  - input / drift (режим автора): бар виден, лента = Store.lists[seg].
 *  - pin: баннер, единый список похожего (закреплённая исключена).
 * Жесты: клик по карточке = пин/отпин; ✎ на своих = NoteView;
 * «↳ по мотивам» = линейка предков; «◆ N» = потомки;
 * «Загрузить ещё» = история сети.
 * Резонанс = сумма уникальных авторов по локальному id и по eventId.
 * @deps Store, Context, I18n, Utils, EventBus, Influence, Provenance, Modal, NetService
 * @exports FeedView
 */
DI.register('FeedView', function (Store, Context, I18n, Utils, bus, Influence, Provenance, Modal, NetService) {
  let feedEl, emptyEl, emptyT, segBar, ctxBanner, ctxSrc, ctxTxt, ctxX;
  let cLocal, cWorld, cSeren, histBtn;
  let unsubs = [];
  let rafPending = false;

  function bind() {
    feedEl = document.getElementById('feed');
    emptyEl = document.getElementById('feed-empty');
    emptyT = document.getElementById('feed-empty-t');
    segBar = document.getElementById('seg');
    ctxBanner = document.getElementById('ctx-banner');
    ctxSrc = document.getElementById('ctx-src');
    ctxTxt = document.getElementById('ctx-txt');
    ctxX = document.getElementById('ctx-x');
    cLocal = document.getElementById('c-local');
    cWorld = document.getElementById('c-world');
    cSeren = document.getElementById('c-seren');
    histBtn = document.getElementById('btn-history');
  }

  function scheduleRender() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; render(); });
  }

  function isPinned(n) {
    const ctx = Store.get('context');
    return ctx.source === 'pin' && ctx.noteId === n.id;
  }

  function onNoteClick(n) {
    const ctx = Store.get('context');
    if ((ctx.source === 'pin' || ctx.source === 'drift') && ctx.noteId === n.id) { Context.clearPin(); return; }
    if (n.vector) Context.setPin(n);
  }

  function renderChildrenModal(children) {
    const body = document.createElement('div');
    body.style.cssText = 'display:flex;flex-direction:column;gap:8px;';
    if (!children.length) {
      const empty = document.createElement('div');
      empty.style.cssText = 'color:var(--text-3);font-size:13px;';
      empty.textContent = I18n.t('inf.nochildren');
      body.appendChild(empty);
    } else {
      children.forEach(c => {
        const item = document.createElement('button');
        item.className = 'nv-act';
        item.style.cssText = 'text-align:left;justify-content:flex-start;white-space:normal;height:auto;min-height:40px;';
        item.textContent = (c.text || '').slice(0, 140);
        item.addEventListener('click', () => {
          Modal.close();
          try { bus.emit('note:open', { id: c.id }); } catch (_) {}
        });
        body.appendChild(item);
      });
    }
    Modal.open({
      title: I18n.t('inf.children') + (children.length ? ' · ' + children.length : ''),
      body,
      buttons: [{ text: I18n.t('btn.close'), onClick: () => Modal.close() }],
    });
  }

  function showChildren(note) {
    const ids = [note.id];
    if (note.eventId) ids.push(note.eventId);
    Promise.all(ids.map(id => Provenance.children(id))).then(results => {
      const seenIds = new Set();
      const children = [];
      results.forEach(list => (list || []).forEach(c => {
        if (c && !seenIds.has(c.id)) { seenIds.add(c.id); children.push(c); }
      }));
      renderChildrenModal(children);
    }).catch(() => {});
  }

  function renderAncestorsModal(note, chain) {
    const body = document.createElement('div');
    body.style.cssText = 'display:flex;flex-direction:column;gap:8px;';
    if (!chain.length) {
      const empty = document.createElement('div');
      empty.style.cssText = 'color:var(--text-3);font-size:13px;';
      empty.textContent = I18n.t('inf.noancestors');
      body.appendChild(empty);
    } else {
      chain.forEach((c, i) => {
        const item = document.createElement('button');
        item.className = 'nv-act';
        item.style.cssText = 'text-align:left;justify-content:flex-start;white-space:normal;height:auto;min-height:40px;';
        item.style.paddingLeft = (16 + i * 14) + 'px';
        item.textContent = '↳ ' + (c.text || '').slice(0, 140);
        item.addEventListener('click', () => {
          Modal.close();
          try { bus.emit('note:open', { id: c.id }); } catch (_) {}
        });
        body.appendChild(item);
      });
    }
    Modal.open({
      title: I18n.t('inf.lineage') + (chain.length ? ' · ' + chain.length : ''),
      body,
      buttons: [{ text: I18n.t('btn.close'), onClick: () => Modal.close() }],
    });
  }

  function showAncestors(note) {
    Provenance.ancestors(note.id).then(chain => {
      renderAncestorsModal(note, chain);
    }).catch(() => {});
  }

  function card(n, isRanked, i) {
    const el = document.createElement('div');
    el.className = 'note' + (isPinned(n) ? ' pinned' : '');
    el.style.animationDelay = Math.min(i * 25, 300) + 'ms';
    el.dataset.id = n.id;

    const txt = document.createElement('div');
    txt.className = 'note-txt';
    txt.textContent = n.text || '';
    el.appendChild(txt);

    const meta = document.createElement('div');
    meta.className = 'note-meta';

    const tag = document.createElement('span');
    if (n.own) {
      tag.className = 'note-tag ' + (n.shared ? 'world' : 'priv');
      tag.textContent = n.shared ? I18n.t('base.tag.shared') : I18n.t('base.tag.private');
    } else {
      tag.className = 'note-tag world';
      tag.textContent = '· ' + Utils.shortPk(n.authorPubkey || '');
    }
    meta.appendChild(tag);

    if (n.parentId) {
      const link = document.createElement('button');
      link.className = 'note-parent';
      link.style.cssText = 'background:none;border:none;padding:0;cursor:pointer;font:inherit;color:var(--teal);';
      link.textContent = '↳ ' + I18n.t('inf.bymotif');
      link.title = I18n.t('inf.lineage');
      link.addEventListener('click', e => {
        e.stopPropagation();
        showAncestors(n);
      });
      meta.appendChild(link);
    }

    if (isRanked && typeof n.score === 'number') {
      const sim = document.createElement('span');
      sim.className = 'note-sim';
      sim.textContent = I18n.t('sim.score') + ' ' + Math.round(n.score * 100) + '%';
      meta.appendChild(sim);
    }

    const res = Influence.resonance(n.id) + Influence.resonance(n.eventId);
    if (res > 0) {
      const r = document.createElement('button');
      r.className = 'note-sim';
      r.style.cssText = 'color:var(--teal);background:none;border:none;padding:0;cursor:pointer;font:inherit;';
      r.textContent = '◆ ' + res;
      r.title = I18n.t('inf.resonance');
      r.addEventListener('click', e => {
        e.stopPropagation();
        showChildren(n);
      });
      meta.appendChild(r);
    }

    const date = document.createElement('span');
    date.textContent = Utils.fmtTime(n.createdAt, I18n.getLang());
    meta.appendChild(date);

    el.appendChild(meta);

    if (n.own) {
      const openBtn = document.createElement('button');
      openBtn.className = 'na';
      openBtn.style.cssText = 'position:absolute;top:10px;right:10px;font-size:12px;opacity:.7;';
      openBtn.textContent = '✎';
      openBtn.title = I18n.t('btn.edit');
      openBtn.addEventListener('click', e => {
        e.stopPropagation();
        try { bus.emit('note:open', { id: n.id }); } catch (_) {}
      });
      el.appendChild(openBtn);
    }

    el.addEventListener('click', () => onNoteClick(n));
    return el;
  }

  function render() {
    if (!feedEl) return;
    const state = Store.getState();
    const ctx = state.context;
    const isPinnedMode = ctx.source === 'pin';
    const isTyping = ctx.source === 'input';
    const isDrift = ctx.source === 'drift';
    const isRanked = isPinnedMode || isTyping || isDrift;

    segBar.classList.toggle('on', isTyping || isDrift);
    ctxBanner.classList.toggle('on', isPinnedMode || isDrift);
    if (isPinnedMode || isDrift) {
      ctxSrc.textContent = isDrift ? I18n.t('ctx.drift') : I18n.t('ctx.pinned');
      ctxTxt.textContent = isDrift ? (ctx.pinText || ctx.text) : ctx.text;
    }

    document.querySelectorAll('.seg-b').forEach(b =>
      b.classList.toggle('on', b.getAttribute('data-k') === state.seg));
    cLocal.textContent = state.lists.local.length;
    cWorld.textContent = state.lists.world.length;
    cSeren.textContent = state.lists.seren.length;

    let notes;
    if (isPinnedMode) {
      notes = [...state.lists.local, ...state.lists.world, ...state.lists.seren]
        .filter(n => n.id !== ctx.noteId)
        .sort((a, b) => (b.score || 0) - (a.score || 0));
    } else if (isTyping || isDrift) {
      notes = state.lists[state.seg] || [];
    } else {
      notes = state.feed;
    }

    feedEl.innerHTML = '';
    if (!notes.length) {
      emptyEl.classList.add('on');
      emptyT.textContent = isPinnedMode
        ? I18n.t('empty.world.t')
        : ((isTyping || isDrift) ? I18n.t('empty.' + state.seg + '.t') : I18n.t('empty.local.t'));
    } else {
      emptyEl.classList.remove('on');
      const frag = document.createDocumentFragment();
      notes.forEach((n, i) => frag.appendChild(card(n, isRanked, i)));
      feedEl.appendChild(frag);
    }
  }

  function init() {
    bind();
    if (!feedEl) return;
    // ключи линейки предков, отсутствующие в базовом словаре
    I18n.addDict('ru', { 'inf.lineage': 'Линейка «по мотивам»', 'inf.noancestors': 'Это корень — предков нет' });
    I18n.addDict('en', { 'inf.lineage': '“Inspired by” lineage', 'inf.noancestors': 'This is the root — no ancestors' });

    unsubs.push(Store.subscribe(s => s.context, scheduleRender, Store.shallowEqual));
    unsubs.push(Store.subscribe(s => s.lists, scheduleRender));
    unsubs.push(Store.subscribe(s => s.feed, scheduleRender));
    unsubs.push(Store.subscribe(s => s.seg, scheduleRender));
    unsubs.push(bus.on('i18n:change', scheduleRender));
    unsubs.push(bus.on('db:change', scheduleRender));
    unsubs.push(bus.on('db:cache', scheduleRender));
    unsubs.push(bus.on('influence:updated', scheduleRender));
    // история сети
    if (histBtn) {
      histBtn.addEventListener('click', () => NetService.loadHistory());
      unsubs.push(bus.on('net:history', e => {
        if (!histBtn) return;
        if (e && e.loading) {
          histBtn.disabled = true;
          histBtn.textContent = I18n.t('net.loading');
        } else {
          histBtn.disabled = false;
          histBtn.textContent = I18n.t('net.loadmore');
        }
      }));
    }
    document.querySelectorAll('.seg-b').forEach(b =>
      b.addEventListener('click', () => Store.setState({ seg: b.getAttribute('data-k') })));
    if (ctxX) ctxX.addEventListener('click', () => Context.clearPin());
    render();
  }

  function destroy() {
    unsubs.forEach(u => { try { u(); } catch (_) {} });
    unsubs = [];
  }

  return { init, destroy, render };
}, ['Store', 'Context', 'I18n', 'Utils', 'EventBus', 'Influence', 'Provenance', 'Modal', 'NetService']);
// ─── UI/FeedView ─── END ─────────────────────────────────────

// ─── UI/BaseView ─── START ───────────────────────────────────
/**
 * Экран «База»: список своих заметок, статистика, поиск, сортировка.
 * Клик по заметке открывает NoteView (просмотр/правка/удаление).
 * Обновляется по db:change / смене вида / языка.
 * @deps Store, DB, I18n, Utils, EventBus
 * @exports BaseView
 */
DI.register('BaseView', function (Store, DB, I18n, Utils, bus) {
  let listEl, statsTotal, statsOpen, statsPriv, qEl, sortEl;
  let unsubs = [];
  let rafPending = false;

  function bind() {
    listEl = document.getElementById('base-list');
    statsTotal = document.getElementById('bs-total');
    statsOpen = document.getElementById('bs-open');
    statsPriv = document.getElementById('bs-priv');
    qEl = document.getElementById('base-q');
    sortEl = document.getElementById('base-sort');
  }

  function scheduleRender() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; render(); });
  }

  /** Перерисовывает статистику и список. */
  function render() {
    if (!listEl) return;
    const view = Store.get('view');
    if (view !== 'base') return;   // рисуем только когда активны

    const q = (qEl && qEl.value || '').trim().toLowerCase();
    const sort = (sortEl && sortEl.value) || 'new';

    DB.all().then(notes => {
      let arr = notes.slice();
      if (q) arr = arr.filter(n => (n.text || '').toLowerCase().includes(q));
      if (sort === 'old') arr.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      else if (sort === 'az') arr.sort((a, b) => (a.text || '').localeCompare(b.text || '', I18n.getLang() === 'en' ? 'en' : 'ru'));
      else arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      // статистика (по всем, не по фильтру)
      const shared = notes.filter(n => n.shared).length;
      if (statsTotal) statsTotal.textContent = notes.length;
      if (statsOpen) statsOpen.textContent = shared;
      if (statsPriv) statsPriv.textContent = notes.length - shared;

      listEl.innerHTML = '';
      if (!arr.length) {
        const empty = document.createElement('div');
        empty.className = 'note';
        empty.style.cursor = 'default';
        empty.textContent = q ? I18n.t('empty.base.empty') : I18n.t('empty.base.t');
        listEl.appendChild(empty);
        return;
      }

      const frag = document.createDocumentFragment();
      arr.forEach(n => frag.appendChild(row(n)));
      listEl.appendChild(frag);
    }).catch(() => {});
  }

  /** Строка списка базы. @param {Object} n */
  function row(n) {
    const el = document.createElement('div');
    el.className = 'bi';
    el.style.cursor = 'pointer';
    el.dataset.id = n.id;

    const t = document.createElement('div');
    t.className = 'bi-t';
    t.textContent = n.text || '';
    el.appendChild(t);

    const f = document.createElement('div');
    f.className = 'bi-f';

    const tag = document.createElement('span');
    tag.className = 'note-tag ' + (n.shared ? 'world' : 'priv');
    tag.textContent = n.shared ? I18n.t('base.tag.shared') : I18n.t('base.tag.private');
    f.appendChild(tag);

    const date = document.createElement('span');
    date.textContent = Utils.fmtDate(n.updatedAt || n.createdAt, I18n.getLang());
    f.appendChild(date);

    el.appendChild(f);
    el.addEventListener('click', () => { try { bus.emit('note:open', { id: n.id }); } catch (_) {} });
    return el;
  }

  function init() {
    bind();
    if (!listEl) return;
    if (qEl) qEl.addEventListener('input', scheduleRender);
    if (sortEl) sortEl.addEventListener('change', scheduleRender);
    unsubs.push(bus.on('db:change', scheduleRender));
    unsubs.push(bus.on('view:changed', scheduleRender));
    unsubs.push(bus.on('i18n:change', scheduleRender));
    render();
  }

  function destroy() {
    unsubs.forEach(u => { try { u(); } catch (_) {} });
    unsubs = [];
  }

  return { init, destroy, render };
}, ['Store', 'DB', 'I18n', 'Utils', 'EventBus']);
// ─── UI/BaseView ─── END ─────────────────────────────────────

// ─── UI/NoteView ─── START ───────────────────────────────────
/**
 * Полноэкранный просмотр заметки (#noteview): текст, метаданные и действия
 * удалить / переключить видимость / копировать / править.
 * Открывается по событию 'note:open' {id} (из BaseView и FeedView).
 * Закрытие — по клику на фон или Escape.
 * Зависимости очищены: действия идут через NoteActions, Modal не используется
 * (рендер напрямую в #noteview).
 * @deps DB, NoteActions, I18n, Utils, EventBus
 * @exports NoteView
 */
DI.register('NoteView', function (DB, NoteActions, I18n, Utils, bus) {
  let root = null;
  let currentId = null;
  let escHandler = null;

  function ensureRoot() {
    if (!root) root = document.getElementById('noteview');
    return root;
  }

  /** Закрывает оверлей и чистит обработчик Escape. */
  function close() {
    const r = ensureRoot();
    if (r) { r.classList.remove('on'); r.innerHTML = ''; }
    if (escHandler) { document.removeEventListener('keydown', escHandler); escHandler = null; }
    currentId = null;
  }

  /** Открывает заметку по id. @param {string} id */
  function open(id) {
    if (!id) return;
    DB.get(id).then(note => {
      if (!note) {
        // локальной нет — ищем в сетевом кэше
        return DB.cacheGet(id).then(cached => { if (cached) render(cached); });
      }
      render(note);
    }).catch(() => {});
  }

  /** Строит DOM оверлея для заметки. @param {Object} note */
  function render(note) {
    const r = ensureRoot();
    if (!r) return;
    currentId = note.id;
    r.innerHTML = '';
    r.classList.add('on');

    const isOwn = !!(note.id && !note.authorPubkey);   // у своих authorPubkey не ставим

    // ── верхняя панель действий ──
    const top = document.createElement('div');
    top.className = 'nv-f';

    if (isOwn) {
      const del = document.createElement('button');
      del.className = 'nv-act danger';
      del.textContent = I18n.t('btn.del');
      del.addEventListener('click', () => { NoteActions.remove(note.id); close(); });
      top.appendChild(del);

      const tog = document.createElement('button');
      tog.className = 'nv-act';
      tog.textContent = note.shared ? I18n.t('btn.toggle.priv') : I18n.t('btn.toggle.pub');
      tog.addEventListener('click', () => { NoteActions.toggle(note.id); close(); });
      top.appendChild(tog);
    }

    const copy = document.createElement('button');
    copy.className = 'nv-act';
    copy.textContent = I18n.t('btn.copy');
    copy.addEventListener('click', () => NoteActions.copy(note.text));
    top.appendChild(copy);

    if (isOwn) {
      const edit = document.createElement('button');
      edit.className = 'nv-act';
      edit.textContent = I18n.t('btn.edit');
      edit.addEventListener('click', () => {
        close();
        try { bus.emit('note:edit-request', { id: note.id }); } catch (_) {}
      });
      top.appendChild(edit);
    }

    r.appendChild(top);

    // ── тело: метаданные + текст ──
    const body = document.createElement('div');
    body.className = 'nv-b';

    const info = document.createElement('div');
    info.className = 'note-meta';
    info.style.marginBottom = '12px';

    const tag = document.createElement('span');
    if (isOwn) {
      tag.className = 'note-tag ' + (note.shared ? 'world' : 'priv');
      tag.textContent = note.shared ? I18n.t('base.tag.shared') : I18n.t('base.tag.private');
    } else {
      tag.className = 'note-tag world';
      tag.textContent = '· ' + Utils.shortPk(note.authorPubkey || '');
    }
    info.appendChild(tag);

    const date = document.createElement('span');
    date.textContent = Utils.fmtDate(note.updatedAt || note.createdAt, I18n.getLang()) + ' ' +
                       Utils.fmtTime(note.updatedAt || note.createdAt, I18n.getLang());
    info.appendChild(date);
    body.appendChild(info);

    const txt = document.createElement('div');
    txt.className = 'nv-text';
    txt.style.cssText = 'flex:1;overflow-y:auto;font-size:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word;padding:16px;';
    txt.textContent = note.text || '';
    body.appendChild(txt);

    r.appendChild(body);

    // ── нижняя панель: закрыть ──
    const bottom = document.createElement('div');
    bottom.className = 'nv-f-bottom';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'nv-act';
    closeBtn.textContent = I18n.t('btn.close');
    closeBtn.addEventListener('click', close);
    bottom.appendChild(closeBtn);
    r.appendChild(bottom);

    // ── фон: клик мимо контента закрывает ──
    r.addEventListener('click', e => { if (e.target === r) close(); });

    // ── Escape ──
    if (escHandler) document.removeEventListener('keydown', escHandler);
    escHandler = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', escHandler);
  }

  function init() {
    ensureRoot();
    bus.on('note:open', p => { if (p && p.id) open(p.id); });
  }

  function destroy() { close(); }

  return { init, destroy, open, close };
}, ['DB', 'NoteActions', 'I18n', 'Utils', 'EventBus']);
// ─── UI/NoteView ─── END ─────────────────────────────────────

// ─── UI/MenuView ─── START ───────────────────────────────────
/**
 * Меню (кнопка #btn-menu) и переключение экранов Поток/База.
 *  - Модалка настроек: справка, тема, язык, навигация, стереть данные.
 *  - setView показывает/прячет элементы потока (включая btn-history) и панель #base.
 * Тема применяется через data-theme на body. Стереть данные эмитит 'wipe:request'
 * (слушатель ставит Boot).
 * @deps Store, Config, Modal, Toast, I18n, EventBus, Onboarding
 * @exports MenuView
 */
DI.register('MenuView', function (Store, Config, Modal, Toast, I18n, bus, Onboarding) {
  let unsubs = [];

  /** Применяет тему к DOM и сохраняет. @param {'dark'|'light'} theme */
  function applyTheme(theme) {
    document.body.setAttribute('data-theme', theme);
    Config.set('theme', theme);
  }

  /** Переключает экран Поток/База под реальную разметку. @param {'stream'|'base'} view */
  function setView(view) {
    Store.setState({ view });
    const isBase = view === 'base';
    ['ctx-banner', 'seg', 'feed-wrap', 'btn-history', 'composer'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = isBase ? 'none' : '';
    });
    const base = document.getElementById('base');
    if (base) base.classList.toggle('on', isBase);
    try { bus.emit('view:changed', { view }); } catch (_) {}
    viewSync();
  }

  /** Синхронизирует active-классы навигации с текущим view. */
  function viewSync() {
    const view = Store.get('view');
    document.querySelectorAll('.tab-b').forEach(b => b.classList.toggle('on', b.getAttribute('data-v') === view));
    const bb = document.getElementById('btn-base');
    if (bb) bb.classList.toggle('active', view === 'base');
  }

  /** Открывает модалку настроек. */
  function openMenu() {
    const body = document.createElement('div');
    body.style.cssText = 'display:flex;flex-direction:column;gap:12px;';

    // справка
    const helpBtn = document.createElement('button');
    helpBtn.className = 'nv-act';
    helpBtn.textContent = '? ' + I18n.t('menu.help');
    helpBtn.addEventListener('click', () => { Modal.close(); Onboarding.showHelp(false); });
    body.appendChild(helpBtn);

    // тема
    const themeBtn = document.createElement('button');
    themeBtn.className = 'nv-act';
    themeBtn.textContent = I18n.t('menu.theme') + ': ' + (Config.get('theme', 'dark') === 'dark' ? '🌙' : '☀️');
    themeBtn.addEventListener('click', () => {
      const next = Config.get('theme', 'dark') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      Modal.close();
      Toast.show('ok', I18n.t('menu.theme') + ' → ' + next);
    });
    body.appendChild(themeBtn);

    // язык
    const langBtn = document.createElement('button');
    langBtn.className = 'nv-act';
    langBtn.textContent = I18n.t('menu.lang') + ': ' + I18n.getLang().toUpperCase();
    langBtn.addEventListener('click', () => {
      const next = I18n.getLang() === 'ru' ? 'en' : 'ru';
      I18n.setLang(next);
      Modal.close();
    });
    body.appendChild(langBtn);

    // навигация
    const goBase = document.createElement('button');
    goBase.className = 'nv-act';
    goBase.textContent = I18n.t('tab.base');
    goBase.addEventListener('click', () => { Modal.close(); setView('base'); });
    body.appendChild(goBase);

    const goStream = document.createElement('button');
    goStream.className = 'nv-act';
    goStream.textContent = I18n.t('tab.stream');
    goStream.addEventListener('click', () => { Modal.close(); setView('stream'); });
    body.appendChild(goStream);

    // danger: стереть данные
    const wipe = document.createElement('button');
    wipe.className = 'nv-act danger';
    wipe.textContent = I18n.t('base.wipe');
    wipe.addEventListener('click', () => {
      Modal.close();
      Modal.confirm(I18n.t('base.wipe'), I18n.t('base.wipe.confirm'), () => {
        try { bus.emit('wipe:request'); } catch (_) {}
      });
    });
    body.appendChild(wipe);

    Modal.open({ title: I18n.t('menu.settings'), body });
  }

  function init() {
    applyTheme(Config.get('theme', 'dark'));

    const menuBtn = document.getElementById('btn-menu');
    if (menuBtn) menuBtn.addEventListener('click', openMenu);

    const baseBtn = document.getElementById('btn-base');
    if (baseBtn) baseBtn.addEventListener('click', () => setView(Store.get('view') === 'base' ? 'stream' : 'base'));

    document.querySelectorAll('.tab-b').forEach(b => {
      b.addEventListener('click', () => setView(b.getAttribute('data-v')));
    });

    unsubs.push(Store.subscribe(s => s.view, viewSync));
    unsubs.push(bus.on('i18n:change', viewSync));
    viewSync();
  }

  function destroy() {
    unsubs.forEach(u => { try { u(); } catch (_) {} });
    unsubs = [];
  }

  return { init, destroy, setView, openMenu };
}, ['Store', 'Config', 'Modal', 'Toast', 'I18n', 'EventBus', 'Onboarding']);
// ─── UI/MenuView ─── END ─────────────────────────────────────

// ─── INPUT/Hotkeys ─── START ─────────────────────────────────
/**
 * Глобальные горячие клавиши (capture-фаза, срабатывает первым):
 *  - Escape: приоритет «модалка → NoteView → снять пин». Если открыта модалка
 *    или NoteView — просто выходим, их собственные обработчики закроют окно;
 *    пин не трогаем. Иначе снимаем пин.
 *  - '/': фокус на поле ввода (если не печатаешь уже).
 *  - Ctrl/Cmd+Enter обрабатывает сам Composer.
 * Зависит только от Context (Modal/NoteView определяет по DOM, не закрывает сам).
 * @deps Context
 * @exports Hotkeys
 */
DI.register('Hotkeys', function (Context) {
  let handler = null;

  function init() {
    if (handler) return;
    handler = function (e) {
      if (e.key === 'Escape') {
        // 1) открыта модалка — её закроет собственный обработчик Modal
        const overlay = document.getElementById('overlay');
        if (overlay && overlay.classList.contains('on')) return;
        // 2) открыт NoteView — его закроет собственный обработчик NoteView
        const noteview = document.getElementById('noteview');
        if (noteview && noteview.classList.contains('on')) return;
        // 3) ничего не открыто — снимаем пин
        Context.clearPin();
        return;
      }
      if (e.key === '/') {
        const target = e.target;
        const typing = target && (target.tagName === 'TEXTAREA' || target.tagName === 'INPUT');
        if (!typing) {
          const ta = document.getElementById('ed-ta');
          if (ta) { e.preventDefault(); ta.focus(); }
        }
      }
    };
    // capture: перехватываем раньше Modal/NoteView
    document.addEventListener('keydown', handler, true);
  }

  function destroy() {
    if (handler) { document.removeEventListener('keydown', handler, true); handler = null; }
  }

  return { init, destroy };
}, ['Context']);
// ─── INPUT/Hotkeys ─── END ───────────────────────────────────

// ─── BOOT ─── START ──────────────────────────────────────────
/**
 * Точка входа. Резолвит и инициализирует все модули в правильном порядке:
 *  1. Тема (до показа приложения, чтобы не мигнуть неверной темой).
 *  2. Подписчики событий без DOM (Progress, HeaderStatus, Feed, Influence).
 *  3. DOM-модули (Composer, FeedView, NoteView, BaseView, MenuView, Hotkeys).
 *  4. Слушатель wipe:request.
 *  5. Показ приложения (body.ready).
 *  6. Запуск Embedder (шлёт ai-события) и NetService (шлёт net-события).
 *  7. Onboarding последним.
 * Зависимостей через DI не имеет — резолвит модули внутри mount() сам.
 * @exports Boot {mount}
 */
DI.register('Boot', function () {
  /** Собирает и запускает приложение. Вызывать один раз. */
  function mount() {
    // 1. Тема до показа
    const Config = DI.resolve('Config');
    document.body.setAttribute('data-theme', Config.get('theme', 'dark'));

    // 2. Подписчики событий (без DOM)
    DI.resolve('Progress').init();
    DI.resolve('HeaderStatus').init();
    DI.resolve('Feed').init();
    DI.resolve('Influence').init();

    // 3. DOM-модули
    DI.resolve('Composer').init();
    DI.resolve('FeedView').init();
    DI.resolve('NoteView').init();
    DI.resolve('BaseView').init();
    DI.resolve('MenuView').init();
    DI.resolve('Hotkeys').init();

    // 4. Слушатель стирания данных (эмитит MenuView)
    const EventBus = DI.resolve('EventBus');
    const DB = DI.resolve('DB');
    const Toast = DI.resolve('Toast');
    const I18n = DI.resolve('I18n');
    const Store = DI.resolve('Store');
    EventBus.on('wipe:request', () => {
      DB.reset().then(() => {
        Toast.show('ok', I18n.t('toast.base.wiped'));
        Store.setState({ view: 'stream' });
      });
    });

    // 5. Показ приложения
    document.body.classList.add('ready');

    // 6. Запуск AI и сети
    DI.resolve('Embedder').load();
    DI.resolve('NetService').start();

    // 7. Онбординг последним
    DI.resolve('Onboarding').init();
  }

  return { mount };
});
// ─── BOOT ─── END ────────────────────────────────────────────

// ─── ЗАПУСК ─── START ────────────────────────────────────────
DI.resolve('Boot').mount();
// ─── ЗАПУСК ─── END ──────────────────────────────────────────

</script>
