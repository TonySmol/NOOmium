<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>NOOmium</title>

<!-- ═══ PWA: манифест и иконки ═══ -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">

<!-- ═══ iOS PWA meta-теги ═══ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOOmium">
<meta name="mobile-web-app-capable" content="yes">

<!-- ═══ Шрифты: Inter + JetBrains Mono (латиница + кириллица) ═══ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">

<!-- ═══ Стили ═══ -->
<link rel="stylesheet" href="./style.css">
</head>
<body data-theme="dark">

<div id="app">
  <!-- ШАПКА -->
  <header id="hdr">
    <div class="logo">NOO<b>·</b>mium</div>
    <div id="hdr-status">
      <span class="st">
        <span class="dot load" id="st-net-dot"></span>
        <span class="lbl" id="st-net-txt" data-i18n="st.net">сеть</span>
      </span>
      <span class="st">
        <span class="dot load" id="st-ai-dot"></span>
        <span class="lbl" id="st-ai-txt" data-i18n="st.ai.loading">модель</span>
      </span>
    </div>
    <button class="icon-btn" id="btn-base" data-i18n-aria="btn.base.aria" aria-label="Моя база">▤</button>
    <button class="icon-btn" id="btn-menu" data-i18n-aria="btn.menu.aria" aria-label="Меню">
      <i></i><i></i><i></i>
    </button>
  </header>

  <!-- ОФФЛАЙН БАР -->
  <div id="offline-bar">
    <span id="offline-text" data-i18n="net.offline">офлайн — заметки сохраняются локально</span>
  </div>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <div id="main">
    <!-- Баннер контекста -->
    <div id="ctx-banner">
      <span class="ctx-src" id="ctx-src"></span>
      <span class="ctx-txt" id="ctx-txt"></span>
      <button class="ctx-x" id="ctx-x" data-i18n-aria="btn.ctx.clear.aria" aria-label="Снять контекст">✕</button>
    </div>

    <!-- Сегменты (табы) -->
    <div id="seg">
      <button class="seg-b on" data-k="local">
        <span data-i18n="seg.local">Моё</span>
        <span class="cnt" id="c-local">0</span>
      </button>
      <button class="seg-b" data-k="world">
        <span data-i18n="seg.world">Мир</span>
        <span class="cnt" id="c-world">0</span>
      </button>
      <button class="seg-b" data-k="seren">
        <span data-i18n="seg.seren">Озарения</span>
        <span class="cnt" id="c-seren">0</span>
      </button>
    </div>

    <!-- Лента -->
    <div id="feed-wrap">
      <div id="feed"></div>
      <div id="feed-empty">
        <div class="ic">◇</div>
        <div id="feed-empty-t"></div>
      </div>
    </div>

    <!-- Блок уведомлений (fixed, поверх всего — см. style.css) -->
    <div id="notif-bar">
      <div id="toasts"></div>
    </div>

    <!-- Композер (иконка отправки вставляется из Composer.init) -->
    <div id="composer">
      <textarea id="ed-ta" rows="1" data-i18n-ph="ed.placeholder" aria-label="Текст заметки"></textarea>
      <div id="ed-foot">
        <span id="ed-cnt">0 <span data-i18n="ed.chars">симв.</span></span>
        <div id="ed-acts">
          <div id="mode-toggle" data-mode="private" role="radiogroup" aria-label="Режим видимости">
            <div class="mt-thumb"></div>
            <div class="mt-opt on" data-v="private" data-i18n="btn.private" role="radio" aria-checked="true">Личное</div>
            <div class="mt-opt" data-v="world" data-i18n="btn.public" role="radio" aria-checked="false">Мир</div>
          </div>
          <button id="btn-send" data-i18n-aria="btn.send.aria" aria-label="Отправить">
            <span class="send-icon"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- База -->
    <div id="base">
      <div id="base-h">
        <div id="base-stats">
          <div class="bstat">
            <b id="bs-total">0</b>
            <span data-i18n="base.stat.total">всего</span>
          </div>
          <div class="bstat">
            <b id="bs-open">0</b>
            <span data-i18n="base.stat.open">открыто</span>
          </div>
          <div class="bstat">
            <b id="bs-priv">0</b>
            <span data-i18n="base.stat.priv">лично</span>
          </div>
        </div>
        <div id="base-ctrls">
          <input id="base-q" data-i18n-ph="base.search" aria-label="Поиск по базе">
          <select id="base-sort" aria-label="Сортировка">
            <option value="new" data-i18n="base.sort.new">новые</option>
            <option value="old" data-i18n="base.sort.old">старые</option>
            <option value="az" data-i18n="base.sort.az">а-я</option>
          </select>
        </div>
      </div>
      <div id="base-list"></div>
    </div>
  </div>
</div>

<!-- МОДАЛЬНЫЕ ОКНА -->
<div id="overlay" role="dialog" aria-modal="true">
  <div id="modal">
    <div id="modal-h">
      <div id="modal-t"></div>
      <button id="modal-x" aria-label="Закрыть">✕</button>
    </div>
    <div id="modal-b"></div>
    <div id="modal-f"></div>
  </div>
</div>

<!-- ПРОГРЕСС -->
<div id="progress" role="alert" aria-live="polite">
  <div class="prog-c">
    <div class="prog-title" data-i18n="progress.title">Загружаем модель</div>
    <div class="prog-sub" id="prog-info"></div>
    <div class="prog-bar">
      <div class="prog-fill" id="prog-fill"></div>
    </div>
    <div class="prog-pct" id="prog-pct">0%</div>
  </div>
</div>

<!-- ПРОСМОТР ЗАМЕТКИ -->
<div id="noteview" role="dialog" aria-modal="true"></div>

<!-- ═══ РЕГИСТРАЦИЯ SERVICE WORKER ═══ -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => {
          console.log('[SW] зарегистрирован:', reg.scope);

          reg.update();

          window.addEventListener('focus', () => reg.update());

          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            console.log('[SW] найден новый worker');

            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[SW] новый worker готов, отправляю SKIP_WAITING');
                  newWorker.postMessage('SKIP_WAITING');
                }
              });
            }
          });

          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            console.log('[SW] controller изменился, перезагружаю');
            window.location.reload();
          });
        })
        .catch(err => console.warn('[SW] регистрация упала:', err));
    });
  }
</script>

<script>
  // Проверяем обновления каждые 30 минут
  if ('serviceWorker' in navigator) {
    setInterval(() => {
      navigator.serviceWorker.ready.then(reg => {
        reg.update();
      });
    }, 30 * 60 * 1000);
  }
</script>

<!-- ═══ TELEGRAM WEB APP API (безопасная загрузка + сигнал готовности) ═══ -->
<script>
  (function () {
    try {
      var s = document.createElement('script');
      s.src = 'https://telegram.org/js/telegram-web-app.js';
      s.async = true;
      s.onload = function () {
        try { window.dispatchEvent(new Event('tg:ready')); } catch (e) {}
      };
      s.onerror = function () {
        console.warn('[TG] API недоступен, работаем как обычный сайт');
      };
      document.head.appendChild(s);
    } catch (e) {
      console.warn('[TG] не удалось загрузить скрипт:', e);
    }
  })();
</script>

<!-- ═══ ПРИЛОЖЕНИЕ ═══ -->
<script type="module" src="./app.js"></script>
</body>
</html>
