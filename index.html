<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>NOOmium</title>

<!-- ═══ PWA: манифест и иконки ═══ -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">

<!-- ═══ iOS PWA meta-теги ═══ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOOmium">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* ═══════════════════════════════════════════════════════════════════════════════
   ЦВЕТОВАЯ СИСТЕМА (DARK / LIGHT)
   Нейтральная, высококонтрастная палитра. Linear / Vercel / Stripe.
   ═══════════════════════════════════════════════════════════════════════════════ */

:root {
  /* Тёмная тема (по умолчанию) */
  --bg: #0a0a0b;
  --bg-2: #111113;
  --surface: #141417;
  --surface-2: #1c1c20;
  --surface-3: #26262c;
  
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.13);
  
  --text: #fafafa;
  --text-2: #a1a1aa;
  --text-3: #71717a;
  
  /* Акценты */
  --amber: #f59e0b;
  --amber-glow: rgba(245, 158, 11, 0.12);
  --amber-hover: #d97706;
  
  --teal: #14b8a6;
  --teal-glow: rgba(20, 184, 166, 0.12);
  --teal-hover: #0d9488;
  
  --rose: #f43f5e;
  --rose-glow: rgba(244, 63, 94, 0.12);
  --rose-hover: #e11d48;
  
  --green: #22c55e;
  --green-glow: rgba(34, 197, 94, 0.12);
  
  /* Шрифты */
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  
  /* Радиусы */
  --r: 12px;
  --r-sm: 8px;
  --r-xs: 6px;
  
  /* Анимации */
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  
  /* Безопасные зоны (iOS) */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  
  /* Тени */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.4);
  --shadow-xl: 0 24px 64px rgba(0, 0, 0, 0.5);
}

/* Светлая тема */
[data-theme="light"] {
  --bg: #fafafa;
  --bg-2: #ffffff;
  --surface: #ffffff;
  --surface-2: #f4f4f5;
  --surface-3: #e4e4e7;
  
  --line: rgba(0, 0, 0, 0.06);
  --line-2: rgba(0, 0, 0, 0.12);
  
  --text: #18181b;
  --text-2: #52525b;
  --text-3: #a1a1aa;
  
  --amber: #d97706;
  --amber-glow: rgba(217, 119, 6, 0.1);
  --amber-hover: #b45309;
  
  --teal: #0d9488;
  --teal-glow: rgba(13, 148, 136, 0.1);
  --teal-hover: #0f766e;
  
  --rose: #e11d48;
  --rose-glow: rgba(225, 29, 72, 0.1);
  --rose-hover: #be123c;
  
  --green: #16a34a;
  --green-glow: rgba(22, 163, 74, 0.1);
  
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.12);
  --shadow-xl: 0 24px 64px rgba(0, 0, 0, 0.16);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   СБРОС И БАЗОВЫЕ СТИЛИ
   ═══════════════════════════════════════════════════════════════════════════════ */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 15px / 1.55 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Глобальный запрет выделения текста (эстетика и защита от случайного копирования).
   Исключения: поля ввода и режим редактирования заметок. */
body {
  background-image:
    radial-gradient(720px 460px at 92% -6%, var(--amber-glow), transparent 60%),
    radial-gradient(720px 480px at -6% 108%, var(--teal-glow), transparent 60%);
  background-attachment: fixed;
  transition: background-color 0.3s var(--ease);
  -webkit-user-select: none;
  user-select: none;
}

/* Разрешаем выделение в полях ввода */
input,
textarea,
[contenteditable="true"] {
  -webkit-user-select: text;
  user-select: text;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

input, textarea, select {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  outline: none;
}

/* Скроллбар */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
::-webkit-scrollbar-track { background: transparent; }

/* Фокус: только для клавиатурной навигации, янтарный.
   Для полей ввода (input, textarea, select) фокус показываем
   только через смену цвета рамки (одинарная тонкая линия),
   чтобы не было двойного кольца из-за :focus. */
:focus { outline: none; }

:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}

input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: none;
}

/* Выделение текста: насыщенный янтарный */
::selection {
  background: rgba(245, 158, 11, 0.25);
  color: var(--text);
}

[data-theme="light"] ::selection {
  background: rgba(217, 119, 6, 0.2);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   УНИВЕРСАЛЬНАЯ СИСТЕМА КНОПОК
   Единый визуальный язык для всех интерактивных элементов.
   Модификаторы: .primary, .danger, .ghost, .icon
   ═══════════════════════════════════════════════════════════════════════════════ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 8px 16px;
  border-radius: var(--r-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  background: var(--surface-2);
  border: 1px solid var(--line);
  transition: background 0.12s var(--ease),
              color 0.12s var(--ease),
              border-color 0.12s var(--ease),
              transform 0.1s var(--ease);
  -webkit-user-select: none;
  user-select: none;
  white-space: nowrap;
  line-height: 1;
}

.btn:hover:not(:disabled) {
  background: var(--surface-3);
  color: var(--text);
  border-color: var(--line-2);
}

.btn:active:not(:disabled) {
  transform: scale(0.97);
}

.btn:disabled {
  opacity: 0.5;
  cursor: wait;
}

.btn.primary {
  background: var(--amber);
  color: #1a1206;
  border-color: transparent;
  box-shadow: var(--shadow-sm);
}

.btn.primary:hover:not(:disabled) {
  background: var(--amber-hover);
  color: #1a1206;
}

.btn.danger {
  color: var(--rose);
  background: var(--rose-glow);
  border-color: transparent;
}

.btn.danger:hover:not(:disabled) {
  background: var(--rose);
  color: #fff;
}

.btn.ghost {
  background: transparent;
  border-color: transparent;
}

.btn.ghost:hover:not(:disabled) {
  background: var(--surface-2);
}

.btn.icon {
  width: 40px;
  padding: 0;
}

.btn svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ОСНОВНАЯ СТРУКТУРА
   ═══════════════════════════════════════════════════════════════════════════════ */

#app {
  display: none;
  flex-direction: column;
  height: 100dvh;
  max-height: 100dvh;
  position: relative;
  overflow: hidden;
}

body.ready #app { display: flex; }

/* ═══════════════════════════════════════════════════════════════════════════════
   ШАПКА (HEADER)
   ═══════════════════════════════════════════════════════════════════════════════ */

#hdr {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  padding-top: calc(10px + var(--safe-top));
  min-height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

.logo {
  font: 600 18px / 1 var(--display);
  letter-spacing: -0.02em;
  color: var(--text);
  flex-shrink: 0;
}

.logo b {
  color: var(--amber);
  font-weight: 700;
}

#hdr-status {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  justify-content: flex-end;
  font: 500 11px / 1 var(--mono);
  color: var(--text-3);
  overflow: hidden;
  min-width: 0;
}

.st {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: color 0.15s var(--ease);
}

.st .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-3);
  flex-shrink: 0;
  transition: background 0.2s var(--ease), box-shadow 0.2s var(--ease);
}

.st .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green-glow); }
.st .dot.warn { background: var(--amber); box-shadow: 0 0 6px var(--amber-glow); }
.st .dot.err { background: var(--rose); box-shadow: 0 0 6px var(--rose-glow); }
.st .dot.load {
  background: var(--teal);
  box-shadow: 0 0 6px var(--teal-glow);
  animation: pulse 1.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

/* Кнопки-иконки в шапке */
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  font-size: 16px;
  transition: background 0.15s var(--ease), color 0.15s var(--ease), transform 0.1s var(--ease);
  flex-shrink: 0;
}

.icon-btn:hover {
  background: var(--surface-2);
  color: var(--text);
}

.icon-btn:active {
  background: var(--surface-3);
  transform: scale(0.96);
}

.icon-btn.active {
  background: var(--amber-glow);
  color: var(--amber);
}

/* Бургер-меню */
#btn-menu {
  flex-direction: column;
  gap: 4px;
}

#btn-menu i {
  width: 16px;
  height: 2px;
  background: currentColor;
  border-radius: 1px;
  display: block;
  transition: transform 0.2s var(--ease);
}

/* Оффлайн-бар */
#offline-bar {
  display: none;
  background: var(--rose-glow);
  color: var(--rose);
  font: 500 11px / 1 var(--mono);
  padding: 6px 16px;
  text-align: center;
  border-bottom: 1px solid var(--line-2);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ОСНОВНОЙ КОНТЕНТ (MAIN)
   ═══════════════════════════════════════════════════════════════════════════════ */

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
  position: relative;
}

/* Баннер контекста */
#ctx-banner {
  display: none;
  align-items: center;
  gap: 10px;
  margin: 10px 14px 0;
  padding: 10px 12px;
  background: var(--amber-glow);
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  font-size: 12px;
}

#ctx-banner.on { display: flex; }

#ctx-banner .ctx-src {
  font: 600 10px / 1 var(--mono);
  color: var(--amber);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  flex-shrink: 0;
}

#ctx-banner .ctx-txt {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  min-width: 0;
}

#ctx-banner .ctx-x {
  color: var(--text-3);
  font-size: 14px;
  width: 24px;
  height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  transition: background 0.15s var(--ease), color 0.15s var(--ease);
  flex-shrink: 0;
}

#ctx-banner .ctx-x:hover {
  background: var(--surface-2);
  color: var(--text);
}

/* Сегменты (табы) */
#seg {
  display: none;
  gap: 2px;
  margin: 10px 14px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  flex-shrink: 0;
}

#seg.on { display: flex; }

.seg-b {
  flex: 1;
  padding: 8px 6px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s var(--ease);
  -webkit-user-select: none;
  user-select: none;
  min-width: 0;
}

.seg-b:hover:not(.on) {
  color: var(--text-2);
  background: var(--surface-2);
}

.seg-b.on {
  background: var(--surface-2);
  color: var(--text);
}

.seg-b .cnt {
  font: 600 10px / 1 var(--mono);
  padding: 2px 6px;
  border-radius: 9px;
  background: var(--surface-3);
  color: var(--text-2);
  min-width: 18px;
  text-align: center;
  transition: all 0.15s var(--ease);
  flex-shrink: 0;
}

.seg-b.on .cnt {
  background: var(--amber-glow);
  color: var(--amber);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ЛЕНТА
   ═══════════════════════════════════════════════════════════════════════════════ */

#feed-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
}

#feed {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: 10px 14px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}

/* Карточка заметки */
.note {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  animation: noteIn 0.25s var(--ease-out) both;
  display: flex;
  flex-direction: column;
}

.note:hover {
  border-color: var(--line-2);
  box-shadow: var(--shadow-sm);
}

.note.pinned {
  border-color: var(--amber);
  box-shadow: var(--shadow-sm);
}

@keyframes noteIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.note-txt {
  font-size: 15px;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 10px;
  color: var(--text);
  line-height: 1.55;
}

/* Мета-блок: прижат к низу, адаптивный */
.note-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 400 11px / 1 var(--mono);
  color: var(--text-3);
  flex-wrap: wrap;
  letter-spacing: 0;
  margin-top: auto;
  padding-top: 10px;
}

/* Теги */
.note-tag {
  padding: 3px 7px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  line-height: 1;
  flex-shrink: 0;
  white-space: nowrap;
}

.note-tag.priv {
  background: var(--surface-3);
  color: var(--text-2);
}

.note-tag.world {
  background: var(--teal-glow);
  color: var(--teal);
}

/* Вертикальный разделитель между группами */
.note-meta-sep {
  width: 1px;
  height: 14px;
  background: var(--line-2);
  flex-shrink: 0;
}

/* Кнопки навигации: стрелка и ромб (24×24, бирюзовые) */
.note-sim,
.note-parent {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-xs);
  color: var(--teal);
  font-size: 11px;
  font-weight: 600;
  width: 24px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s var(--ease), border-color 0.12s var(--ease), color 0.12s var(--ease);
  flex-shrink: 0;
  line-height: 1;
  cursor: pointer;
}

.note-sim:hover:not(:disabled),
.note-parent:hover:not(:disabled) {
  background: var(--surface-3);
  border-color: var(--line-2);
}

.note-parent.orphan {
  opacity: 0.35;
  text-decoration: line-through;
  cursor: default;
  pointer-events: none;
}

/* Индикатор сходства (проценты или сигнал) */
.note-sim-info {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
  font-size: 11px;
  font-family: var(--mono);
  letter-spacing: 0;
  white-space: nowrap;
  flex-shrink: 0;
  color: var(--amber);
}

/* Палочки индикатора сигнала */
.sig-bar {
  display: inline-block;
  width: 4px;
  height: 12px;
  border-radius: 1px;
  flex-shrink: 0;
}

.sig-bar.sig-full {
  background: var(--amber);
}

.sig-bar.sig-empty {
  background: var(--surface-3);
}

/* Текстовая метка рядом с индикатором */
.sig-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-2);
}

/* Время — серый, прижато вправо */
.note-date {
  color: var(--text-3);
  font-size: 11px;
  font-family: var(--mono);
  letter-spacing: 0;
  white-space: nowrap;
  flex-shrink: 0;
  margin-left: auto;
}

/* Кнопка карандаша (24×24) */
.na {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-xs);
  color: var(--text-2);
  font-size: 12px;
  width: 24px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s var(--ease), color 0.12s var(--ease), border-color 0.12s var(--ease);
  flex-shrink: 0;
  line-height: 1;
}

.na:hover {
  background: var(--surface-3);
  color: var(--amber);
  border-color: var(--amber);
}

/* Пустое состояние */
#feed-empty {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px;
  color: var(--text-3);
}

#feed-empty.on { display: flex; }

#feed-empty .ic {
  font: 700 30px / 1 var(--display);
  opacity: 0.4;
  margin-bottom: 12px;
}

#feed-empty-t {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
}

/* Кнопка "Загрузить ещё" */
.hist-btn {
  align-self: center;
  margin: 8px 0 10px;
  padding: 8px 18px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--text-2);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s var(--ease);
}

.hist-btn:hover:not(:disabled) {
  border-color: var(--amber);
  color: var(--text);
  background: var(--amber-glow);
}

.hist-btn:disabled {
  opacity: 0.5;
  cursor: default;
}

/* ═══════════════════════════════════════════════════════════════════════════════

  font-weight: 600;

}

.mt-opt:hover:not(.on) { color: var(--text-2); }
.mt-opt.on { color: var(--text); }

#mode-toggle[data-mode="world"] .mt-opt[data-v="world"] { color: var(--teal); }
#mode-toggle[data-mode="private"] .mt-opt[data-v="private"] { color: var(--amber); }

.mt-thumb {
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: 3px;

}

#btn-send {

  border-radius: 999px;

}

}

/* ═══════════════════════════════════════════════════════════════════════════════
   БАЗА (BASE VIEW)
   ═══════════════════════════════════════════════════════════════════════════════ */

#base {

#base-h {

  overflow: hidden;
}

.bi-f {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font: 400 11px / 1 var(--mono);
  color: var(--text-3);

/* ═══════════════════════════════════════════════════════════════════════════════
   МОДАЛЬНЫЕ ОКНА И ОВЕРЛЕИ
   ═══════════════════════════════════════════════════════════════════════════════ */

#overlay {

#modal {

}

#modal-f {

/* Кнопки в футере модалок (алиас к .btn) */
.mbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 9px 18px;
  border-radius: var(--r-sm);
  font-weight: 600;
  font-size: 13px;
  border: 1px solid var(--line);

}

}

#notif-bar {

}

#toasts {

}

/* Прогресс загрузки модели */
#progress {
  position: fixed;
  inset: 0;

  align-items: center;
  justify-content: center;

<!-- ═══ РЕГИСТРАЦИЯ SERVICE WORKER (отдельно от модуля, чтобы работал всегда) ═══ -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => {
          console.log('[SW] зарегистрирован:', reg.scope);
          
          // Проверяем обновления при загрузке
          reg.update();
          
          // Проверяем обновления при возвращении вкладки в фокус
          window.addEventListener('focus', () => reg.update());
          
          // Обнаружен новый SW
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            console.log('[SW] найден новый worker');
            
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                // Новый SW установлен — активируем его
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[SW] новый worker готов, отправляю SKIP_WAITING');
                  newWorker.postMessage('SKIP_WAITING');
                }
              });
            }
          });
          
          // Обработка изменения controller (когда новый SW захватил страницу)
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            console.log('[SW] controller изменился, перезагружаю');
            window.location.reload();
          });
        })
        .catch(err => console.warn('[SW] регистрация упала:', err));
    });
  }
</script>

<script type="module">
'use strict';

// ═══════════════════════════════════════════════════════════════════════════════
// ВЕРСИЯ ПРИЛОЖЕНИЯ
// ═══════════════════════════════════════════════════════════════════════════════
const APP_VERSION = '0.6.8';

// ═══════════════════════════════════════════════════════════════════════════════
// CORE/DI - ПРЕАМБУЛА
// ═══════════════════════════════════════════════════════════════════════════════
const DI = (() => {
  const factories = new Map();
  const instances = new Map();
  
  function register(name, factory, deps) {
    factories.set(name, { factory, deps: deps || [] });
  }
  
  function resolve(name, visiting) {
    if (instances.has(name)) return instances.get(name);
    const def = factories.get(name);
    if (!def) throw new Error('Module not found: ' + name);
    visiting = visiting || new Set();
    if (visiting.has(name)) throw new Error('Circular dependency: ' + name);
    visiting.add(name);
    const args = def.deps.map(d => resolve(d, visiting));
    visiting.delete(name);
    const inst = def.factory(...args);
    instances.set(name, inst);
    return inst;
  }
  
  return { register, resolve };
})();

// ─── CORE/Config ─── START ──────────────────────────────────────────────────
/**
 * Глобальная конфигурация приложения с поддержкой миграций схемы.
 * 
 * Единственный источник истины для всех настраиваемых параметров.
 * При добавлении нового параметра:
 * 1. Добавить в `defaults`
 * 2. При необходимости добавить миграцию в `migrations`
 * 3. Поднять `SCHEMA_VERSION`
 */
DI.register('Config', function () {
  const KEY = 'noomium:cfg';
  const SCHEMA_VERSION = 7;

  const defaults = Object.freeze({
    schemaVersion: SCHEMA_VERSION,
    room: 'noomium-main',
    theme: 'dark',
    lang: null,
    onboarded: false,
    logLevel: 'info',

    // AI / Embedding
    model: 'onnx-community/granite-embedding-97m-multilingual-r2-ONNX',
    dim: 384,
    aiCacheLimit: 300,
    aiEmbedTimeout: 15000,

    // Ранжирование (адаптировано под Granite R2, диапазон ~0.55–0.93)
    threshold: 0.81,
    serendipity: 0.07,
    duplicateThreshold: 0.88,

    // Отображение сходства: 'signal' (индикатор + текст) или 'percent' (сырые %)
    similarityDisplay: 'signal',

    // Nostr / сеть
    relays: [
      'wss://relay.damus.io',
      'wss://relay.primal.net',
      'wss://offchain.pub',
      'wss://nos.lol',
      'wss://nostr.oxtr.dev',
      'wss://relay.mostr.pub',
    ],
    kNote: 1,
    kQuery: 21000,
    kAnswer: 21001,
    kDelete: 5,
    queryRateLimit: 3000,
    maxResponses: 8,
    responseWindow: 6000,
    centroidCount: 12,
    peerTTL: 60000,
    heartbeat: 30000,
    subWindow: 300,
    historyMaxWindow: 2592000,
    relayErrorThreshold: 5,
    relayCircuitBreakTime: 120000,
    relayBackoff1: 15000,
    relayBackoff2: 30000,
    reconnectMaxAttempts: 10,
    reconnectBaseDelay: 1000,
    reconnectMaxDelay: 60000,
    seenMaxSize: 1000,
    maxAnswerTextLength: 10000,
    maxNoteTextLength: 10000,
    maxIncomingNotesPerPeer: 20,

    // Хранилище
    dbName: 'noomium_v2',
    storeName: 'notes',
    cacheStoreName: 'cache',

    // UI / UX
    debounce: 350,
    baseSearchDebounce: 200,
    truncateTextLength: 140,
    toastMaxVisible: 3,
    toastDefaultDuration: 2200,
    maxPasswordAttempts: 3,
    influenceWeightByAge: true,
    indexerUrl: null,
    premiumRelay: null,
    gpuRanking: false,
    cloudView: false,

    // Лимиты длины поста
    maxPostLength: 2500,
    softLimit: 1200,
    hardLimit: 2000,

    // Telegram: если пользователь вручную выбрал тему, игнорируем themeChanged
    userThemeOverride: false,
  });

  const migrations = {
    // Исторические миграции (оставлены для совместимости цикла)
    1: s => s,
    2: s => s,
    3: s => s,
    4: s => s,

    // v5: адаптация порогов под Granite R2
    5: s => {
      if (typeof s.threshold === 'number' && s.threshold === 0.65) {
        s.threshold = defaults.threshold;
      }
      if (typeof s.serendipity === 'number' && s.serendipity === 0.25) {
        s.serendipity = defaults.serendipity;
      }
      if (typeof s.vectorSimilarityThreshold === 'number' && s.vectorSimilarityThreshold === 0.98) {
        s.vectorSimilarityThreshold = 0.95;
      }
      return s;
    },

    // v6: добавлен режим отображения сходства
    6: s => {
      if (typeof s.similarityDisplay !== 'string') {
        s.similarityDisplay = defaults.similarityDisplay;
      }
      return s;
    },

    // v7: переименование vectorSimilarityThreshold → duplicateThreshold
    7: s => {
      if ('vectorSimilarityThreshold' in s) {
        s.duplicateThreshold = s.vectorSimilarityThreshold;
        delete s.vectorSimilarityThreshold;
      }
      if (typeof s.duplicateThreshold !== 'number') {
        s.duplicateThreshold = defaults.duplicateThreshold;
      }
      return s;
    },
  };

  const state = Object.assign({}, defaults);

  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      let saved = JSON.parse(raw);
      if (saved && typeof saved === 'object') {
        let v = saved.schemaVersion || saved.version || 1;
        while (v < SCHEMA_VERSION) {
          const migrate = migrations[v];
          if (typeof migrate === 'function') {
            saved = migrate(saved);
          }
          v++;
        }
        saved.schemaVersion = SCHEMA_VERSION;
        for (const k of Object.keys(defaults)) {
          if (k in saved) state[k] = saved[k];
        }
      }
    }
  } catch (_) {}

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (_) {}
  }

  return {
    get(k, def) { return (k in state) ? state[k] : def; },
    set(k, v) { state[k] = v; persist(); },
    save: persist,
    defaults() { return Object.assign({}, defaults); },
    all() { return Object.assign({}, state); },
    schemaVersion() { return SCHEMA_VERSION; },
    reset() {
      for (const k of Object.keys(defaults)) state[k] = defaults[k];
      persist();
    },
  };
});
// ─── CORE/Config ─── END ────────────────────────────────────────────────────

// ─── CORE/EventBus ─── START ────────────────────────────────────────────────
/**
 * Простая шина событий с поддержкой точечных подписок и wildcard ('*').
 * Все модули общаются исключительно через неё, избегая прямых ссылок друг на друга.
 */
DI.register('EventBus', function () {
  const map = new Map();
  const wild = new Set();

  /**
   * Подписаться на событие.
   * @param {string} event - Имя события или '*' для перехвата всех.
   * @param {Function} fn - Обработчик.
   * @returns {Function} Функция отписки.
   */
  function on(event, fn) {
    if (typeof fn !== 'function') return () => {};
    if (event === '*') {
      wild.add(fn);
      return () => wild.delete(fn);
    }
    if (!map.has(event)) map.set(event, new Set());
    map.get(event).add(fn);
    return () => {
      const s = map.get(event);
      if (s) {
        s.delete(fn);
        if (!s.size) map.delete(event);
      }
    };
  }

  /**
   * Подписаться на одно срабатывание.
   */
  function once(event, fn) {
    const off = on(event, (...a) => {
      off();
      fn(...a);
    });
    return off;
  }

  /**
   * Отписаться (альтернатива вызову функции отписки).
   */
  function off(event, fn) {
    if (event === '*') {
      wild.delete(fn);
      return;
    }
    const s = map.get(event);
    if (s) {
      s.delete(fn);
      if (!s.size) map.delete(event);
    }
  }

  /**
   * Эмит события. Ошибки в обработчиках логируются, но не прерывают цепочку.
   */
  function emit(event, payload) {
    const s = map.get(event);
    if (s) {
      for (const fn of Array.from(s)) {
        try {
          fn(payload);
        } catch (e) {
          console.error('[bus:' + event + ']', e);
        }
      }
    }
    if (wild.size) {
      for (const fn of Array.from(wild)) {
        try {
          fn(event, payload);
        } catch (e) {
          console.error('[bus:*]', e);
        }
      }
    }
  }

  return { on, once, off, emit };
});
// ─── CORE/EventBus ─── END ──────────────────────────────────────────────────

// ─── CORE/Logger ─── START ──────────────────────────────────────────────────
/**
 * Логгер с уровнями, цветным выводом в консоль и кольцевым буфером истории.
 */
DI.register('Logger', function () {
  const LEVELS = { debug: 10, info: 20, warn: 30, error: 40 };
  const COLORS = {
    debug: 'color:#56c2b8',
    info: 'color:#e8a33d',
    warn: 'color:#e5c156',
    error: 'color:#e5646e;font-weight:bold',
  };

  let threshold = LEVELS.info;
  const ring = [];
  const RING_MAX = 200;

  const ts = () => new Date().toISOString().substr(11, 12);

  function write(level, msg, data) {
    const time = ts();
    ring.push({ ts: time, level, msg, data });
    if (ring.length > RING_MAX) ring.shift();

    if (LEVELS[level] < threshold) return;
    const fn = console[level] || console.log;
    const prefix = '%c[' + time + '][' + level.toUpperCase() + ']';
    if (data === undefined) {
      fn(prefix, COLORS[level], msg);
    } else {
      fn(prefix, COLORS[level], msg, data);
    }
  }

  return {
    setLevel(l) {
      if (LEVELS[l]) threshold = LEVELS[l];
    },
    debug(m, d) { write('debug', m, d); },
    info(m, d) { write('info', m, d); },
    warn(m, d) { write('warn', m, d); },
    error(m, d) { write('error', m, d); },
    history() { return ring.slice(); },
    dump() {
      for (const r of ring) {
        const fn = console[r.level] || console.log;
        fn('[' + r.ts + '][' + r.level.toUpperCase() + ']', r.msg, r.data === undefined ? '' : r.data);
      }
    },
  };
});
// ─── CORE/Logger ─── END ────────────────────────────────────────────────────

// ─── CORE/Utils ─── START ───────────────────────────────────────────────────
/**
 * Утилиты: экранирование, плюрализация, форматирование дат, debounce.
 */
DI.register('Utils', function () {
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  /**
   * HTML-экранирование.
   * ВНИМАНИЕ: в текущей версии приложения весь пользовательский контент
   * рендерится через `textContent`, поэтому эта функция зарезервирована
   * на случай будущего rich-text рендеринга.
   */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);
  }

  function escRe(s) {
    return String(s == null ? '' : s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function plural(n, one, few, many) {
    n = Math.abs(n);
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return one;
    if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
    return many;
  }

  const words = {
    symbols: (n, l) => n + ' ' + (l === 'en' ? plural(n, 'char', 'chars', 'chars') : plural(n, 'символ', 'символа', 'символов')),
    peers: (n, l) => n + ' ' + (l === 'en' ? plural(n, 'peer', 'peers', 'peers') : plural(n, 'узел', 'узла', 'узлов')),
    thoughts: (n, l) => n + ' ' + (l === 'en' ? plural(n, 'note', 'notes', 'notes') : plural(n, 'мысль', 'мысли', 'мыслей')),
    descendants: (n, l) => n + ' ' + (l === 'en' ? plural(n, 'heir', 'heirs', 'heirs') : plural(n, 'потомок', 'потомка', 'потомков')),
  };

  function word(key, n, lang) {
    const fn = words[key];
    return fn ? fn(n, lang) : String(n);
  }

  function fmtDate(ts, lang) {
    if (!ts) return '';
    try {
      return new Date(ts).toLocaleDateString(lang === 'en' ? 'en-US' : 'ru-RU', {
        day: '2-digit',
        month: 'short',
      });
    } catch (_) {
      return '';
    }
  }

  function fmtTime(ts, lang) {
    if (!ts) return '';
    try {
      return new Date(ts).toLocaleTimeString(lang === 'en' ? 'en-US' : 'ru-RU', {
        hour: '2-digit',
        minute: '2-digit',
      });
    } catch (_) {
      return '';
    }
  }

  function fmtRelativeTime(ts, lang, t) {
    if (!ts || typeof t !== 'function') return '';
    const diff = Date.now() - ts;
    if (diff < 0) return '';
    const sec = Math.floor(diff / 1000);
    if (sec < 60) return t('time.now');
    const min = Math.floor(sec / 60);
    if (min < 60) {
      const form = plural(min, t('time.min.one'), t('time.min.few'), t('time.min.many'));
      return min + ' ' + form;
    }
    const hr = Math.floor(min / 60);
    if (hr < 24) {
      const form = plural(hr, t('time.hr.one'), t('time.hr.few'), t('time.hr.many'));
      return hr + ' ' + form;
    }
    const day = Math.floor(hr / 24);
    if (day < 30) {
      const form = plural(day, t('time.day.one'), t('time.day.few'), t('time.day.many'));
      return day + ' ' + form;
    }
    return fmtDate(ts, lang);
  }

  const shortPk = pk => (pk ? pk.slice(0, 8) + '…' : '');

  function uid(prefix) {
    return (prefix || 'n') + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function debounce(fn, ms) {
    let timer = null;
    function debounced(...args) {
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => {
        timer = null;
        fn(...args);
      }, ms);
    }
    debounced.cancel = () => {
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
    };
    return debounced;
  }

  return { esc, escRe, plural, word, fmtDate, fmtTime, fmtRelativeTime, shortPk, uid, debounce };
});

// ─── CORE/I18n ─── START ────────────────────────────────────────────────────
/**
 * Интернационализация (ru/en).
 * Словари хранятся в одном месте. Все тексты интерфейса берутся только отсюда.
 */
DI.register('I18n', function (Config, bus) {
  const dicts = Object.create(null);
  const listeners = [];
  let current = 'ru';

  const saved = Config.get('lang', null);
  if (saved === 'ru' || saved === 'en') {
    current = saved;
  } else {
    current = (navigator.language || 'ru').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en';
  }

  function format(str, params) {
    const s = String(str == null ? '' : str);
    if (!params) return s;
    return s.replace(/\{(\w+)\}/g, (m, k) => (params[k] != null ? String(params[k]) : m));
  }

  function t(key, params, fallback) {
    const d = dicts[current] || {};
    let val = Object.prototype.hasOwnProperty.call(d, key) ? d[key] : undefined;
    if (val === undefined) {
      const en = dicts['en'] || {};
      val = Object.prototype.hasOwnProperty.call(en, key) ? en[key] : undefined;
    }
    return format(val !== undefined ? val : (fallback !== undefined ? fallback : key), params);
  }

  function addDict(lang, dict) {
    dicts[lang] = Object.assign(dicts[lang] || {}, dict || {});
  }

  function applyToDOM() {
    try {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (key) el.textContent = t(key);
      });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const key = el.getAttribute('data-i18n-ph');
        if (key) el.setAttribute('placeholder', t(key));
      });
      document.querySelectorAll('[data-i18n-aria]').forEach(el => {
        const key = el.getAttribute('data-i18n-aria');
        if (key) el.setAttribute('aria-label', t(key));
      });
    } catch (_) {}
  }

  function setLang(lang) {
    if (lang !== 'ru' && lang !== 'en') return;
    current = lang;
    Config.set('lang', current);
    applyToDOM();
    for (const fn of listeners.slice()) {
      try {
        fn(current);
      } catch (_) {}
    }
    try {
      bus.emit('i18n:change', { lang: current });
    } catch (_) {}
  }

  const getLang = () => current;

  function onChange(fn) {
    if (typeof fn === 'function') listeners.push(fn);
  }

  // Русский словарь
  addDict('ru', {
    'st.net': 'сеть',
    'st.ai.loading': 'модель',
    'st.ai.ready': 'ии',
    'st.ai.demo': 'ии/хеш',
    'st.net.online': 'онлайн',
    'st.net.connecting': 'соединение',
    'st.net.reconnecting': 'пересоединение',
    'st.net.failed': 'нет сети',

    'progress.title': 'Загружаем модель',

    'ed.placeholder': 'О чём думаешь?',
    'ed.chars': 'симв.',
    'ed.limit.soft': 'Для точного поиска пиши короче',
    'ed.limit.hard': 'Вектор обрезается, качество поиска низкое',
    'ed.limit.max': 'Максимум {max} символов',

    'btn.private': 'Личное',
    'btn.public': 'Мир',
    'btn.save': 'Сохранить',
    'btn.send.aria': 'Отправить',
    'btn.menu.aria': 'Меню',
    'btn.base.aria': 'Моя база',
    'btn.ctx.clear.aria': 'Снять контекст',

    'tab.stream': 'Поток',
    'tab.base': 'База',

    'seg.local': 'Моё',
    'seg.world': 'Мир',
    'seg.seren': 'Озарения',

    'ctx.pinned': 'пин',
    'ctx.drift': 'дрейф от',

    'sim.score': 'похожа на',
    'sim.level.high': 'В тему',
    'sim.level.mid': 'Озарение',

    'inf.resonance': 'резонанс',
    'inf.linked': 'по мотивам',
    'inf.openparent': 'Открыть заметку-источник',
    'inf.children': 'Потомки',
    'inf.nochildren': 'Потомков пока нет',
    'inf.lineage': 'Линейка «по мотивам»',

/**
 * Минимальный синхронный стор приложения.
 * Не содержит бизнес-логики — только состояние и подписки.
 */
DI.register('Store', function () {
  const state = {
    view: 'stream',
    seg: 'local',
    context: { source: null, noteId: null, text: '', vector: null, pinText: null },
    sendMode: 'private',
    lists: { local: [], world: [], seren: [] },
    feed: [],
  };

  const listeners = [];

  function shallowEqual(a, b) {
    if (Object.is(a, b)) return true;
    if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return false;
    const ka = Object.keys(a), kb = Object.keys(b);
    if (ka.length !== kb.length) return false;
    for (const k of ka) {
      if (!Object.is(a[k], b[k])) return false;
    }
    return true;
  }

  const snapshot = () => Object.freeze(Object.assign({}, state));

  function notify() {
    const snap = snapshot();
    for (const l of listeners.slice()) {
      try {
        l(snap);
      } catch (e) {
        console.error('[store]', e);
      }
    }
  }

  const getState = () => snapshot();
  const get = k => state[k];

  function setState(partial) {
    if (!partial || typeof partial !== 'object' || Array.isArray(partial)) return;
    Object.assign(state, partial);
    notify();
  }

  /**
   * Подписка на изменения.
   * Варианты:
   *   subscribe(listener)
   *   subscribe(selector, listener, equals?)
   */
  function subscribe(a, b, equals) {
    if (typeof b === 'function') {
      const selector = a, listener = b, eq = equals || Object.is;
      let prev = selector(snapshot());
      const wrap = s => {
        const next = selector(s);
        if (!eq(next, prev)) {
          prev = next;
          listener(next, s);
        }
      };
      listeners.push(wrap);
      return () => {
        const i = listeners.indexOf(wrap);
        if (i > -1) listeners.splice(i, 1);
      };
    }

    listeners.push(a);
    return () => {
      const i = listeners.indexOf(a);
      if (i > -1) listeners.splice(i, 1);
    };
  }

  return { getState, get, setState, subscribe, shallowEqual };
});

/**
 * Векторные операции: нормализация, cosine similarity, сжатие в base64, k-means.
 * Все векторы ожидаются нормализованными (единичная длина).
 */
DI.register('Vec', function () {
  const f32 = v => (v instanceof Float32Array ? v : Float32Array.from(v || []));

  /**
   * Сериализация вектора в compact base64 (Int16 квантование).
   * Используется для передачи векторов в Nostr-событиях.
   */
  function toB64(vec) {
    const f = f32(vec);
    const i16 = new Int16Array(f.length);

    for (let i = 0; i < f.length; i++) {
      let x = f[i];
      if (x > 1) x = 1;
      else if (x < -1) x = -1;
      i16[i] = Math.round(x * 32767);
    }

    const bytes = new Uint8Array(i16.buffer, i16.byteOffset, i16.byteLength);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) {
      bin += String.fromCharCode(bytes[i]);
    }

    return btoa(bin);
  }

  /**
   * Десериализация вектора из base64 + повторная нормализация.
   */
  function fromB64(b64) {
    try {
      const bin = atob(String(b64 || ''));
      if (!bin || bin.length < 2 || bin.length % 2 !== 0) return null;

      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }

      const i16 = new Int16Array(bytes.buffer);
      const out = new Float32Array(i16.length);
      for (let i = 0; i < i16.length; i++) {
        out[i] = i16[i] / 32767;
      }

      return normalize(out);
    } catch (_) {
      return null;
    }
  }

  /**
   * Косинусное сходство для нормализованных векторов.
   * Если векторы разной длины, сравниваем по минимальной длине.
   */
  function cosine(a, b) {
    if (!a || !b) return 0;
    const n = Math.min(a.length, b.length);
    if (!n) return 0;

    let s = 0;
    for (let i = 0; i < n; i++) {
      s += a[i] * b[i];
    }

    return s;
  }

  function normalize(v) {
    const f = f32(v);
    let norm = 0;

    for (let i = 0; i < f.length; i++) {
      norm += f[i] * f[i];
    }

    norm = Math.sqrt(norm);
    const out = new Float32Array(f.length);
    if (!norm) return out;

    for (let i = 0; i < f.length; i++) {
      out[i] = f[i] / norm;
    }

    return out;
  }

  function sqDist(a, b) {
    const n = Math.min(a.length, b.length);
    let s = 0;

    for (let i = 0; i < n; i++) {
      const d = a[i] - b[i];
      s += d * d;
    }

    return s;
  }

  /**
   * Упрощённый k-means с инициализацией k-means++.
   * Используется для центроидов префильтра входящих запросов.
   */
  function kmeans(vectors, k, iterations) {
    const iters = iterations || 10;
    const n = vectors.length;

    if (!n || !k) return [];
    if (n <= k) return vectors.map(v => f32(v));

    const dim = vectors[0].length;

    const cents = [f32(vectors[0])];
    while (cents.length < k) {
      let bestI = 0, bestD = -1;

      for (let i = 0; i < n; i++) {
        let minD = Infinity;

        for (const c of cents) {
          const d = sqDist(vectors[i], c);
          if (d < minD) minD = d;
        }

        if (minD > bestD) {
          bestD = minD;
          bestI = i;
        }
      }

      cents.push(f32(vectors[bestI]));
    }

    for (let it = 0; it < iters; it++) {
      const sums = Array.from({ length: k }, () => new Float32Array(dim));
      const counts = new Array(k).fill(0);

      for (let i = 0; i < n; i++) {
        let best = 0, bestD = Infinity;

        for (let c = 0; c < k; c++) {
          const d = sqDist(vectors[i], cents[c]);
          if (d < bestD) {
            bestD = d;
            best = c;
          }
        }

        counts[best]++;
        for (let d = 0; d < dim; d++) {
          sums[best][d] += vectors[i][d];
        }
      }

      for (let c = 0; c < k; c++) {
        if (counts[c]) {
          for (let d = 0; d < dim; d++) {
            cents[c][d] = sums[c][d] / counts[c];
          }
        }
      }
    }

    return cents;
  }

  return { toB64, fromB64, cosine, normalize, kmeans };
});

/**
 * Слой хранения: IndexedDB с fallback в память.
 * Два хранилища:
 * - notes: локальные заметки пользователя
 * - cache: сетевые заметки/ответы
 */
DI.register('DB', function (Config, bus, Logger) {
  let db = null;
  let mem = null;
  let memCache = null;
  let openPromise = null;

  const NOTES = () => Config.get('storeName', 'notes');
  const CACHE = () => Config.get('cacheStoreName', 'cache');

  function emitChange() {
    try { bus.emit('db:change'); } catch (_) {}
  }

  function emitCache() {
    try { bus.emit('db:cache'); } catch (_) {}
  }

  function open() {
    if (openPromise) return openPromise;

    openPromise = new Promise(resolve => {
      if (!window.indexedDB) {
        mem = new Map();
        memCache = new Map();
        Logger.warn('DB: IndexedDB недоступен, in-memory fallback');
        return resolve(null);
      }

      try {
        const req = indexedDB.open(Config.get('dbName', 'noomium_v2'), 1);

        req.onupgradeneeded = e => {
          const d = e.target.result;

          if (!d.objectStoreNames.contains(NOTES())) {
            d.createObjectStore(NOTES(), { keyPath: 'id' });
          }

          if (!d.objectStoreNames.contains(CACHE())) {
            d.createObjectStore(CACHE(), { keyPath: 'id' });
          }
        };

        req.onsuccess = e => {
          db = e.target.result;
          resolve(db);
        };

        req.onerror = () => {
          mem = new Map();
          memCache = new Map();
          Logger.warn('DB: ошибка открытия, fallback');
          resolve(null);
        };

        req.onblocked = () => {
          mem = new Map();
          memCache = new Map();
          Logger.warn('DB: open blocked, fallback');
          resolve(null);
        };
      } catch (err) {
        mem = new Map();
        memCache = new Map();
        Logger.warn('DB: не поддерживается, fallback', String(err));
        resolve(null);
      }
    });

    return openPromise;
  }

  function withStore(store, mode, fn, memFn) {
    return open().then(d => {
      if (!d) return memFn();

      return new Promise((res, rej) => {
        try {
          const r = fn(d.transaction(store, mode).objectStore(store));
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        } catch (e) {
          rej(e);
        }
      });
    });
  }

  function put(note) {
    return withStore(
      NOTES(),
      'readwrite',
      s => s.put(note),
      () => { mem.set(note.id, note); return note.id; }
    ).then(res => {
      emitChange();
      return res;
    });
  }

  function get(id) {
    return withStore(
      NOTES(),
      'readonly',
      s => s.get(id),
      () => mem.get(id)
    );
  }

  function del(id) {
    return withStore(
      NOTES(),
      'readwrite',
      s => s.delete(id),
      () => { mem.delete(id); }
    ).then(res => {
      emitChange();
      return res;
    });
  }

  function all() {
    return withStore(
      NOTES(),
      'readonly',
      s => s.getAll(),
      () => Array.from(mem.values())
    );
  }

  function reset() {
    return open().then(d => {
      if (!d) {
        mem.clear();
        memCache.clear();
        return;
      }

      return new Promise((res, rej) => {
        const t = d.transaction([NOTES(), CACHE()], 'readwrite');
        t.objectStore(NOTES()).clear();
        t.objectStore(CACHE()).clear();

        t.oncomplete = () => res();
        t.onerror = () => rej(t.error);
      });
    }).then(() => {
      emitChange();
      emitCache();
    });
  }

  function cachePut(note) {
    return withStore(
      CACHE(),
      'readwrite',
      s => s.put(note),
      () => { memCache.set(note.id, note); return note.id; }
    ).then(res => {
      emitCache();
      return res;
    });
  }

  function cacheGet(id) {
    return withStore(
      CACHE(),
      'readonly',
      s => s.get(id),
      () => memCache.get(id)
    );
  }

  function cacheAll() {
    return withStore(
      CACHE(),
      'readonly',
      s => s.getAll(),
      () => Array.from(memCache.values())
    );
  }

  function cacheDel(id) {
    return withStore(
      CACHE(),
      'readwrite',
      s => s.delete(id),
      () => { memCache.delete(id); }
    ).then(res => {
      emitCache();
      return res;
    });
  }

  return {
    put,
    get,
    del,
    all,
    reset,
    cachePut,
    cacheGet,
    cacheAll,
    cacheDel,
  };
}, ['Config', 'EventBus', 'Logger']);
// ─── DATA/DB ─── END ────────────────────────────────────────────────────────

// ─── AI/Embedder ─── START ──────────────────────────────────────────────────
/**
 * Embedder для Granite R2 (ModernBERT backbone).
 *
 * Архитектура модели (из документации IBM):
 * - granite-encoder-small-multilingual: 12 слоёв, 384-dim, SiLU, RoPE theta 160,000
 * - Пулинг: [CLS] (формула 3.2 в paper)
 * - Нормализация: да (косинусное сходство нормализованных векторов)
 *
 * Транспортировка:
 * - Модель грузится в Web Worker через transformers.js
 * - Fallback: FNV-1a хеш-эмбеддинг при недоступности Worker или ошибке загрузки
 */
DI.register('Embedder', function (Config, bus, Logger) {
  const workerCode = `
let extractor = null;
let ready = false;
let files = new Map();

self.onmessage = async function (e) {
  const msg = e.data;
  
  if (msg.type === 'load') {
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@latest');
      mod.env.allowLocalModels = false;
      mod.env.useBrowserCache = true;
      
      extractor = await mod.pipeline('feature-extraction', msg.model, {
        dtype: 'q8',
        progress_callback: function (p) {
          if (p.status === 'progress') {
            const fileName = p.file || p.name || 'unknown';
            files.set(fileName, { 
              loaded: p.loaded || 0, 
              total: p.total || 0,
              file: fileName
            });
            
            let totalLoaded = 0, totalSize = 0;
            files.forEach(f => { 
              totalLoaded += f.loaded; 
              if (f.total > 0) totalSize += f.total; 
            });
            
            const pct = totalSize > 0 ? (totalLoaded / totalSize) * 100 : 0;
            self.postMessage({ 
              type: 'progress', 
              pct,
              loadedMB: (totalLoaded / 1024 / 1024).toFixed(1),
              totalMB: totalSize > 0 ? (totalSize / 1024 / 1024).toFixed(1) : null,
              model: msg.model
            });
          }
        }
      });
      
      ready = true;
      self.postMessage({ type: 'ready' });
    } catch (err) {
      self.postMessage({ 
        type: 'error', 
        id: null, 
        message: String(err && err.message || err) 
      });
    }
    return;
  }
  
  if (!ready) {
    self.postMessage({ 
      type: 'error', 
      id: msg.id, 
      message: 'model not loaded' 
    });
    return;
  }
  
  if (msg.type === 'embed') {
    try {
      // Granite R2: [CLS] pooling + нормализация (согласно документации)
      const out = await extractor(msg.text, { pooling: 'cls', normalize: true });
      self.postMessage({ 
        type: 'result', 
        id: msg.id, 
        vector: Array.from(out.data) 
      });
    } catch (err) {
      self.postMessage({ 
        type: 'error', 
        id: msg.id, 
        message: String(err && err.message || err) 
      });
    }
  }
};
`;

  let worker = null;
  let workerUrl = null;
  let mode = 'loading';
  let loadPromise = null;
  let nextId = 0;
  let lastPct = 0;
  const pending = new Map();
  const progressFns = [];
  const cache = new Map();

  function emitStatus() {
    try {
      bus.emit('ai:status', { mode, percent: lastPct });
    } catch (_) {}
  }

  /**
   * Fallback: детерминированный хеш-эмбеддинг (FNV-1a).
   * Используется только если Worker/модель недоступны.
   * Качество поиска при этом нулевое, но приложение не падает.
   */
  function hashEmbed(text) {
    const DIM = Config.get('dim', 384);
    const vec = new Float32Array(DIM);
    const tokens = (text || '').toLowerCase().match(/[a-zа-яё0-9]+/gi) || [];
    
    for (const tok of tokens) {
      let h = 2166136261;
      for (let i = 0; i < tok.length; i++) {
        h ^= tok.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      vec[Math.abs(h) % DIM] += 1;
      
      const h2 = Math.imul(h ^ 0x9e3779b9, 2654435761);
      vec[Math.abs(h2) % DIM] += 0.5;
    }
    
    let norm = 0;
    for (let i = 0; i < DIM; i++) norm += vec[i] * vec[i];
    norm = Math.sqrt(norm) || 1;
    
    for (let i = 0; i < DIM; i++) vec[i] /= norm;
    return vec;
  }

  function cacheGet(key) {
    if (!cache.has(key)) return undefined;
    const v = cache.get(key);
    cache.delete(key);
    cache.set(key, v);
    return v;
  }

  function cacheSet(key, v) {
    if (cache.has(key)) {
      cache.delete(key);
    } else if (cache.size >= Config.get('aiCacheLimit', 300)) {
      cache.delete(cache.keys().next().value);
    }
    cache.set(key, v);
  }

  function cleanup() {
    pending.forEach(p => {
      clearTimeout(p.timer);
      const v = hashEmbed(p.text);
      cacheSet(p.text, v);
      p.resolve(v);
    });
    pending.clear();
    
    if (worker) {
      try { worker.terminate(); } catch (_) {}
      worker = null;
    }
    
    if (workerUrl) {
      try { URL.revokeObjectURL(workerUrl); } catch (_) {}
      workerUrl = null;
    }
  }

  function doLoad() {
    return new Promise(resolve => {
      if (typeof Worker === 'undefined') {
        mode = 'demo';
        emitStatus();
        Logger.warn('Embedder: Worker не поддерживается, demo mode');
        return resolve();
      }
      
      try {
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        workerUrl = URL.createObjectURL(blob);
        worker = new Worker(workerUrl, { type: 'module' });
      } catch (err) {
        mode = 'demo';
        emitStatus();
        Logger.warn('Embedder: не создать Worker, demo mode', String(err));
        return resolve();
      }

      // Таймаут загрузки модели: 120 секунд.
      // Если Worker не прислал 'ready' за это время, переходим в demo mode.
      // Это защищает от зависшего CDN или бесконечной загрузки.
      const LOAD_TIMEOUT = 120000;
      let resolved = false;
      
      const loadTimer = setTimeout(() => {
        if (resolved) return;
        resolved = true;
        Logger.warn('Embedder: таймаут загрузки модели (' + LOAD_TIMEOUT / 1000 + 'с), demo mode');
        cleanup();
        mode = 'demo';
        emitStatus();
        resolve();
      }, LOAD_TIMEOUT);

      worker.onerror = err => {
        if (resolved) return;
        resolved = true;
        clearTimeout(loadTimer);
        Logger.warn('Embedder: ошибка Worker, demo mode', String(err && err.message || err));
        cleanup();
        mode = 'demo';
        emitStatus();
        resolve();
      };

      worker.onmessage = e => {
        const msg = e.data;
        
        if (msg.type === 'progress') {
          lastPct = msg.pct;
          
          for (const fn of progressFns) {
            try { fn(msg); } catch (_) {}
          }
          
          try { bus.emit('ai:progress', msg); } catch (_) {}
          try {
            bus.emit('ai:status', {
              mode: 'loading',
              percent: msg.pct,
              loadedMB: msg.loadedMB,
              totalMB: msg.totalMB,
              model: msg.model,
            });
          } catch (_) {}
        }
        else if (msg.type === 'ready') {
          if (resolved) return;
          resolved = true;
          clearTimeout(loadTimer);
          mode = 'model';
          emitStatus();
          Logger.info('Embedder: модель готова');
          resolve();
        }
        else if (msg.type === 'error' && msg.id === null) {
          if (resolved) return;
          resolved = true;
          clearTimeout(loadTimer);
          Logger.warn('Embedder: ошибка загрузки модели, demo mode', msg.message);
          cleanup();
          mode = 'demo';
          emitStatus();
          resolve();
        }
        else if (msg.type === 'result') {
          const p = pending.get(msg.id);
          if (p) {
            clearTimeout(p.timer);
            pending.delete(msg.id);
            
            const vec = Float32Array.from(msg.vector);
            cacheSet(p.text, vec);
            p.resolve(vec);
          }
        }
        else if (msg.type === 'error' && msg.id != null) {
          const p = pending.get(msg.id);
          if (p) {
            clearTimeout(p.timer);
            pending.delete(msg.id);
            
            Logger.warn('Embedder: ошибка embed, hash fallback', msg.message);
            const v = hashEmbed(p.text);
            cacheSet(p.text, v);
            p.resolve(v);
          }
        }
      };

      worker.postMessage({
        type: 'load',
        model: Config.get('model', 'onnx-community/granite-embedding-97m-multilingual-r2-ONNX'),
      });
    });
  }

  return {
    load(onProgress) {
      if (typeof onProgress === 'function') {
        progressFns.push(onProgress);
      }
      
      if (mode === 'model' || mode === 'demo') {
        return Promise.resolve();
      }
      
      if (loadPromise) return loadPromise;
      
      mode = 'loading';
      emitStatus();
      loadPromise = doLoad().then(() => {
        loadPromise = null;
      });
      
      return loadPromise;
    },

    embed(text) {
      const t = (text || '').trim();
      if (!t) return Promise.resolve(null);
      
      const cached = cacheGet(t);
      if (cached) return Promise.resolve(cached);
      
      if (mode === 'demo' || !worker) {
        const v = hashEmbed(t);
        cacheSet(t, v);
        return Promise.resolve(v);
      }
      
      const id = nextId++;
      return new Promise(resolve => {
        const timer = setTimeout(() => {
          if (pending.delete(id)) {
            Logger.warn('Embedder: таймаут embed, hash fallback');
            const v = hashEmbed(t);
            cacheSet(t, v);
            resolve(v);
          }
        }, Config.get('aiEmbedTimeout', 15000));
        
        pending.set(id, { resolve, timer, text: t });
        worker.postMessage({ type: 'embed', id, text: t });
      });
    },

    ready() {
      return mode === 'model' || mode === 'demo';
    },
    
    getMode() {
      return mode;
    },
    
    onProgress(fn) {
      if (typeof fn === 'function') {
        progressFns.push(fn);
      }
    },
  };
}, ['Config', 'EventBus', 'Logger']);
// ─── AI/Embedder ─── END ────────────────────────────────────────────────────

// ─── AI/Ranker ─── START ────────────────────────────────────────────────────
/**
 * Ранжирование заметок по косинусному сходству.
 *
 * Логика порогов (адаптирована под Granite R2, диапазон ~0.55–0.93):
 *
 *   >= threshold                    → relevant («В тему»)
 *   >= threshold - serendipity      → serendipity («Озарение»)
 *   <  динамический нижний порог    → полностью скрывается
 *
 * Динамический нижний порог = max(0.40, threshold - serendipity - 0.05).
 * Это гарантирует, что даже при экстремальных настройках пользователя
 * отсечение шума не уходит ниже 0.40.
 */
DI.register('Ranker', function (Vec, Config) {
  /**
   * Пакетное вычисление косинусного сходства.
   * @param {Float32Array|number[]} queryVector - Вектор запроса.
   * @param {Array<{id: string, vector: Array|Float32Array}>} items - Заметки с векторами.
   * @param {AbortSignal} [signal] - Сигнал отмены.
   * @returns {Promise<Array<{id: string, score: number}>>} Отсортировано по убыванию.
   */
  function cosineBatch(queryVector, items, signal) {
    if (!queryVector || !items || !items.length) {
      return Promise.resolve([]);
    }
    
    if (signal && signal.aborted) {
      return Promise.reject(new Error('aborted'));
    }
    
    const out = [];
    for (const it of items) {
      if (signal && signal.aborted) {
        return Promise.reject(new Error('aborted'));
      }
      out.push({ id: it.id, score: Vec.cosine(queryVector, it.vector) });
    }
    
    out.sort((a, b) => b.score - a.score);
    return Promise.resolve(out);
  }

  /**
   * Разделение результатов на relevant и serendipity.
   * Пороги берутся из Config (настраиваются пользователем).
   *
   * @param {Array<{id: string, score: number}>} scored - Результаты cosineBatch.
   * @returns {{relevant: Array, seren: Array}}
   */
  function split(scored) {
    const threshold = Config.get('threshold', 0.81);
    const serendipity = Config.get('serendipity', 0.07);

    // Динамический нижний порог: не ниже 0.40, не выше (threshold - serendipity)
    const lowerBound = Math.max(0.40, threshold - serendipity - 0.05);
    
    const relevant = [];
    const seren = [];
    
    for (const s of scored) {
      if (s.score < lowerBound) {
        continue;
      }
      
      if (s.score >= threshold) {
        relevant.push(s);
      } else {
        seren.push(s);
      }
    }
    
    return { relevant, seren };
  }

  /**
   * Проверка на дубликат: два вектора считаются одинаковыми,
   * если их сходство >= duplicateThreshold.
   * Используется для предотвращения повторных запросов в сеть.
   *
   * Для Granite R2 (диапазон ~0.55–0.93) порог 0.88 означает
   * «практически идентичные по смыслу».
   */
  function isSimilar(a, b) {
    return Vec.cosine(a, b) >= Config.get('duplicateThreshold', 0.88);
  }

  return { cosineBatch, split, isSimilar };
}, ['Vec', 'Config']);
// ─── AI/Ranker ─── END ──────────────────────────────────────────────────────

// ─── NET/Protocol ─── START ─────────────────────────────────────────────────
/**
 * Сериализация/десериализация Nostr-событий NOOmium.
 *
 * Виды событий:
 * - kind 1:     Заметка (текст + вектор + parent)
 * - kind 21000: Запрос (вектор + параметры)
 * - kind 21001: Ответ (заметка + скор)
 * - kind 5:     Удаление (список event ID)
 *
 * Безопасность:
 * - Все входящие тексты ограничены по длине (защита от переполнения)
 * - Все входящие векторы валидируются (конечность, числовой тип)
 */
DI.register('Protocol', function (Config, Vec) {
  function findTag(tags, name) {
    if (!Array.isArray(tags)) return null;
    for (const t of tags) {
      if (Array.isArray(t) && t[0] === name) return t;
    }
    return null;
  }

  function noteEvent(note, room) {
    const tags = [['t', room]];
    if (note.vector) tags.push(['v', Vec.toB64(note.vector)]);
    if (note.parentId) tags.push(['parent', note.parentId, note.parentPubkey || '']);
    
    return {
      kind: Config.get('kNote', 1),
      created_at: Math.floor((note.createdAt || Date.now()) / 1000),
      tags,
      content: note.text || '',
    };
  }

  function decodeNote(ev) {
    if (!ev || ev.kind !== Config.get('kNote', 1)) return null;
    
    // Защита от переполнения: ограничиваем длину входящего текста
    const maxLen = Config.get('maxNoteTextLength', 10000);
    if (typeof ev.content === 'string' && ev.content.length > maxLen) return null;
    
    const vTag = findTag(ev.tags, 'v');
    const pTag = findTag(ev.tags, 'parent');
    
    return {
      id: ev.id,
      text: ev.content || '',
      vector: vTag ? Vec.fromB64(vTag[1]) : null,
      shared: true,
      authorPubkey: ev.pubkey,
      parentId: pTag ? pTag[1] : null,
      parentPubkey: pTag ? (pTag[2] || null) : null,
      createdAt: (ev.created_at || 0) * 1000,
    };
  }

  function queryEvent(vector, maxResponses, window) {
    return {
      kind: Config.get('kQuery', 21000),
      created_at: Math.floor(Date.now() / 1000),
      tags: [['t', Config.get('room', 'noomium-main')]],
      content: JSON.stringify({ vector: Array.from(vector), maxResponses, window }),
    };
  }

  function decodeQuery(ev) {
    if (!ev || ev.kind !== Config.get('kQuery', 21000)) return null;
    
    let data;
    try {
      data = JSON.parse(ev.content);
    } catch (_) {
      return null;
    }
    
    if (!data || !Array.isArray(data.vector) || !data.vector.length) return null;
    
    for (const x of data.vector) {
      if (typeof x !== 'number' || !isFinite(x)) return null;
    }
    
    return {
      vector: data.vector,
      maxResponses: typeof data.maxResponses === 'number' ? data.maxResponses : Config.get('maxResponses', 8),
      window: typeof data.window === 'number' ? data.window : Config.get('responseWindow', 6000),
      authorPubkey: ev.pubkey,
      queryId: ev.id,
    };
  }

  function answerEvent(note, score, queryId, room) {
    return {
      kind: Config.get('kAnswer', 21001),
      created_at: Math.floor(Date.now() / 1000),
      tags: [['t', room], ['e', queryId]],
      content: JSON.stringify({
        noteId: note.id,
        text: note.text,
        vector: note.vector ? Array.from(note.vector) : null,
        score,
      }),
    };
  }

  function decodeAnswer(ev) {
    if (!ev || ev.kind !== Config.get('kAnswer', 21001)) return null;
    
    const eTag = findTag(ev.tags, 'e');
    if (!eTag) return null;
    
    let data;
    try {
      data = JSON.parse(ev.content);
    } catch (_) {
      return null;
    }
    
    if (!data || typeof data.text !== 'string') return null;
    if (data.text.length > Config.get('maxAnswerTextLength', 10000)) return null;
    
    let vector = null;
    if (Array.isArray(data.vector)) {
      for (const x of data.vector) {
        if (typeof x !== 'number' || !isFinite(x)) return null;
      }
      vector = data.vector;
    }
    
    return {
      id: ev.id,
      queryId: eTag[1],
      noteId: data.noteId || ev.id,
      text: data.text,
      vector,
      score: typeof data.score === 'number' ? data.score : 0,
      authorPubkey: ev.pubkey,
      createdAt: (ev.created_at || 0) * 1000,
    };
  }

  function deleteEvent(eventIds, room) {
    const ids = Array.isArray(eventIds) ? eventIds : [eventIds];
    const tags = ids.filter(Boolean).map(id => ['e', id]);
    
    if (!tags.length) return null;
    if (room) tags.push(['t', room]);
    
    return {
      kind: Config.get('kDelete', 5),
      created_at: Math.floor(Date.now() / 1000),
      tags,
      content: '',
    };
  }

  function decodeDelete(ev) {
    if (!ev || ev.kind !== Config.get('kDelete', 5)) return null;
    
    const eTags = (ev.tags || []).filter(t => Array.isArray(t) && t[0] === 'e' && t[1]);
    if (!eTags.length) return null;
    
    return {
      eventIds: eTags.map(t => t[1]),
      authorPubkey: ev.pubkey,
    };
  }

  return {
    noteEvent,
    decodeNote,
    queryEvent,
    decodeQuery,
    answerEvent,
    decodeAnswer,
    deleteEvent,
    decodeDelete,
  };
}, ['Config', 'Vec']);
// ─── NET/Protocol ─── END ───────────────────────────────────────────────────

// ─── NET/Nostr ─── START ────────────────────────────────────────────────────
/**
 * Транспортный слой Nostr.
 * Управляет ключами, пулом рэлеев, публикацией и подписками.
 * Не содержит бизнес-логики — только отправка/приём.
 */
DI.register('Nostr', function (Config, bus, Logger) {
  const CDN = 'https://cdn.jsdelivr.net/npm/nostr-tools@2.7.2/+esm';
  const SK_KEY = 'noomium:sk';

  let nostr = null;
  let pool = null;
  let sk = null;
  let pk = null;
  let initPromise = null;

  function loadKey() {
    try {
      const hex = localStorage.getItem(SK_KEY);
      if (hex && /^[0-9a-f]{64}$/i.test(hex)) {
        return new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
      }
    } catch (_) {}
    return null;
  }

  function saveKey(key) {
    try {
      localStorage.setItem(
        SK_KEY,
        Array.from(key).map(b => b.toString(16).padStart(2, '0')).join('')
      );
    } catch (_) {}
  }

  function init() {
    if (initPromise) return initPromise;
    
    initPromise = import(CDN).then(mod => {
      nostr = (typeof mod.generateSecretKey === 'function')
        ? mod
        : (mod.default && typeof mod.default.generateSecretKey === 'function' ? mod.default : mod);
      
      if (typeof nostr.generateSecretKey !== 'function') {
        throw new Error('nostr-tools: несовместимый модуль');
      }

      sk = loadKey();
      if (!sk) {
        sk = nostr.generateSecretKey();
        saveKey(sk);
      }
      
      pk = nostr.getPublicKey(sk);
      pool = new nostr.SimplePool();
      
      Logger.info('Nostr: готов, pubkey ' + pk.slice(0, 8) + '…');
      return pk;
    }).catch(err => {
      initPromise = null;
      Logger.error('Nostr: не загрузить nostr-tools', String(err && err.message || err));
      try { bus.emit('net:status', { status: 'failed' }); } catch (_) {}
      throw err;
    });
    
    return initPromise;
  }

  function relays() {
    return Config.get('relays', []);
  }

  function sign(template) {
    if (!nostr || !sk) throw new Error('Nostr not ready');
    return nostr.finalizeEvent(template, sk);
  }

  /**
   * Публикация события на все настроенные рэлеи.
   * Резолвится при успехе хотя бы на одном рэлее.
   */
  function publish(template) {
    let ev;
    try {
      ev = sign(template);
    } catch (e) {
      return Promise.reject(e);
    }
    
    if (!pool) return Promise.reject(new Error('Nostr not ready'));
    
    const urls = relays();
    if (!urls.length) return Promise.reject(new Error('no relays configured'));
    
    // Таймаут публикации: если ни один релей не ответил за 30 секунд, фейлим.
    // Это защищает от зависших WebSocket-соединений, которые никогда не резолвятся.
    const PUBLISH_TIMEOUT = 30000;
    
    const publishPromise = new Promise((resolve, reject) => {
      let settled = false;
      let failures = 0;
      
      urls.forEach(url => {
        pool.ensureRelay(url)
          .then(relay => relay.publish(ev))
          .then(() => {
            if (!settled) {
              settled = true;
              resolve(ev);
            }
          })
          .catch(err => {
            failures++;
            Logger.warn('Nostr: релей ' + url + ' не принял', String(err && err.message || err));
            
            if (!settled && failures === urls.length) {
              settled = true;
              reject(new Error('no relay accepted'));
            }
          });
      });
    });
    
    const timeoutPromise = new Promise((_, reject) => {
      setTimeout(() => reject(new Error('publish timeout')), PUBLISH_TIMEOUT);
    });
    
    return Promise.race([publishPromise, timeoutPromise]);
  }

  function subscribe(filters, handlers) {
    if (!pool) return null;
    return pool.subscribeMany(relays(), filters, handlers);
  }

  function ensureRelay(url) {
    if (!pool) return Promise.reject(new Error('Nostr not ready'));
    return pool.ensureRelay(url);
  }

  function getPubkey() {
    return pk;
  }

  function isReady() {
    return !!(nostr && sk && pool);
  }

  function close() {
    if (pool && typeof pool.close === 'function') {
      try { pool.close(relays()); } catch (_) {}
    }
  }

  return {
    init,
    sign,
    publish,
    subscribe,
    ensureRelay,
    getPubkey,
    isReady,
    relays,
    close,
  };
}, ['Config', 'EventBus', 'Logger']);
// ─── NET/Nostr ─── END ──────────────────────────────────────────────────────

// ─── NET/NetService ─── START ───────────────────────────────────────────────
/**
 * Оркестрация Nostr-сети: подписки, публикация, обработка входящих событий.
 *
 * Ключевые механизмы:
 * - Входящие заметки принимаются через token bucket, чтобы не резать первичную синхронизацию.
 * - seen добавляется только после принятия события.
 * - Офлайн-операции публикуются через persistent outbox:
 *   - заметки, которые нужно анонсировать;
 *   - delete-события, которые нужно отправить позже.
 * - При появлении сети приложение автоматически переподключается и сбрасывает очередь.
 */
DI.register('NetService', function (Nostr, Protocol, DB, Ranker, Vec, Store, Config, Logger, bus) {
  let started = false;
  let startPromise = null;
  let subscription = null;
  let hbTimer = null;
  let activeQueryId = null;
  let lastQueryVec = null;
  let lastQueryTime = 0;
  let centroids = [];
  let contextUnsub = null;
  let hasReceivedEvent = false;
  let flushing = false;
  let flushTimer = null;
  let startRetryTimer = null;
  let onlineListenerAdded = false;
  let busUnsubs = [];

  const seen = new Set();
  const contentSeen = new Map();
  const peers = new Map();
  const peerQueryTimes = new Map();
  const peerNoteBudgets = new Map();

  let currentWindow = Config.get('subWindow', 300);
  let historyLoading = false;
  let subEpoch = 0;

  const OUTBOX_KEY = 'noomium:outbox';

  function loadOutbox() {
    try {
      const raw = localStorage.getItem(OUTBOX_KEY);
      if (raw) {
        const o = JSON.parse(raw);
        return {
          announce: Array.isArray(o.announce) ? o.announce.filter(Boolean) : [],
          del: Array.isArray(o.del) ? o.del.filter(Boolean) : [],
        };
      }
    } catch (_) {}

    return { announce: [], del: [] };
  }

  function saveOutbox() {
    try {
      localStorage.setItem(OUTBOX_KEY, JSON.stringify(outbox));
    } catch (_) {}
  }

  let outbox = loadOutbox();

  const kNote = () => Config.get('kNote', 1);
  const kQuery = () => Config.get('kQuery', 21000);
  const kAnswer = () => Config.get('kAnswer', 21001);
  const kDelete = () => Config.get('kDelete', 5);
  const room = () => Config.get('room', 'noomium-main');

  function setStatus(s) {
    try { bus.emit('net:status', { status: s }); } catch (_) {}
  }

  function notifyPeers() {
    try { bus.emit('net:peers', { count: peers.size }); } catch (_) {}
  }

  function emitHistory(loading, windowSec) {
    try { bus.emit('net:history', { loading: loading, window: windowSec }); } catch (_) {}
  }

  function isOffline() {
    return typeof navigator !== 'undefined' && navigator.onLine === false;
  }

  function canPublish() {
    return Nostr.isReady() && !isOffline();
  }

  // ─── Outbox ────────────────────────────────────────────────────────────────

  function queueAnnounce(noteId) {
    if (!noteId) return;

    if (outbox.announce.indexOf(noteId) === -1) {
      outbox.announce.push(noteId);
      saveOutbox();
    }

    scheduleFlush();
  }

  function unqueueAnnounce(noteId) {
    if (!noteId) return;

    const i = outbox.announce.indexOf(noteId);
    if (i > -1) {
      outbox.announce.splice(i, 1);
      saveOutbox();
    }
  }

  function queueDelete(eventId) {
    if (!eventId) return;

    if (outbox.del.indexOf(eventId) === -1) {
      outbox.del.push(eventId);
      saveOutbox();
    }

    scheduleFlush();
  }

  function unqueueDelete(eventId) {
    if (!eventId) return;

    const i = outbox.del.indexOf(eventId);
    if (i > -1) {
      outbox.del.splice(i, 1);
      saveOutbox();
    }
  }

  function scheduleFlush(delay) {
    if (flushTimer) return;

    flushTimer = setTimeout(() => {
      flushTimer = null;
      flushOutbox();
    }, delay || 5000);
  }

  /**
   * Сброс накопившихся офлайн-операций.
   * Вызывается при появлении сети, при подключении и по таймеру.
   */
  function flushOutbox() {
    if (flushing) return;
    if (!canPublish()) return;
    if (!outbox.announce.length && !outbox.del.length) return;

    flushing = true;

    const announceIds = outbox.announce.slice();

    // Каждый task обрабатывается независимо.
    // Если один зависнет или упадёт, остальные продолжат работу.
    // Promise.allSettled вместо Promise.all — ждём завершения ВСЕХ,
    // независимо от успеха/ошибки каждого.
    const tasks = announceIds.map(noteId => {
      return DB.get(noteId).then(note => {
        if (!note || !note.shared || !note.vector || note.eventId) {
          unqueueAnnounce(noteId);
          return;
        }

        return Nostr.publish(Protocol.noteEvent(note, room()))
          .then(ev => {
            unqueueAnnounce(noteId);

            if (ev && ev.id && note.id) {
              DB.get(note.id).then(cur => {
                if (cur && cur.eventId !== ev.id) {
                  cur.eventId = ev.id;
                  DB.put(cur);
                  migrateChildrenParentId(cur.id, cur.eventId);
                }
              }).catch(() => {});
            }
          })
          .catch(() => {
            // Оставляем в очереди для повторной попытки.
          });
      }).catch(() => {
        unqueueAnnounce(noteId);
      });
    });

    Promise.allSettled(tasks).then(() => {
      const deleteIds = outbox.del.slice();

      if (deleteIds.length) {
        const ev = Protocol.deleteEvent(deleteIds, room());

        if (ev) {
          return Nostr.publish(ev)
            .then(() => {
              outbox.del = [];
              saveOutbox();
            })
            .catch(() => {
              // Оставляем delete-очередь для повторной попытки.
            });
        }
      }
    }).catch(() => {}).finally(() => {
      flushing = false;

      if (outbox.announce.length || outbox.del.length) {
        scheduleFlush(10000);
      }
    });
  }

  /**
   * Ищем локальные опубликованные заметки, у которых ещё нет eventId.
   * Это чинит заметки, созданные офлайн или пережившие перезагрузку.
   */
  function scanLocalUnpublished() {
    DB.all().then(notes => {
      notes.forEach(n => {
        if (n && n.shared && n.vector && !n.eventId) {
          queueAnnounce(n.id);
        }
      });

      flushOutbox();
    }).catch(() => {});
  }

  // ─── Вспомогательные сети ─────────────────────────────────────────────────

  function ensureOnlineListener() {
    if (onlineListenerAdded) return;
    onlineListenerAdded = true;

    window.addEventListener('online', () => {
      if (!started) {
        start();
        return;
      }

      if (!subscription && !isOffline()) {
        subscribeToRoom();
      }

      flushOutbox();
    });

    window.addEventListener('offline', () => {
      if (!started) return;

      setStatus('failed');

      // Инвалидируем текущую подписку, чтобы onclose не запускал переподключение.
      subEpoch++;

      if (subscription && typeof subscription.close === 'function') {
        try { subscription.close(); } catch (_) {}
      }

      subscription = null;
    });
  }

  function trimSeen() {
    const max = Config.get('seenMaxSize', 1000);
    if (seen.size <= max) return;

    const arr = Array.from(seen);
    seen.clear();

    for (let i = arr.length - Math.floor(max / 2); i < arr.length; i++) {
      seen.add(arr[i]);
    }
  }

  function isContentDuplicate(pubkey, text) {
    const key = pubkey + '::' + String(text || '').trim();
    if (contentSeen.has(key)) return true;

    contentSeen.set(key, true);

    if (contentSeen.size > 2000) {
      const first = contentSeen.keys().next().value;
      contentSeen.delete(first);
    }

    return false;
  }

  /**
   * Token bucket для входящих заметок от одного автора.
   * Стартовый бюджет позволяет нормально загрузить исторические заметки
   * при первичной синхронизации, но всё равно защищает от откровенного флуда.
   */
  function allowIncomingNote(pubkey) {
    const now = Date.now();
    const capacity = Math.max(1, Number(Config.get('maxIncomingNotesPerPeer', 20)) || 20);
    const refillPerSec = 2;

    let bucket = peerNoteBudgets.get(pubkey);

    if (!bucket) {
      bucket = { tokens: capacity, ts: now };
      peerNoteBudgets.set(pubkey, bucket);
    }

    const elapsedSec = Math.max(0, (now - bucket.ts) / 1000);
    if (elapsedSec > 0) {
      bucket.tokens = Math.min(capacity, bucket.tokens + elapsedSec * refillPerSec);
      bucket.ts = now;
    }

    if (bucket.tokens >= 1) {
      bucket.tokens -= 1;
      return true;
    }

    return false;
  }

  function rebuildCentroids() {
    DB.all().then(notes => {
      const vecs = notes.filter(n => n.shared && n.vector).map(n => n.vector);
      if (!vecs.length) {
        centroids = [];
        return;
      }

      centroids = Vec.kmeans(
        vecs,
        Math.min(Config.get('centroidCount', 12), vecs.length),
        8
      );
    }).catch(() => {});
  }
