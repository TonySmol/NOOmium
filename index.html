<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>NOOmium</title>

<!-- ═══ PWA: манифест и иконки ═══ -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">

<!-- ═══ iOS PWA meta-теги ═══ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOOmium">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* ═══════════════════════════════════════════════════════════════════════════════
   ЦВЕТОВАЯ СИСТЕМА (DARK / LIGHT)
   Нейтральная, высококонтрастная палитра. Linear / Vercel / Stripe.
   ═══════════════════════════════════════════════════════════════════════════════ */

:root {
  /* Тёмная тема (по умолчанию) */
  --bg: #0a0a0b;
  --bg-2: #111113;
  --surface: #141417;
  --surface-2: #1c1c20;
  --surface-3: #26262c;
  
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.13);
  
  --text: #fafafa;
  --text-2: #a1a1aa;
  --text-3: #71717a;
  
  /* Акценты */
  --amber: #f59e0b;
  --amber-glow: rgba(245, 158, 11, 0.12);
  --amber-hover: #d97706;
  
  --teal: #14b8a6;
  --teal-glow: rgba(20, 184, 166, 0.12);
  --teal-hover: #0d9488;
  
  --rose: #f43f5e;
  --rose-glow: rgba(244, 63, 94, 0.12);
  --rose-hover: #e11d48;
  
  --green: #22c55e;
  --green-glow: rgba(34, 197, 94, 0.12);
  
  /* Шрифты */
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  
  /* Радиусы */
  --r: 12px;
  --r-sm: 8px;
  --r-xs: 6px;
  
  /* Анимации */
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  
  /* Безопасные зоны (iOS) */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  
  /* Тени */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.4);
  --shadow-xl: 0 24px 64px rgba(0, 0, 0, 0.5);
}

/* Светлая тема */
[data-theme="light"] {
  --bg: #fafafa;
  --bg-2: #ffffff;
  --surface: #ffffff;
  --surface-2: #f4f4f5;
  --surface-3: #e4e4e7;
  
  --line: rgba(0, 0, 0, 0.06);
  --line-2: rgba(0, 0, 0, 0.12);
  
  --text: #18181b;
  --text-2: #52525b;
  --text-3: #a1a1aa;
  
  --amber: #d97706;
  --amber-glow: rgba(217, 119, 6, 0.1);
  --amber-hover: #b45309;
  
  --teal: #0d9488;
  --teal-glow: rgba(13, 148, 136, 0.1);
  --teal-hover: #0f766e;
  
  --rose: #e11d48;
  --rose-glow: rgba(225, 29, 72, 0.1);
  --rose-hover: #be123c;
  
  --green: #16a34a;
  --green-glow: rgba(22, 163, 74, 0.1);
  
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.12);
  --shadow-xl: 0 24px 64px rgba(0, 0, 0, 0.16);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   СБРОС И БАЗОВЫЕ СТИЛИ
   ═══════════════════════════════════════════════════════════════════════════════ */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 15px / 1.55 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Глобальный запрет выделения текста (эстетика и защита от случайного копирования).
   Исключения: поля ввода и режим редактирования заметок. */
body {
  background-image:
    radial-gradient(720px 460px at 92% -6%, var(--amber-glow), transparent 60%),
    radial-gradient(720px 480px at -6% 108%, var(--teal-glow), transparent 60%);
  background-attachment: fixed;
  transition: background-color 0.3s var(--ease);
  -webkit-user-select: none;
  user-select: none;
}

/* Разрешаем выделение в полях ввода */
input,
textarea,
[contenteditable="true"] {
  -webkit-user-select: text;
  user-select: text;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

input, textarea, select {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  outline: none;
}

/* Скроллбар */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
::-webkit-scrollbar-track { background: transparent; }

/* Фокус: только для клавиатурной навигации, янтарный */
:focus { outline: none; }

:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}

/* Выделение текста: насыщенный янтарный */
::selection {
  background: rgba(245, 158, 11, 0.25);
  color: var(--text);
}

[data-theme="light"] ::selection {
  background: rgba(217, 119, 6, 0.2);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   УНИВЕРСАЛЬНАЯ СИСТЕМА КНОПОК
   Единый визуальный язык для всех интерактивных элементов.
   Модификаторы: .primary, .danger, .ghost, .icon
   ═══════════════════════════════════════════════════════════════════════════════ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 8px 16px;
  border-radius: var(--r-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  background: var(--surface-2);
  border: 1px solid var(--line);
  transition: background 0.12s var(--ease),
              color 0.12s var(--ease),
              border-color 0.12s var(--ease),
              transform 0.1s var(--ease);
  -webkit-user-select: none;
  user-select: none;
  white-space: nowrap;
  line-height: 1;
}

.btn:hover:not(:disabled) {
  background: var(--surface-3);
  color: var(--text);
  border-color: var(--line-2);
}

.btn:active:not(:disabled) {
  transform: scale(0.97);
}

.btn:disabled {
  opacity: 0.5;
  cursor: wait;
}

.btn.primary {
  background: var(--amber);
  color: #1a1206;
  border-color: transparent;
  box-shadow: var(--shadow-sm);
}

.btn.primary:hover:not(:disabled) {
  background: var(--amber-hover);
  color: #1a1206;
}

.btn.danger {
  color: var(--rose);
  background: var(--rose-glow);
  border-color: transparent;
}

.btn.danger:hover:not(:disabled) {
  background: var(--rose);
  color: #fff;
}

.btn.ghost {
  background: transparent;
  border-color: transparent;
}

.btn.ghost:hover:not(:disabled) {
  background: var(--surface-2);
}

.btn.icon {
  width: 40px;
  padding: 0;
}

.btn svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ОСНОВНАЯ СТРУКТУРА
   ═══════════════════════════════════════════════════════════════════════════════ */

#app {
  display: none;
  flex-direction: column;
  height: 100dvh;
  max-height: 100dvh;
  position: relative;
  overflow: hidden;
}

body.ready #app { display: flex; }

/* ═══════════════════════════════════════════════════════════════════════════════
   ШАПКА (HEADER)
   ═══════════════════════════════════════════════════════════════════════════════ */

#hdr {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  padding-top: calc(10px + var(--safe-top));
  min-height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

.logo {
  font: 600 18px / 1 var(--display);
  letter-spacing: -0.02em;
  color: var(--text);
  flex-shrink: 0;
}

.logo b {
  color: var(--amber);
  font-weight: 700;
}

#hdr-status {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  justify-content: flex-end;
  font: 500 11px / 1 var(--mono);
  color: var(--text-3);
  overflow: hidden;
  min-width: 0;
}

.st {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: color 0.15s var(--ease);
}

.st .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-3);
  flex-shrink: 0;
  transition: background 0.2s var(--ease), box-shadow 0.2s var(--ease);
}

.st .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green-glow); }
.st .dot.warn { background: var(--amber); box-shadow: 0 0 6px var(--amber-glow); }
.st .dot.err { background: var(--rose); box-shadow: 0 0 6px var(--rose-glow); }
.st .dot.load {
  background: var(--teal);
  box-shadow: 0 0 6px var(--teal-glow);
  animation: pulse 1.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

/* Кнопки-иконки в шапке */
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  font-size: 16px;
  transition: background 0.15s var(--ease), color 0.15s var(--ease), transform 0.1s var(--ease);
  flex-shrink: 0;
}

.icon-btn:hover {
  background: var(--surface-2);
  color: var(--text);
}

.icon-btn:active {
  background: var(--surface-3);
  transform: scale(0.96);
}

.icon-btn.active {
  background: var(--amber-glow);
  color: var(--amber);
}

/* Бургер-меню */
#btn-menu {
  flex-direction: column;
  gap: 4px;
}

#btn-menu i {
  width: 16px;
  height: 2px;
  background: currentColor;
  border-radius: 1px;
  display: block;
  transition: transform 0.2s var(--ease);
}

/* Оффлайн-бар */
#offline-bar {
  display: none;
  background: var(--rose-glow);
  color: var(--rose);
  font: 500 11px / 1 var(--mono);
  padding: 6px 16px;
  text-align: center;
  border-bottom: 1px solid var(--line-2);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ОСНОВНОЙ КОНТЕНТ (MAIN)
   ═══════════════════════════════════════════════════════════════════════════════ */

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
  position: relative;
}

/* Баннер контекста */
#ctx-banner {
  display: none;
  align-items: center;
  gap: 10px;
  margin: 10px 14px 0;
  padding: 10px 12px;
  background: var(--amber-glow);
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  font-size: 12px;
}

#ctx-banner.on { display: flex; }

#ctx-banner .ctx-src {
  font: 600 10px / 1 var(--mono);
  color: var(--amber);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  flex-shrink: 0;
}

#ctx-banner .ctx-txt {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  min-width: 0;
}

#ctx-banner .ctx-x {
  color: var(--text-3);
  font-size: 14px;
  width: 24px;
  height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  transition: background 0.15s var(--ease), color 0.15s var(--ease);
  flex-shrink: 0;
}

#ctx-banner .ctx-x:hover {
  background: var(--surface-2);
  color: var(--text);
}

/* Сегменты (табы) */
#seg {
  display: none;
  gap: 2px;
  margin: 10px 14px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  flex-shrink: 0;
}

#seg.on { display: flex; }

.seg-b {
  flex: 1;
  padding: 8px 6px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s var(--ease);
  -webkit-user-select: none;
  user-select: none;
  min-width: 0;
}

.seg-b:hover:not(.on) {
  color: var(--text-2);
  background: var(--surface-2);
}

.seg-b.on {
  background: var(--surface-2);
  color: var(--text);
}

.seg-b .cnt {
  font: 600 10px / 1 var(--mono);
  padding: 2px 6px;
  border-radius: 9px;
  background: var(--surface-3);
  color: var(--text-2);
  min-width: 18px;
  text-align: center;
  transition: all 0.15s var(--ease);
  flex-shrink: 0;
}

.seg-b.on .cnt {
  background: var(--amber-glow);
  color: var(--amber);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ЛЕНТА
   ═══════════════════════════════════════════════════════════════════════════════ */

#feed-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
}

#feed {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: 10px 14px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}

/* Карточка заметки */
.note {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  animation: noteIn 0.25s var(--ease-out) both;
  display: flex;
  flex-direction: column;
}

.note:hover {
  border-color: var(--line-2);
  box-shadow: var(--shadow-sm);
}

.note.pinned {
  border-color: var(--amber);
  box-shadow: 0 0 0 1px var(--amber-glow), var(--shadow-sm);
}

@keyframes noteIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.note-txt {
  font-size: 15px;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 10px;
  color: var(--text);
  line-height: 1.55;
}

/* Мета-блок: прижат к низу, адаптивный */
.note-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 400 11px / 1 var(--mono);
  color: var(--text-3);
  flex-wrap: wrap;
  letter-spacing: 0;
  margin-top: auto;
  padding-top: 10px;
}

/* Теги */
.note-tag {
  padding: 3px 7px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  line-height: 1;
  flex-shrink: 0;
  white-space: nowrap;
}

.note-tag.priv {
  background: var(--surface-3);
  color: var(--text-2);
}

.note-tag.world {
  background: var(--teal-glow);
  color: var(--teal);
}

/* Вертикальный разделитель между группами */
.note-meta-sep {
  width: 1px;
  height: 14px;
  background: var(--line-2);
  flex-shrink: 0;
}

/* Кнопки навигации: стрелка и ромб (24×24, бирюзовые) */
.note-sim,
.note-parent {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-xs);
  color: var(--teal);
  font-size: 11px;
  font-weight: 600;
  width: 24px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s var(--ease), border-color 0.12s var(--ease), color 0.12s var(--ease);
  flex-shrink: 0;
  line-height: 1;
  cursor: pointer;
}

.note-sim:hover:not(:disabled),
.note-parent:hover:not(:disabled) {
  background: var(--surface-3);
  border-color: var(--line-2);
}

.note-parent.orphan {
  opacity: 0.35;
  text-decoration: line-through;
  cursor: default;
  pointer-events: none;
}

/* Индикатор сходства (проценты или сигнал) */
.note-sim-info {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
  font-size: 11px;
  font-family: var(--mono);
  letter-spacing: 0;
  white-space: nowrap;
  flex-shrink: 0;
  color: var(--amber);
}

/* Палочки индикатора сигнала */
.sig-bar {
  display: inline-block;
  width: 4px;
  height: 12px;
  border-radius: 1px;
  flex-shrink: 0;
}

.sig-bar.sig-full {
  background: var(--amber);
}

.sig-bar.sig-empty {
  background: var(--surface-3);
}

/* Текстовая метка рядом с индикатором */
.sig-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-2);
}

/* Время — серый, прижато вправо */
.note-date {
  color: var(--text-3);
  font-size: 11px;
  font-family: var(--mono);
  letter-spacing: 0;
  white-space: nowrap;
  flex-shrink: 0;
  margin-left: auto;
}

/* Кнопка карандаша (24×24) */
.na {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-xs);
  color: var(--text-2);
  font-size: 12px;
  width: 24px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s var(--ease), color 0.12s var(--ease), border-color 0.12s var(--ease);
  flex-shrink: 0;
  line-height: 1;
}

.na:hover {
  background: var(--surface-3);
  color: var(--amber);
  border-color: var(--amber);
}

/* Пустое состояние */
#feed-empty {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px;
  color: var(--text-3);
}

#feed-empty.on { display: flex; }

#feed-empty .ic {
  font: 700 30px / 1 var(--display);
  opacity: 0.4;
  margin-bottom: 12px;
}

#feed-empty-t {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
}

/* Кнопка "Загрузить ещё" */
.hist-btn {
  align-self: center;
  margin: 8px 0 10px;
  padding: 8px 18px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--text-2);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s var(--ease);
}

.hist-btn:hover:not(:disabled) {
  border-color: var(--amber);
  color: var(--text);
  background: var(--amber-glow);
}

.hist-btn:disabled {
  opacity: 0.5;
  cursor: default;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   КОМПОЗЕР (ПОЛЕ ВВОДА)
   ═══════════════════════════════════════════════════════════════════════════════ */

#composer {
  margin: 0 14px 12px;
  padding: 10px 12px;
  padding-bottom: calc(10px + var(--safe-bot));
  background: var(--surface);

<!-- ═══ РЕГИСТРАЦИЯ SERVICE WORKER (отдельно от модуля, чтобы работал всегда) ═══ -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => {
          console.log('[SW] зарегистрирован:', reg.scope);
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  newWorker.postMessage('SKIP_WAITING');
                }
              });
            }
          });
        })
        .catch(err => console.warn('[SW] регистрация упала:', err));
    });
  }
</script>

<script type="module">
'use strict';

// ═══════════════════════════════════════════════════════════════════════════════
// ВЕРСИЯ ПРИЛОЖЕНИЯ
// ═══════════════════════════════════════════════════════════════════════════════
const APP_VERSION = '0.6.0';

// ═══════════════════════════════════════════════════════════════════════════════
// CORE/DI - ПРЕАМБУЛА
// ═══════════════════════════════════════════════════════════════════════════════
const DI = (() => {
  const factories = new Map();
  const instances = new Map();
  
  function register(name, factory, deps) {
    factories.set(name, { factory, deps: deps || [] });
  }
  
  function resolve(name, visiting) {
    if (instances.has(name)) return instances.get(name);
    const def = factories.get(name);
    if (!def) throw new Error('Module not found: ' + name);
    visiting = visiting || new Set();
    if (visiting.has(name)) throw new Error('Circular dependency: ' + name);
    visiting.add(name);
    const args = def.deps.map(d => resolve(d, visiting));
    visiting.delete(name);
    const inst = def.factory(...args);
    instances.set(name, inst);
    return inst;
  }
  
  return { register, resolve };
})();
